var Widgets={
  paths:function(host){
    var seed=Math.floor(Math.random()*1e6);
    host.innerHTML=_t(328,'<h4>Delapan kemungkinan jalur selama 5 tahun</h4><div class="ctl"><div class="field"><label for="pf">Volatilitas</label><select class="input" id="pf"><option value="3">Rendah (3% per tahun)</option><option value="15" selected>Sedang (15% per tahun)</option><option value="40">Tinggi (40% per tahun)</option></select></div><button class="btn btn-sm" type="button" id="pr">Acak ulang</button></div><div class="chart"></div><p class="out" id="po" aria-live="polite"></p>');
    var ch=$('.chart',host),sel=$('#pf',host),out=$('#po',host);
    function build(){
      var sig=Number(sel.value)/100,r=rng(seed),mu=.07,drift=(mu-sig*sig/2)/12,s=sig/Math.sqrt(12),paths=[],ends=[];
      for(var k=0;k<8;k++){var v=100,arr=[100];for(var m=1;m<=60;m++){v*=Math.exp(drift+s*gauss(r));arr.push(v);}paths.push(arr);ends.push(v);}
      var lo=Math.min.apply(null,ends),hi=Math.max.apply(null,ends);
      out.textContent=_t(329,'Dari 8 jalur yang dimulai di 100: nilai akhir terendah ')+nf(lo,0)+_t(330,', tertinggi ')+nf(hi,0)+_t(331,'. Ini ilustrasi, bukan prediksi.');
      return {series:paths.map(function(p){return {v:p,color:'var(--s1)',width:1.5,opacity:.6};}),axis:'right',baseline:100,noDots:true,label:_t(333,'Delapan jalur simulasi'),yFmt:function(t){return nf(t,0);},xLabel:function(i){return i===0?_t(334,'Awal'):nf(i/12,0)+(LANG==='en'?' yr':' th');}};
    }
    Charts.mount(ch,build);
    sel.addEventListener('change',function(){Charts.draw(ch);});
    $('#pr',host).addEventListener('click',function(){seed=Math.floor(Math.random()*1e6);Charts.draw(ch);});
  },
  candles:function(host){
    var candles=[],r=rng(4242),price=100,i,sel=17;
    for(i=0;i<24;i++){var o=price,c=o*(1+gauss(r)*0.022),hi=Math.max(o,c)*(1+Math.abs(gauss(r))*0.012),lo=Math.min(o,c)*(1-Math.abs(gauss(r))*0.012);candles.push({o:o,h:hi,l:lo,c:c});price=c;}
    host.innerHTML=_t(335,'<h4>Candlestick contoh (24 periode, simulasi)</h4><div class="chart"></div><div class="row" style="margin-top:8px"><button class="btn btn-sm" type="button" id="cp">Sebelumnya</button><button class="btn btn-sm" type="button" id="cn">Berikutnya</button></div><p class="out" id="co" aria-live="polite"></p>');
    var ch=$('.chart',host),out=$('#co',host);
    function show(){
      var c=candles[sel],up=c.c>=c.o,chg=(c.c/c.o-1)*100;
      out.innerHTML=_t(336,'<b>Periode ')+(sel+1)+_t(337,'</b>: dibuka di ')+nf(c.o,1)+_t(338,', ditutup di ')+nf(c.c,1)+' ('+(up?'naik':'turun')+' '+pct(chg)+_t(339,'). Tertinggi ')+nf(c.h,1)+_t(340,', terendah ')+nf(c.l,1)+_t(341,'. Rentang harga selama periode ini ')+nf((c.h/c.l-1)*100,1)+'%.';
      drawCandles(ch,candles,sel);
    }
    Charts.reg.set(ch,function(){return null;});Charts.reg.delete(ch);
    host._redraw=show;show();
    ch.addEventListener('click',function(e){var g=e.target.closest('[data-i]');if(g){sel=Number(g.dataset.i);show();}});
    $('#cp',host).addEventListener('click',function(){sel=(sel+23)%24;show();});
    $('#cn',host).addEventListener('click',function(){sel=(sel+1)%24;show();});
    window.addEventListener('resize',function(){if(host.isConnected)show();});
  },
  ma:function(host){
    host.innerHTML=_t(343,'<h4>IHSG 1 tahun dengan rata-rata bergerak</h4><div class="ctl"><label class="check"><input type="checkbox" id="m20" checked> MA 20</label><label class="check"><input type="checkbox" id="m50"> MA 50</label></div><div class="chart"></div><p class="out">Garis rata-rata baru berbelok setelah harga berbelok. Itu sebabnya MA disebut indikator yang tertinggal.</p>');
    var ch=$('.chart',host);
    Charts.mount(ch,function(){
      var ma=[];if($('#m20',host).checked)ma.push(20);if($('#m50',host).checked)ma.push(50);
      var cfg=priceCfg('IHSG','1T',{ma:ma,noTip:true});
      cfg.series=cfg.series.map(function(s,k){if(k===0)return s;return {v:s.v,color:ma[k-1]===20?'var(--s1)':'var(--s2)',width:1.6,dash:ma[k-1]===50?'5 3':null};});
      return cfg;
    });
    $$('input',host).forEach(function(inp){inp.addEventListener('change',function(){Charts.draw(ch);});});
  },
  divers:function(host){
    host.innerHTML=_t(346,'<h4>Campuran dua aset contoh</h4><div class="ctl"><div class="field"><div class="rangeval"><label for="dw">Porsi aset A</label><b id="dwv"></b></div><input type="range" id="dw" min="0" max="100" step="2" value="50"></div><div class="field"><div class="rangeval"><label for="dr">Korelasi A dan B</label><b id="drv"></b></div><input type="range" id="dr" min="-50" max="100" step="5" value="30"></div></div><div class="chart"></div><p class="out" id="do" aria-live="polite"></p>');
    var A=30,B=20,ch=$('.chart',host),w=$('#dw',host),rr=$('#dr',host);
    function vol(wa,rho){return Math.sqrt(wa*wa*A*A+(1-wa)*(1-wa)*B*B+2*wa*(1-wa)*rho*A*B);}
    function cur(){return {wa:Number(w.value)/100,rho:Number(rr.value)/100};}
    Charts.mount(ch,function(){
      var c=cur(),vals=[];for(var i=0;i<=50;i++)vals.push(vol(i/50,c.rho));
      return {series:[{v:vals,color:'var(--accent)',width:2.2}],axis:'right',marker:Math.round(c.wa*50),noDots:true,label:_t(348,'Volatilitas campuran dua aset'),yFmt:function(t){return nf(t,0)+'%';},xLabel:function(i){return (i*2)+'% A';},
        tip:function(i){return '<b>'+(i*2)+'% A / '+(100-i*2)+_t(349,'% B</b><span>Volatilitas ')+nf(vals[i],1)+'%</span>';}};
    });
    function upd(){
      var c=cur();$('#dwv',host).textContent=Math.round(c.wa*100)+'% A / '+Math.round((1-c.wa)*100)+'% B';$('#drv',host).textContent=nf(c.rho,2);
      $('#do',host).innerHTML=_t(350,'Volatilitas campuran: <b>')+nf(vol(c.wa,c.rho),1)+_t(351,'%</b> per tahun. Aset A saja ')+A+_t(352,'%, aset B saja ')+B+_t(353,'%. Contoh angka ini hanya ilustrasi.');
      Charts.draw(ch);
    }
    w.addEventListener('input',upd);rr.addEventListener('input',upd);upd();
  }
  ,compound:function(host){
    host.innerHTML='<h4>'+X('Growth and inflation','Pertumbuhan dan inflasi')+'</h4><div class="ctl"><div class="field"><div class="rangeval"><label for="cr">'+X('Return per year','Hasil per tahun')+'</label><b id="crv"></b></div><input type="range" id="cr" min="0" max="15" step="0.5" value="6"></div><div class="field"><div class="rangeval"><label for="ci">'+X('Inflation per year','Inflasi per tahun')+'</label><b id="civ"></b></div><input type="range" id="ci" min="0" max="10" step="0.5" value="4"></div><div class="field"><div class="rangeval"><label for="cy">'+X('Years','Jangka waktu')+'</label><b id="cyv"></b></div><input type="range" id="cy" min="1" max="30" step="1" value="20"></div></div><div class="chart"></div><p class="out" id="co2" aria-live="polite"></p>';
    var ch=$('.chart',host),r=$('#cr',host),inf=$('#ci',host),y=$('#cy',host);
    function cur(){return {r:Number(r.value)/100,i:Number(inf.value)/100,y:Number(y.value)};}
    Charts.mount(ch,function(){
      var c=cur(),nom=[],real=[];
      for(var k=0;k<=c.y;k++){var n=100*Math.pow(1+c.r,k);nom.push(n);real.push(n/Math.pow(1+c.i,k));}
      return {series:[{v:nom,color:'var(--accent)',width:2.2},{v:real,color:'var(--ink-2)',width:2,dash:'6 4'}],axis:'right',baseline:100,noDots:true,
        label:X('Value of 100 over time: nominal and after inflation','Nilai 100 dari waktu ke waktu: nominal dan setelah inflasi'),
        yFmt:function(t){return nf(t,0);},xLabel:function(k){return X('Yr ','Th ')+k;},

var PROFILES={
 tunai:{name:_t(354,'Konservatif (mirip pasar uang atau deposito)'),mu:4.5,vol:1},
 obligasi:{name:_t(355,'Pendapatan tetap (obligasi)'),mu:6,vol:4},
 campuran:{name:_t(356,'Campuran saham dan obligasi'),mu:8,vol:11},
 saham:{name:_t(357,'Saham (indeks luas)'),mu:10,vol:18},
 volatil:{name:_t(358,'Aset sangat fluktuatif'),mu:12,vol:60}
};
var Sim={
  seed:7,
  params:function(){var s=Store.state.sim;return s||{initial:5000000,monthly:1000000,years:10,profile:'campuran',mu:8,vol:11};},
  run:function(p){
    var months=p.years*12,paths=400,r=rng(this.seed),sig=p.vol/100,mu=p.mu/100,drift=(mu-sig*sig/2)/12,s=sig/Math.sqrt(12);
    var vals=[],m,k;for(m=0;m<=months;m++)vals.push(new Float64Array(paths));
    for(k=0;k<paths;k++){var v=p.initial;vals[0][k]=v;for(m=1;m<=months;m++){v=(v+p.monthly)*Math.exp(drift+s*gauss(r));vals[m][k]=v;}}
    var P={p10:[],p25:[],p50:[],p75:[],p90:[],contrib:[]};
    for(m=0;m<=months;m++){
      var a=vals[m].slice().sort(),q=function(f){return a[Math.min(paths-1,Math.floor(f*(paths-1)))];};
      P.p10.push(q(.1));P.p25.push(q(.25));P.p50.push(q(.5));P.p75.push(q(.75));P.p90.push(q(.9));P.contrib.push(p.initial+p.monthly*m);
    }
    var contribEnd=P.contrib[months],lose=0;for(k=0;k<paths;k++)if(vals[months][k]<contribEnd)lose++;
    P.months=months;P.loss=lose/paths*100;P.paths=paths;return P;
  },
  read:function(){
    var g=function(id){return $('#'+id);};
    var p={initial:Math.max(0,Number(g('si').value)||0),monthly:Math.max(0,Number(g('sm').value)||0),years:Number(g('sy').value),profile:g('sp').value,mu:Number(g('smu').value),vol:Number(g('sv').value)};
    return p;
  },
  update:function(){
    var p=this.read();Store.state.sim=p;Store.save();
    $('#syv').textContent=p.years+' tahun';$('#smuv').textContent=pct(p.mu,1).replace('+','');$('#svv').textContent=nf(p.vol,0)+'%';
    var R=this.run(p),mo=R.months,last=function(a){return a[mo];};
    var tx=function(i){return (LANG==='en'?'Yr ':'Th ')+nf(i/12,i%12?1:0);};
    $('#simout').innerHTML=
     _t(359,'<div class="kpis"><div><span>Total setoran</span><b>')+rpShort(last(R.contrib))+_t(360,'</b><small>modal awal + setoran bulanan</small></div>')+
     _t(361,'<div><span>Nilai tengah (median)</span><b>')+rpShort(last(R.p50))+_t(362,'</b><small>separuh skenario di atas ini</small></div>')+
     _t(363,'<div><span>Skenario kurang baik</span><b>')+rpShort(last(R.p10))+_t(364,'</b><small>10% skenario di bawah ini</small></div>')+
     _t(365,'<div><span>Skenario lebih baik</span><b>')+rpShort(last(R.p90))+_t(366,'</b><small>10% skenario di atas ini</small></div>')+
     _t(367,'<div><span>Nilai akhir &lt; setoran</span><b>')+nf(R.loss,0)+_t(368,'%</b><small>dari ')+R.paths+_t(369,' skenario</small></div></div>')+
     _t(370,'<div class="keyline"><span><i style="background:var(--accent);opacity:.25"></i>80% skenario (P10 sampai P90)</span><span><i style="background:var(--accent);opacity:.5"></i>50% skenario di tengah (P25 sampai P75)</span><span><i style="background:var(--accent)"></i>Median</span><span><i style="background:var(--ink-3);height:2px"></i>Total setoran</span></div>')+
     '<div class="chart" id="simchart"></div>'+
     _t(371,'<p class="fine">Cara membaca: pita menunjukkan sebaran hasil dari ')+R.paths+_t(372,' jalur acak yang memakai asumsi di kiri. Ini ilustrasi untuk memahami ketidakpastian, bukan prediksi dan bukan data historis. Pajak, biaya, dan inflasi tidak dihitung.</p>');
    Charts.mount($('#simchart'),function(){
      return {series:[{v:R.p50,color:'var(--accent)',width:2.4},{v:R.contrib,color:'var(--ink-3)',width:1.6,dash:'5 4'}],
        bands:[{lo:R.p10,hi:R.p90,color:'var(--accent)',opacity:.16},{lo:R.p25,hi:R.p75,color:'var(--accent)',opacity:.28}],
        axis:'left',noDots:true,label:_t(377,'Sebaran nilai portofolio simulasi'),yFmt:function(t){return rpShort(t).replace('Rp ','');},xLabel:function(i){return tx(i);},
        tip:function(i){return '<b>'+esc(tx(i))+_t(378,'</b><span>Median ')+rpShort(R.p50[i])+'</span><span>P10 '+rpShort(R.p10[i])+' / P90 '+rpShort(R.p90[i])+_t(379,'</span><span>Setoran ')+rpShort(R.contrib[i])+_t(380,'</span><em>SIMULASI</em>');}};
    });
  }
};

/* =====================================================================
   Alerts, watchlist, actions
   ===================================================================== */
function addAlert(id,dir,val){
  var a=BY[id],price=Number(val),cur=Market.price(id);
  if(!isFinite(price)||price<=0){toast(_t(522,'Isi harga target dengan angka lebih dari 0.'));return false;}
  if(dir==='above'&&price<=cur){toast(_t(523,'Untuk peringatan naik, harga target harus di atas harga sekarang (')+fmtPrice(a,cur)+').');return false;}
  if(dir==='below'&&price>=cur){toast(_t(524,'Untuk peringatan turun, harga target harus di bawah harga sekarang (')+fmtPrice(a,cur)+').');return false;}
  Store.state.alerts.push({aid:Date.now()+'-'+Math.floor(Math.random()*1e4),id:id,dir:dir,price:price,hit:null});
  Store.save();toast(_t(525,'Peringatan dipasang untuk ')+a.name+'.');rerender(true);return true;
}
function checkAlerts(){
  var changed=false;
  Store.state.alerts.forEach(function(al){
    if(al.hit)return;
    var p=Market.price(al.id),a=BY[al.id];
    if((al.dir==='above'&&p>=al.price)||(al.dir==='below'&&p<=al.price)){
      al.hit=Date.now();al.hitPrice=p;changed=true;
      toast(_t(526,'Peringatan: ')+a.name+' menyentuh '+fmtPrice(a,al.price)+_t(527,' (data ')+statusLong(al.id)+').','alert');
    }
  });
  if(changed){Store.save();rerender(true);}
}
function setTf(tf){Store.state.tf=tf;Store.save();rerender(true);}
function toggleWatch(id,on){
  var w=Store.state.watch,i=w.indexOf(id);
  if(on&&i<0)w.push(id);if(!on&&i>=0)w.splice(i,1);
  Store.save();rerender(true);
}

function parseHash(){
  var h=(location.hash||'#beranda').slice(1),parts=h.split('-'),page=parts.shift(),sub=parts.join('-');
  if(['beranda','pasar','belajar','simulasi'].indexOf(page)<0){page='beranda';sub='';}
  return {page:page,sub:sub};
}
function render(keepScroll){
  var r=parseHash(),view=$('#view'),y=window.scrollY;
  document.body.dataset.page=r.page;
  Charts.clearPage();
  var html='';
  if(r.page==='beranda')html=viewBeranda();
  else if(r.page==='pasar')html=viewPasar(r.sub);
  else if(r.page==='belajar')html=viewBelajar(r.sub);
  else html=viewSimulasi();
  view.innerHTML=html+siteFooter();
  $$('#nav a,#tabbar a').forEach(function(a){if(a.dataset.p===r.page)a.setAttribute('aria-current','page');else a.removeAttribute('aria-current');});
  mountSparks(view);
  if(r.page==='beranda'){Charts.mount($('#heroChart'),function(){return priceCfg(heroId,'3B');});}
  if(r.page==='pasar'){
    if(r.sub==='bandingkan'){var cc=$('#cmpChart');Charts.mount(cc,cmpCfg);$('#cmpBody').innerHTML=cmpRows();}
    else if(r.sub==='alert'){syncAlertForm();}
    else if(r.sub==='jelajah'){}
    else{for(var i=0;i<Store.state.layout;i++)(function(i){Charts.mount($('#pc'+i),function(){return priceCfg(Store.state.panels[i],Store.state.tf);});})(i);}
  }
  if(r.page==='belajar'){$$('[data-widget]',view).forEach(function(h){h.className='widget';Widgets[h.dataset.widget](h);});}
  if(r.page==='simulasi'){Sim.update();}
  if(Sheet.id)Sheet.render();
  if(keepScroll)window.scrollTo(0,y);else{window.scrollTo(0,0);}
}
function rerender(keep){render(keep);}
function syncAlertForm(){
  var sel=$('#aa'),ap=$('#ap'),cur=$('#acur');if(!sel)return;
  var a=BY[sel.value];cur.textContent=fmtPrice(a,Market.price(a.id));ap.placeholder=nf(Market.price(a.id),a.dec);
}

/* live updates */
function updateLive(){
  $$('[data-price]').forEach(function(el){var a=BY[el.dataset.price];if(a)el.textContent=fmtPrice(a,Market.price(a.id));});
  $$('[data-chg]').forEach(function(el){
    var id=el.dataset.chg,tf=el.dataset.tf||Store.state.tf,c=Market.stats(id,tf).chg;
    el.textContent=(c>0.005?'▲ ':c<-0.005?'▼ ':'– ')+pct(c);
    el.classList.remove('up','down');if(c>0.005)el.classList.add('up');else if(c<-0.005)el.classList.add('down');
  });
  $$('[data-clock]').forEach(function(el){el.textContent=fmtClock(SimProvider.last);});
  var cb=$('#cmpBody');if(cb)cb.innerHTML=cmpRows();
  Charts.redrawAll(true);
  checkAlerts();
}

document.addEventListener('click',function(e){

    case 'hero':heroId=id;rerender(true);break;

    case 'theme':{
      var de=document.documentElement,cur=de.dataset.theme||(window.matchMedia&&matchMedia('(prefers-color-scheme: dark)').matches?'dark':'light'),nx=cur==='dark'?'light':'dark';
      de.dataset.theme=nx;Store.state.theme=nx;Store.save();break;}
    case 'open-asset':Sheet.open(id);break;
    case 'sheet-close':Sheet.close();break;
    case 'tf':setTf(t.dataset.v);break;

    case 'watch':toggleWatch(id,true);toast(_t(540,'Ditambahkan ke daftar pantau.'));break;
    case 'unwatch':toggleWatch(id,false);break;
    case 'watch-add':{var s=$('#wladd');if(s&&s.value)toggleWatch(s.value,true);break;}
    case 'to-dash':{Store.state.panels[0]=id;Store.save();Sheet.close();if(parseHash().page==='pasar'&&!parseHash().sub)rerender(true);else location.hash='#pasar';break;}
    case 'exp-grp':EXP.g=t.dataset.v;rerender(true);break;
    case 'cmp':{var c=Store.state.compare,i=c.indexOf(id);if(i>=0){if(c.length<=2){toast(_t(541,'Minimal 2 aset untuk dibandingkan.'));break;}c.splice(i,1);}else{if(c.length>=4){toast(_t(542,'Maksimal 4 aset.'));break;}c.push(id);}Store.save();rerender(true);break;}
    case 'alert-del':Store.state.alerts=Store.state.alerts.filter(function(a){return a.aid!==t.dataset.aid;});Store.save();rerender(true);break;
    case 'pause':paused=!paused;t.textContent=paused?_t(543,'Lanjutkan simulasi'):_t(544,'Jeda simulasi');break;
    case 'lesson-done':{var d=Store.state.done,k=d.indexOf(id);if(k>=0)d.splice(k,1);else d.push(id);Store.save();rerender(true);break;}
    case 'quiz-check':{
      var r=parseHash(),L=LBY[r.sub]||LESSONS[0],ok=0,all=true;

      });

    case 'sim-reseed':Sim.seed=Math.floor(Math.random()*1e6);Sim.update();break;

  }
});

(function sanitize(){
  var s=Store.state,ok=function(id){return !!BY[id];};
  s.watch=(Array.isArray(s.watch)?s.watch:[]).filter(ok);
  s.panels=(Array.isArray(s.panels)?s.panels:[]).filter(ok);
  var def=['IHSG','BBCA','EMAS','BTC'];while(s.panels.length<4)s.panels.push(def[s.panels.length]);
  s.compare=(Array.isArray(s.compare)?s.compare:[]).filter(ok).slice(0,4);if(s.compare.length<2)s.compare=['IHSG','EMAS','BTC'];
  s.alerts=(Array.isArray(s.alerts)?s.alerts:[]).filter(function(a){return a&&ok(a.id)&&isFinite(a.price)&&a.aid;});
  s.done=(Array.isArray(s.done)?s.done:[]).filter(function(id){return !!LBY[id];});
  if(!TFS[s.tf])s.tf='1B';if([1,2,4].indexOf(s.layout)<0)s.layout=2;
  if(s.sim){var p=s.sim;if(!PROFILES[p.profile]||!isFinite(p.initial)||!isFinite(p.monthly)||!(p.years>=1&&p.years<=30)||!isFinite(p.mu)||!isFinite(p.vol))s.sim=null;}
  if(s.theme==='dark'||s.theme==='light')document.documentElement.dataset.theme=s.theme;
})();

  set('#nav','aria-label',en?'Main navigation':'Navigasi utama');
  set('#tabbar','aria-label',en?'Main navigation (mobile)':'Navigasi utama (ponsel)');
  set('#statusPop','aria-label',en?'Data status':'Status data');
  var th=$('[data-act="theme"]');if(th){th.setAttribute('aria-label',en?'Switch light or dark mode':'Ganti mode terang atau gelap');th.setAttribute('title',en?'Switch light/dark mode':'Ganti mode terang/gelap');}
  var lb=$('[data-act="lang"]');if(lb){lb.textContent=en?'EN':'ID';lb.setAttribute('aria-label',en?'Language: English. Switch to Indonesian':'Bahasa: Indonesia. Ganti ke bahasa Inggris');lb.setAttribute('title',en?'Switch to Indonesian':'Ganti ke bahasa Inggris');}
  var m=document.querySelector('meta[name="description"]');if(m)m.setAttribute('content',en?'Finvest: learn investing from scratch and monitor markets with delayed data. Not advice to buy or sell.':'Finvest: belajar investasi dari nol dan pantau pasar dengan data tertunda. Bukan saran beli atau jual.');
}
applyStaticLang();
SimProvider.init();
renderSimbar();
render(false);
lastW=document.body.clientWidth;
Market.load().then(function(ok){if(ok){renderSimbar();rerender(true);}});
setInterval(function(){
  if(document.hidden)return;
  var g=Market.gen;
  Market.load().then(function(ok){if(ok&&Market.gen!==g){renderSimbar();rerender(true);toast(_t(552,'Data pasar diperbarui.'));}});
},600000);
setInterval(function(){if(paused||document.hidden)return;SimProvider.tick();updateLive();},3000);
})();
</script>
