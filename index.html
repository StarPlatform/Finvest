  {q:_t(229,'Emas umumnya memberi hasil dari...'),o:[_t(230,'Dividen rutin.'),_t(231,'Bunga bulanan.'),_t(232,'Perubahan harga emas itu sendiri.')],a:2,why:_t(233,'Emas tidak menghasilkan arus kas, jadi hasilnya bergantung pada harga.')}]},

{id:'risiko',title:_t(234,'Risiko dan imbal hasil'),mins:7,blurb:_t(235,'Jenis-jenis risiko, hubungan risiko dengan potensi hasil, dan dua istilah penting: volatilitas dan drawdown.'),
 body:_t(236,'<h3>Risiko bukan hanya harga turun</h3><ul><li><b>Risiko pasar</b>: harga seluruh pasar turun.</li><li><b>Risiko spesifik</b>: masalah pada satu perusahaan atau aset.</li><li><b>Inflasi</b>: hasil tidak mengejar kenaikan harga barang.</li><li><b>Likuiditas</b>: sulit dijual cepat pada harga wajar.</li><li><b>Platform dan penipuan</b>: aplikasi tidak berizin atau akun diretas.</li><li><b>Perilaku</b>: keputusan emosional, misalnya panik saat harga turun.</li></ul>')+
 _t(237,'<h3>Risiko dan potensi hasil</h3><p>Aset yang berpotensi memberi hasil lebih besar biasanya juga lebih tidak pasti. Itu tidak berarti risiko tinggi pasti menguntungkan. Risiko tinggi juga bisa berarti rugi besar.</p>')+
 _t(238,'<h3>Dua istilah penting</h3><p><b>Volatilitas</b> mengukur seberapa lebar harga bergerak naik-turun. <b>Drawdown</b> adalah penurunan dari puncak ke titik terendah sesudahnya. Jika nilai turun dari 100 ke 70, drawdown-nya 30%.</p>')+
 _t(239,'<h3>Cobalah sendiri</h3><p>Setiap jalur di bawah memakai asumsi hasil rata-rata yang sama, 7% per tahun. Bedanya hanya volatilitas. Tekan Acak ulang beberapa kali dan perhatikan sebaran nilai akhirnya.</p><div data-widget="paths"></div>'),
 points:[_t(240,'Potensi hasil lebih besar biasanya datang bersama ketidakpastian lebih besar.'),_t(241,'Volatilitas tinggi berarti rentang hasil lebih lebar, ke atas maupun ke bawah.'),_t(242,'Drawdown menunjukkan seberapa dalam penurunan yang pernah terjadi.')],
 quiz:[{q:_t(243,'Volatilitas tinggi berarti...'),o:[_t(244,'Harga pasti naik.'),_t(245,'Harga bergerak naik-turun lebih lebar.'),_t(246,'Risiko hilang.')],a:1,why:_t(247,'Volatilitas mengukur lebar pergerakan, bukan arahnya.')},
  {q:_t(248,'Drawdown adalah...'),o:[_t(249,'Penurunan dari titik tertinggi ke titik terendah sesudahnya.'),_t(250,'Kenaikan harga harian.'),_t(251,'Biaya transaksi.')],a:0,why:_t(252,'Drawdown membantu menilai seberapa berat penurunan yang pernah dialami sebuah aset.')}]},

{id:'grafik',title:_t(253,'Membaca grafik harga'),mins:6,blurb:_t(254,'Sumbu, garis dan candlestick, timeframe, serta apa yang tidak bisa dikatakan sebuah grafik.'),
 body:_t(255,'<h3>Grafik garis</h3><p>Garis menghubungkan harga penutupan dari waktu ke waktu. Sumbu mendatar adalah waktu, sumbu tegak adalah harga. Garis putus-putus di grafik Pasar menandai harga di awal periode, sehingga Anda bisa melihat posisi harga sekarang terhadap titik awal.</p>')+
 _t(256,'<h3>Candlestick</h3><p>Satu batang mewakili satu periode (misalnya satu hari). <b>Badan</b> menunjukkan jarak harga buka ke harga tutup. <b>Sumbu tipis</b> menunjukkan harga tertinggi dan terendah dalam periode itu. Warna berbeda antar platform; di sini hijau berarti tutup lebih tinggi dari buka. Klik sebuah batang untuk melihat rinciannya.</p><div data-widget="candles"></div>')+
 _t(257,'<h3>Rentang waktu</h3><p>Grafik 1 hari dan 1 tahun untuk aset yang sama bisa terlihat berlawanan: turun hari ini, naik setahun terakhir. Keduanya benar, hanya menangkap jangka waktu berbeda. Pilih rentang waktu sesuai tujuan Anda.</p>')+
 _t(258,'<h3>Batas sebuah grafik</h3><p>Grafik menunjukkan apa yang sudah terjadi. Garis tren, area support, dan resistance adalah cara orang merangkum masa lalu, bukan pagar yang pasti menahan harga.</p>'),
 points:[_t(259,'Badan candle: jarak buka-tutup. Sumbu: tertinggi-terendah.'),_t(260,'Rentang waktu berbeda bisa memberi kesan berbeda untuk aset yang sama.'),_t(261,'Grafik merangkum masa lalu dan tidak menjamin arah berikutnya.')],
 quiz:[{q:_t(262,'Badan sebuah candle menunjukkan...'),o:[_t(263,'Jarak harga buka dan harga tutup.'),_t(264,'Volume transaksi.'),_t(265,'Hanya harga tertinggi.')],a:0,why:_t(266,'Sumbu tipis di atas dan bawah badan yang menunjukkan harga tertinggi dan terendah.')},
  {q:_t(267,'Mengapa grafik 1 hari dan 1 tahun bisa tampak berlawanan?'),o:[_t(268,'Salah satunya data palsu.'),_t(269,'Rentang waktu berbeda menangkap jangka waktu berbeda.'),_t(270,'Grafik selalu berubah sendiri.')],a:1,why:_t(271,'Pilih rentang waktu yang sesuai dengan tujuan dan jangka waktu Anda.')}]},

{id:'analisis',title:_t(272,'Analisis fundamental dan teknikal'),mins:8,blurb:_t(273,'Dua cara pandang yang sering dipakai, beserta batasannya.'),
 body:_t(274,'<h3>Fundamental: bisnisnya sehat dan harganya wajar?</h3><p>Analisis fundamental mempelajari perusahaan lewat laporan keuangan dan prospek bisnisnya. Beberapa ukuran yang sering dipakai:</p><ul><li><b>Laba</b>: apakah perusahaan menghasilkan keuntungan, dan apakah cenderung naik.</li><li><b>P/E (price to earnings)</b>: harga saham dibagi laba per saham. Menunjukkan berapa kali laba yang dibayar pasar untuk satu saham.</li><li><b>ROE</b>: laba dibandingkan modal pemegang saham, ukuran efisiensi.</li><li><b>Utang</b>: beban utang yang terlalu besar bisa membahayakan perusahaan saat kondisi sulit.</li><li><b>Dividen</b>: bagian laba yang dibagikan, jika ada.</li></ul><p>Angka ini baru berguna jika dibandingkan dengan perusahaan sejenis dan dengan riwayatnya sendiri. P/E rendah bisa berarti murah, bisa juga berarti pasar melihat labanya akan turun.</p>')+
 _t(275,'<h3>Teknikal: apa yang dikatakan pola harga?</h3><p>Analisis teknikal mempelajari pergerakan harga dan volume. Dua alat dasar:</p><ul><li><b>Rata-rata bergerak (MA)</b>: rata-rata harga penutupan beberapa periode terakhir. Meratakan gerakan harian agar tren lebih terlihat.</li><li><b>RSI</b>: ukuran momentum dari 0 sampai 100. Angka di atas 70 sering disebut jenuh beli dan di bawah 30 jenuh jual. Itu kebiasaan membaca, bukan sinyal otomatis.</li></ul>')+
 _t(276,'<h3>Cobalah sendiri</h3><p>Grafik di bawah memakai data IHSG satu tahun yang sedang dimuat di Finvest. Nyalakan MA 20 dan MA 50, lalu lihat bagaimana garis rata-rata selalu tertinggal dari harga.</p><div data-widget="ma"></div>')+
 _t(277,'<h3>Batasnya</h3><p>Keduanya alat bantu memahami, bukan mesin pemberi jawaban. MA tertinggal karena dihitung dari masa lalu, dan sering memberi sinyal palsu saat harga bergerak menyamping.</p>'),
 points:[_t(278,'Fundamental menilai bisnis dan harga wajar; teknikal membaca pola harga.'),_t(279,'P/E rendah belum tentu murah. Cari tahu alasannya.'),_t(280,'Indikator teknikal bukan sinyal beli atau jual otomatis.')],
 quiz:[{q:_t(281,'P/E rendah selalu berarti saham murah dan layak dibeli?'),o:[_t(282,'Ya, selalu.'),_t(283,'Tidak, perlu dilihat alasan P/E rendah, misalnya laba yang menurun.'),_t(284,'Hanya berlaku untuk emas.')],a:1,why:_t(285,'Rasio harus dibandingkan dengan perusahaan sejenis dan riwayatnya.')},
  {q:_t(286,'Rata-rata bergerak (MA) dihitung dari...'),o:[_t(287,'Rata-rata harga beberapa periode terakhir.'),_t(288,'Prediksi harga besok.'),_t(289,'Laba perusahaan.')],a:0,why:_t(290,'Karena dihitung dari data lampau, MA selalu tertinggal dari harga.')}]},

{id:'diversifikasi',title:_t(291,'Diversifikasi dan manajemen risiko'),mins:7,blurb:_t(292,'Menyebar risiko, menentukan porsi, dan alasan diversifikasi tidak menghapus risiko.'),
 body:_t(293,'<h3>Jangan taruh semua telur di satu keranjang</h3><p>Diversifikasi berarti menyebar dana ke beberapa aset yang tidak bergerak persis sama. Jika satu turun, yang lain mungkin tidak ikut turun sedalam itu. Penyebaran bisa dilakukan antar jenis aset, antar sektor, dan antar waktu (membeli bertahap).</p>')+
 _t(294,'<h3>Korelasi menentukan manfaatnya</h3><p>Korelasi mengukur seberapa searah dua aset bergerak, dari 1 (selalu searah) sampai -1 (selalu berlawanan). Dua aset dengan korelasi tinggi memberi manfaat penyebaran yang kecil. Geser pengaturan di bawah untuk melihatnya.</p><div data-widget="divers"></div>')+
 _t(295,'<h3>Praktik pengelolaan risiko</h3><ul><li><b>Batasi porsi</b>: tentukan kerugian maksimum yang sanggup Anda terima untuk satu aset, sebelum membeli.</li><li><b>Beli bertahap</b>: menyebar waktu pembelian mengurangi risiko membeli seluruhnya di waktu yang kurang baik, meski tidak menjamin hasil lebih baik.</li><li><b>Tinjau berkala</b>: porsi bisa bergeser seiring harga. Tinjau apakah masih sesuai tujuan.</li><li><b>Hindari utang untuk berinvestasi</b>: kerugian tetap harus dibayar.</li></ul>')+
 _t(296,'<h3>Batasnya</h3><p>Diversifikasi mengurangi risiko spesifik, tetapi tidak menghapus risiko pasar. Saat krisis besar, banyak aset bisa turun bersamaan.</p>'),
 points:[_t(297,'Diversifikasi mengurangi dampak satu aset yang buruk, bukan menghapus risiko.'),_t(298,'Korelasi rendah memberi manfaat penyebaran lebih besar.'),_t(299,'Tentukan batas kerugian sebelum membeli, bukan sesudahnya.')],
 quiz:[{q:_t(300,'Tujuan diversifikasi adalah...'),o:[_t(301,'Menjamin tidak pernah rugi.'),_t(302,'Mengurangi dampak satu aset yang buruk terhadap keseluruhan.'),_t(303,'Memastikan untung lebih besar.')],a:1,why:_t(304,'Diversifikasi mengurangi risiko spesifik, tetapi risiko pasar tetap ada.')},
  {q:_t(305,'Dua aset yang bergerak sangat searah (korelasi tinggi) memberi manfaat diversifikasi...'),o:[_t(306,'Lebih besar.'),_t(307,'Lebih kecil.'),_t(308,'Sama saja.')],a:1,why:_t(309,'Jika keduanya turun bersamaan, penyebaran tidak banyak membantu.')}]},

{id:'perilaku',title:_t(310,'Psikologi dan kesalahan umum'),mins:6,blurb:_t(311,'Emosi sering lebih berbahaya dari harga. Kenali jebakan umum dan tanda penipuan.'),
 body:_t(312,'<h3>Jebakan perilaku</h3><dl class="defs"><div><dt>FOMO</dt><dd>Takut ketinggalan. Membeli karena harga sedang ramai naik, bukan karena paham asetnya.</dd></div><div><dt>Panik jual</dt><dd>Menjual saat harga turun tajam, lalu mengunci kerugian yang mungkin belum perlu.</dd></div><div><dt>Terlalu percaya diri</dt><dd>Menganggap beberapa kali untung berarti sudah paham. Pasar bisa berubah.</dd></div><div><dt>Utang atau leverage</dt><dd>Memperbesar posisi dengan pinjaman. Untung dan rugi sama-sama membesar, dan rugi tetap harus dibayar.</dd></div></dl>')+
 _t(313,'<h3>Tanda investasi yang patut dicurigai</h3><ul><li>Menjanjikan hasil tetap tinggi dan tanpa risiko.</li><li>Menekan Anda untuk segera memutuskan atau mengajak orang lain bergabung demi bonus.</li><li>Tidak jelas dari mana hasilnya berasal.</li><li>Pihak penawar atau platformnya tidak jelas izinnya. Periksa daftar entitas berizin di situs OJK.</li></ul>')+
 _t(314,'<h3>Pertanyaan yang membantu</h3><ul><li>Dari mana hasil investasi ini berasal?</li><li>Apa skenario terburuknya, dan sanggupkah saya menanggungnya?</li><li>Apakah ini sesuai tujuan dan jangka waktu saya?</li></ul>'),
 points:[_t(315,'Tulis rencana dan batas kerugian sebelum membeli, agar emosi tidak memimpin.'),_t(316,'Hasil tinggi tanpa risiko adalah tanda bahaya.'),_t(317,'Periksa izin pihak penawar sebelum menyetor uang.')],
 quiz:[{q:_t(318,'Mana yang merupakan tanda patut dicurigai?'),o:[_t(319,'Penawaran hasil tetap tinggi tanpa risiko.'),_t(320,'Risiko dijelaskan dan pihak penawar berizin.'),_t(321,'Biaya tertulis jelas.')],a:0,why:_t(322,'Hasil dan risiko berjalan beriringan. Janji tanpa risiko hampir selalu menyesatkan.')},
  {q:_t(323,'Harga turun tajam dan Anda panik. Langkah yang lebih sehat adalah...'),o:[_t(324,'Menjual semuanya sekarang.'),_t(325,'Melihat kembali rencana dan jangka waktu sebelum bertindak.'),_t(326,'Menambah dana dengan utang.')],a:1,why:_t(327,'Keputusan yang mengacu pada rencana lebih jarang disesali dibanding keputusan saat panik.')}]},

{id:"inflasi",title:X("Inflation and compounding","Inflasi dan bunga majemuk"),mins:5,blurb:X("Why money loses purchasing power, how returns build on returns, and the difference between nominal and real returns.","Mengapa uang kehilangan daya beli, bagaimana hasil berbunga atas hasil, dan beda hasil nominal dengan hasil riil."),
 body:X("<h3>Inflation erodes purchasing power</h3><p>Inflation is the general rise in prices. At 4% a year, goods that cost Rp 10,000,000 today would cost about Rp 14.8 million in 10 years. Put the other way, Rp 10,000,000 held as cash would buy only about Rp 6.8 million worth of today's goods.</p>","<h3>Inflasi menggerus daya beli</h3><p>Inflasi adalah kenaikan harga secara umum. Pada 4% per tahun, barang yang kini seharga Rp 10.000.000 menjadi sekitar Rp 14,8 juta dalam 10 tahun. Sebaliknya, uang tunai Rp 10.000.000 hanya akan membeli barang senilai sekitar Rp 6,8 juta menurut harga hari ini.</p>")+X("<h3>Compounding</h3><p>Compounding means earning returns on earlier returns. Rp 10,000,000 growing 6% a year becomes about Rp 17.9 million after 10 years and about Rp 32.1 million after 20 years. Simple interest on the original amount alone would give Rp 16 million after 10 years. The longer the time, the larger the gap.</p>","<h3>Bunga majemuk</h3><p>Bunga majemuk berarti hasil ikut menghasilkan. Rp 10.000.000 yang tumbuh 6% per tahun menjadi sekitar Rp 17,9 juta setelah 10 tahun dan sekitar Rp 32,1 juta setelah 20 tahun. Bunga tunggal atas modal awal saja hanya menghasilkan Rp 16 juta setelah 10 tahun. Semakin lama waktunya, semakin lebar selisihnya.</p>")+X("<h3>Nominal and real returns</h3><p>The nominal return is the figure you see. The real return is what remains after inflation. A 6% return with 4% inflation is only about 1.9% in real terms. If inflation is higher than your return, your purchasing power shrinks even though the number grows.</p>","<h3>Hasil nominal dan hasil riil</h3><p>Hasil nominal adalah angka yang Anda lihat. Hasil riil adalah yang tersisa setelah inflasi. Hasil 6% dengan inflasi 4% hanya sekitar 1,9% secara riil. Jika inflasi lebih tinggi daripada hasil Anda, daya beli menyusut walaupun angkanya bertambah.</p>")+X("<h3>Try it yourself</h3><p>Change the return, inflation, and number of years. Compare the solid line (nominal) with the dashed line (after inflation).</p><div data-widget=\"compound\"></div>","<h3>Cobalah sendiri</h3><p>Ubah hasil, inflasi, dan jangka waktu. Bandingkan garis penuh (nominal) dengan garis putus-putus (setelah inflasi).</p><div data-widget=\"compound\"></div>")+X("<h3>It works both ways</h3><p>Losses and costs compound too. A 50% loss needs a 100% gain just to return to the starting value, which is why avoiding large losses matters.</p>","<h3>Berlaku ke dua arah</h3><p>Kerugian dan biaya juga berlipat. Kerugian 50% memerlukan kenaikan 100% hanya untuk kembali ke nilai awal. Karena itu, menghindari kerugian besar sangat penting.</p>"),
 points:[X("Time is the main ingredient of compounding.","Waktu adalah bahan utama bunga majemuk."),X("Compare returns with inflation, not just with zero.","Bandingkan hasil dengan inflasi, bukan hanya dengan nol."),X("Large losses are hard to recover from.","Kerugian besar sulit dipulihkan.")],
 quiz:[{q:X("If inflation is higher than your return, your purchasing power...","Jika inflasi lebih tinggi daripada hasil Anda, daya beli Anda..."),o:[X("increases.","meningkat."),X("stays the same.","tetap."),X("decreases, even though the number grows.","menurun, meskipun angkanya bertambah.")],a:2,why:X("The real return is negative, so the same money buys less.","Hasil riilnya negatif, sehingga uang yang sama membeli lebih sedikit.")},
  {q:X("After a 50% loss, what gain is needed to return to the starting value?","Setelah rugi 50%, berapa kenaikan yang diperlukan untuk kembali ke nilai awal?"),o:[X("50%","50%"),X("100%","100%"),X("150%","150%")],a:1,why:X("Falling from 100 to 50 and then needing to climb back to 100 is a 100% gain.","Turun dari 100 ke 50 lalu harus naik kembali ke 100 berarti kenaikan 100%.")}]},

{id:"biaya",title:X("Costs, fees, and taxes","Biaya, komisi, dan pajak"),mins:5,blurb:X("The costs that reduce returns, why small yearly fees add up, and where to find them.","Biaya yang mengurangi hasil, mengapa biaya tahunan yang kecil bisa menumpuk, dan di mana mencarinya."),
 body:X("<h3>Costs reduce what you keep</h3><ul><li><b>Transaction fee</b>: charged by the broker or platform when you buy or sell.</li><li><b>Management fee</b>: charged yearly on the value of a fund, usually as a percentage.</li><li><b>Spread</b>: the gap between the buying and selling price.</li><li><b>Tax</b>: may apply to dividends, interest, or gains. Rules differ by instrument and change over time.</li></ul>","<h3>Biaya mengurangi hasil bersih</h3><ul><li><b>Biaya transaksi</b>: dikenakan oleh perusahaan sekuritas atau platform saat membeli atau menjual.</li><li><b>Biaya pengelolaan</b>: dikenakan setiap tahun atas nilai dana, biasanya dalam persen.</li><li><b>Selisih harga (spread)</b>: jarak antara harga beli dan harga jual.</li><li><b>Pajak</b>: dapat berlaku atas dividen, bunga, atau keuntungan. Aturannya berbeda menurut instrumen dan dapat berubah.</li></ul>")+X("<h3>Small percentages add up</h3><p>Suppose Rp 100 million earns 7% a year before costs for 20 years. With a 0.5% yearly fee it grows to about Rp 352 million. With a 2% yearly fee it grows to about Rp 265 million. The gap of roughly Rp 87 million comes from the fee alone. This is an illustration, not a forecast.</p>","<h3>Persentase kecil bisa menumpuk</h3><p>Misalkan Rp 100 juta menghasilkan 7% per tahun sebelum biaya selama 20 tahun. Dengan biaya tahunan 0,5%, nilainya menjadi sekitar Rp 352 juta. Dengan biaya tahunan 2%, nilainya menjadi sekitar Rp 265 juta. Selisih sekitar Rp 87 juta itu berasal dari biaya saja. Ini ilustrasi, bukan perkiraan.</p>")+X("<h3>Where to look</h3><p>Check the product's official documents, such as a fund fact sheet and the platform's fee table, before buying. Look for fees charged at purchase, yearly fees, and fees at sale.</p>","<h3>Di mana mencarinya</h3><p>Periksa dokumen resmi produk, seperti lembar fakta kinerja reksa dana dan tabel biaya di platform, sebelum membeli. Perhatikan biaya saat pembelian, biaya tahunan, dan biaya saat penjualan.</p>")+X("<h3>Low cost is not the same as low risk</h3><p>A cheap product can still lose value. Costs are one factor to compare, alongside risk, goals, and time frame. Finvest does not give tax advice; check the current rules with the tax authority or a licensed professional.</p>","<h3>Biaya rendah bukan berarti risiko rendah</h3><p>Produk berbiaya murah tetap bisa merugi. Biaya adalah satu faktor pembanding, di samping risiko, tujuan, dan jangka waktu. Finvest tidak memberikan nasihat pajak; periksa aturan terbaru ke otoritas pajak atau profesional berlisensi.</p>"),
 points:[X("Costs are certain, returns are not.","Biaya itu pasti, hasil tidak."),X("A yearly fee compounds against you over time.","Biaya tahunan berlipat melawan Anda seiring waktu."),X("Read the official fee documents before buying.","Baca dokumen biaya resmi sebelum membeli.")],
 quiz:[{q:X("A fund charges 2% a year. This means...","Sebuah reksa dana mengenakan biaya 2% per tahun. Artinya..."),o:[X("it is charged only in years when you profit.","biaya hanya dikenakan pada tahun ketika Anda untung."),X("it is charged on the fund value every year, including losing years.","biaya dikenakan atas nilai dana setiap tahun, termasuk saat merugi."),X("it is a one-time charge at purchase.","biaya hanya sekali saat pembelian.")],a:1,why:X("Management fees are usually deducted from the fund value regardless of performance.","Biaya pengelolaan umumnya dipotong dari nilai dana tanpa memandang kinerja.")},
  {q:X("Where can you find the fees of an investment product?","Di mana Anda dapat menemukan biaya suatu produk investasi?"),o:[X("Only in advertisements.","Hanya di iklan."),X("In official documents, such as the fund fact sheet and the platform fee table.","Di dokumen resmi, seperti lembar fakta kinerja dan tabel biaya platform."),X("Fees do not exist for beginners.","Pemula tidak dikenai biaya.")],a:1,why:X("Official documents list the fees; advertisements often leave them out.","Dokumen resmi memuat biaya; iklan sering tidak mencantumkannya.")}]},

{id:"rencana",title:X("Building your plan","Menyusun rencana"),mins:6,blurb:X("From goal to routine: setting a target, investing regularly, and reviewing without reacting to every price move.","Dari tujuan menjadi kebiasaan: menetapkan target, berinvestasi berkala, dan meninjau tanpa bereaksi pada setiap pergerakan harga."),
 body:X("<h3>1. Start with the goal</h3><p>Write down what the money is for, how much you need, and by when. A house down payment in 3 years and retirement in 25 years call for different choices, because the time available to recover from a decline is different.</p>","<h3>1. Mulai dari tujuan</h3><p>Tuliskan untuk apa dana itu, berapa yang dibutuhkan, dan kapan. Uang muka rumah dalam 3 tahun dan pensiun dalam 25 tahun memerlukan pilihan yang berbeda, karena waktu untuk pulih dari penurunan juga berbeda.</p>")+X("<h3>2. Invest on a schedule</h3><p>Investing a fixed amount at regular intervals, for example every month, spreads your purchases across different prices. It reduces the risk of putting everything in at a bad moment. It does not guarantee a profit and does not prevent losses. Try the savings simulator to see the range of outcomes.</p>","<h3>2. Berinvestasi secara berkala</h3><p>Menanam jumlah tetap pada selang waktu teratur, misalnya setiap bulan, menyebar pembelian pada berbagai harga. Cara ini mengurangi risiko menanam semuanya pada saat yang kurang tepat. Cara ini tidak menjamin keuntungan dan tidak mencegah kerugian. Gunakan simulator tabungan untuk melihat rentang hasil yang mungkin.</p>")+X("<h3>3. Review, do not react</h3><p>Review your plan on a schedule, for example once or twice a year, and when your goals or income change. Reviewing on a schedule is different from reacting to every price swing.</p>","<h3>3. Tinjau, jangan bereaksi</h3><p>Tinjau rencana Anda secara terjadwal, misalnya sekali atau dua kali setahun, serta saat tujuan atau penghasilan berubah. Meninjau secara terjadwal berbeda dengan bereaksi pada setiap gejolak harga.</p>")+X("<h3>A simple checklist</h3><ul><li>Emergency fund in place.</li><li>Goal, amount, and deadline written down.</li><li>Maximum loss I can accept, decided in advance.</li><li>I understand where the returns come from and what the costs are.</li><li>The seller or platform is licensed.</li></ul>","<h3>Daftar periksa sederhana</h3><ul><li>Dana darurat sudah tersedia.</li><li>Tujuan, jumlah, dan tenggat sudah dituliskan.</li><li>Batas kerugian yang dapat saya terima sudah ditetapkan sebelumnya.</li><li>Saya memahami sumber hasil dan biayanya.</li><li>Penjual atau platform memiliki izin.</li></ul>"),
 points:[X("A written plan helps you avoid decisions made in a panic.","Rencana tertulis membantu menghindari keputusan yang diambil saat panik."),X("Regular investing spreads timing risk but does not remove risk.","Berinvestasi berkala menyebar risiko waktu pembelian, tetapi tidak menghilangkan risiko."),X("Review on a schedule, not on every price move.","Tinjau secara terjadwal, bukan pada setiap pergerakan harga.")],
 quiz:[{q:X("Investing a fixed amount on a regular schedule...","Menanam jumlah tetap secara berkala..."),o:[X("guarantees a profit.","menjamin keuntungan."),X("spreads out purchase timing but does not remove the risk of loss.","menyebar waktu pembelian, tetapi tidak menghilangkan risiko rugi."),X("removes the need for an emergency fund.","menghilangkan kebutuhan dana darurat.")],a:1,why:X("It manages timing risk only; the asset can still fall in value.","Cara ini hanya mengelola risiko waktu pembelian; nilai aset tetap bisa turun.")},
  {q:X("When is a good time to review your plan?","Kapan waktu yang baik untuk meninjau rencana Anda?"),o:[X("Only when prices crash.","Hanya saat harga anjlok."),X("On a schedule, and when your goals or situation change.","Secara terjadwal, dan saat tujuan atau keadaan Anda berubah."),X("Never, once it is set.","Tidak pernah, setelah rencana dibuat.")],a:1,why:X("A regular review keeps the plan matched to your goals without reacting to noise.","Tinjauan berkala menjaga rencana tetap sesuai tujuan tanpa terpengaruh gejolak sesaat.")}]}
];
/* ---- levels and new modules ---- */
function LS(id,lvl,mins,t,b,body,pts,quiz){
  return {id:id,lvl:lvl,mins:mins,title:X(t[0],t[1]),blurb:X(b[0],b[1]),
    body:body.map(function(p){return X(p[0],p[1]);}).join(''),
    points:pts.map(function(p){return X(p[0],p[1]);}),
    quiz:quiz.map(function(q){return {q:X(q.q[0],q.q[1]),o:q.o.map(function(o){return X(o[0],o[1]);}),a:q.a,why:X(q.w[0],q.w[1])};})};
}
[
LS('reksa','beginner',6,['Funds and ETFs','Reksa dana dan ETF'],['How a fund pools money, the difference between a mutual fund and an ETF, and what to check before buying.','Cara kerja dana bersama, perbedaan reksa dana dan ETF, serta hal yang perlu diperiksa sebelum membeli.'],
 [['<h3>What is a fund?</h3><p>A fund pools money from many investors, and a manager invests it in a basket of assets such as stocks, bonds, or money-market instruments. Each investor owns units that rise or fall with the value of the basket. You get spread across many holdings in one purchase, but you do not choose the individual holdings.</p>','<h3>Apa itu dana bersama?</h3><p>Dana bersama mengumpulkan uang dari banyak investor, lalu manajer menanamkannya pada sekeranjang aset seperti saham, obligasi, atau instrumen pasar uang. Setiap investor memiliki unit yang naik atau turun mengikuti nilai keranjang itu. Satu kali pembelian sudah menyebar dana ke banyak aset, tetapi Anda tidak memilih aset satu per satu.</p>'],
  ['<h3>Mutual fund and ETF</h3><dl class="defs"><div><dt>Mutual fund (reksa dana)</dt><dd>Bought and redeemed through a selling agent or platform at the net asset value (NAV), which is usually calculated once per day.</dd></div><div><dt>ETF</dt><dd>An exchange-traded fund. It trades on an exchange like a share, so its price changes during the trading day. Many ETFs follow an index.</dd></div></dl>','<h3>Reksa dana dan ETF</h3><dl class="defs"><div><dt>Reksa dana</dt><dd>Dibeli dan dijual kembali lewat agen penjual atau platform pada nilai aktiva bersih (NAB), yang biasanya dihitung sekali per hari.</dd></div><div><dt>ETF</dt><dd>Exchange-traded fund, yaitu dana yang diperdagangkan di bursa seperti saham, sehingga harganya berubah sepanjang hari perdagangan. Banyak ETF mengikuti sebuah indeks.</dd></div></dl>'],
  ['<h3>Types by content</h3><ul><li><b>Money-market funds</b>: short-term deposits and bills. Smaller swings, lower potential returns.</li><li><b>Bond funds</b>: mostly bonds. Moderate swings.</li><li><b>Equity funds</b>: mostly stocks. Larger swings.</li><li><b>Mixed funds</b>: a blend of the above.</li></ul>','<h3>Jenis menurut isi</h3><ul><li><b>Reksa dana pasar uang</b>: deposito dan surat utang jangka pendek. Naik-turun lebih kecil, potensi hasil lebih rendah.</li><li><b>Reksa dana pendapatan tetap</b>: sebagian besar obligasi. Naik-turun menengah.</li><li><b>Reksa dana saham</b>: sebagian besar saham. Naik-turun lebih besar.</li><li><b>Reksa dana campuran</b>: gabungan beberapa jenis di atas.</li></ul>'],
  ['<h3>What to check</h3><p>Read the fact sheet: what the fund holds, the management fee, other charges, how much its value has swung in the past, and who manages it. A fund that follows an index (passive) usually costs less than one that tries to beat the index (active), but both can lose value. On Finvest you can open the chart of ETFs such as SPY or QQQ to see how a basket of stocks moves.</p>','<h3>Yang perlu diperiksa</h3><p>Baca lembar fakta produk: isi portofolio, biaya pengelolaan, biaya lain, seberapa besar nilainya pernah naik-turun, dan siapa pengelolanya. Dana yang mengikuti indeks (pasif) biasanya lebih murah daripada yang berusaha mengalahkan indeks (aktif), tetapi keduanya bisa merugi. Di Finvest Anda dapat membuka grafik ETF seperti SPY atau QQQ untuk melihat pergerakan sekeranjang saham.</p>']],
 [['A fund holds a basket of assets; you own units, not the individual holdings.','Dana menyimpan sekeranjang aset; Anda memiliki unit, bukan aset satu per satu.'],['The fund type decides the risk: money-market, bond, equity, or mixed.','Jenis dana menentukan risikonya: pasar uang, pendapatan tetap, saham, atau campuran.'],['Fees reduce what you keep, so read the fact sheet.','Biaya mengurangi hasil yang Anda terima, jadi baca lembar fakta produk.']],
 [{q:['An ETF differs from a typical mutual fund mainly because it...','ETF berbeda dari reksa dana biasa terutama karena...'],o:[['is guaranteed not to lose value.','dijamin tidak merugi.'],['trades on an exchange during the day like a share.','diperdagangkan di bursa sepanjang hari seperti saham.'],['holds the shares of only one company.','hanya berisi saham satu perusahaan.']],a:1,w:['ETFs are listed, so their price moves during trading hours. They can still lose value.','ETF tercatat di bursa, sehingga harganya bergerak selama jam perdagangan. ETF tetap bisa merugi.']},
  {q:['Which statement about a money-market fund is the most accurate?','Pernyataan mana tentang reksa dana pasar uang yang paling tepat?'],o:[['Its value can never fall.','Nilainya tidak mungkin turun.'],['It usually swings less than an equity fund, but still carries some risk.','Biasanya naik-turunnya lebih kecil daripada reksa dana saham, tetapi tetap berisiko.'],['It always beats inflation.','Selalu mengalahkan inflasi.']],a:1,w:['Lower swings do not mean no risk or a guaranteed return.','Naik-turun yang lebih kecil bukan berarti tanpa risiko atau hasil yang pasti.']}]),

LS('garis','intermediate',6,['Support, resistance, and trend lines','Support, resistance, dan garis tren'],['The most common lines drawn on a chart, how to draw them, and why two people can draw different ones.','Garis yang paling sering digambar di grafik, cara membuatnya, dan alasan dua orang bisa menggambar garis yang berbeda.'],
 [['<h3>Support and resistance</h3><p><b>Support</b> is a price area where a decline has paused several times before. <b>Resistance</b> is an area where a rise has paused. They are zones, not exact lines: people look at where buyers or sellers were active in the past. When a level breaks, it is often said to switch roles, but that is a habit of interpretation, not a rule.</p>','<h3>Support dan resistance</h3><p><b>Support</b> adalah area harga tempat penurunan beberapa kali berhenti sebelumnya. <b>Resistance</b> adalah area tempat kenaikan beberapa kali berhenti. Keduanya berupa zona, bukan garis yang pasti: orang melihat di mana pembeli atau penjual aktif pada masa lalu. Saat sebuah level tertembus, sering dikatakan perannya bertukar, tetapi itu kebiasaan menafsirkan, bukan aturan.</p>'],
  ['<h3>Trend lines</h3><p>An uptrend line connects a series of rising lows. A downtrend line connects falling highs. The more times price touched the line without breaking it, the more people watch it. A break means the pattern changed, not that price must now move the other way.</p>','<h3>Garis tren</h3><p>Garis tren naik menghubungkan rangkaian titik terendah yang makin tinggi. Garis tren turun menghubungkan titik tertinggi yang makin rendah. Makin sering harga menyentuh garis tanpa menembusnya, makin banyak orang memperhatikannya. Tembusan berarti pola berubah, bukan berarti harga pasti bergerak ke arah sebaliknya.</p>'],
  ['<h3>Try it on Finvest</h3><p>Open the chart of any instrument. Use the horizontal line tool to mark a price where the chart turned several times, and the trend line tool to join two lows. Notice how your choice of points changes the line: two people can draw different lines on the same chart.</p>','<h3>Coba di Finvest</h3><p>Buka grafik instrumen apa pun. Gunakan alat garis horizontal untuk menandai harga tempat grafik beberapa kali berbalik, dan alat garis tren untuk menghubungkan dua titik terendah. Perhatikan bagaimana pilihan titik mengubah garisnya: dua orang bisa menggambar garis yang berbeda pada grafik yang sama.</p>'],
  ['<h3>Limits</h3><p>Levels are drawn after the fact and depend on the time frame. They describe where price has been, not where it must go. Many breaks turn out to be false, so treat lines as context rather than as a signal.</p>','<h3>Batasnya</h3><p>Level digambar setelah kejadian dan bergantung pada rentang waktu. Level menggambarkan di mana harga pernah berada, bukan ke mana harga harus pergi. Banyak tembusan ternyata palsu, jadi anggap garis sebagai konteks, bukan sinyal.</p>']],
 [['Support and resistance are zones where price paused before, not guarantees.','Support dan resistance adalah zona tempat harga pernah berhenti, bukan jaminan.'],['A trend line joins rising lows or falling highs.','Garis tren menghubungkan titik terendah yang naik atau titik tertinggi yang turun.'],['Different people can draw different lines on the same chart.','Orang yang berbeda bisa menggambar garis yang berbeda pada grafik yang sama.']],
 [{q:['Support is best described as...','Support paling tepat digambarkan sebagai...'],o:[['a guaranteed floor for the price.','batas bawah harga yang dijamin.'],['a price area where declines paused before.','area harga tempat penurunan pernah berhenti.'],['the lowest price ever recorded.','harga terendah yang pernah tercatat.']],a:1,w:['Support is a past pattern. Price can fall straight through it.','Support adalah pola masa lalu. Harga bisa menembusnya begitu saja.']},
  {q:['A trend line drawn through two lows...','Garis tren yang ditarik melalui dua titik terendah...'],o:[['predicts future prices.','memprediksi harga di masa depan.'],['summarizes past movement and can be drawn differently by different people.','merangkum pergerakan lalu dan bisa digambar berbeda oleh orang yang berbeda.'],['can never be broken.','tidak mungkin tertembus.']],a:1,w:['A line is a way to describe the past. Price is free to break it.','Garis adalah cara menggambarkan masa lalu. Harga bebas menembusnya.']}]),

LS('momentum','intermediate',7,['Momentum: RSI and MACD','Momentum: RSI dan MACD'],['Two popular indicators, how they are calculated, and why their signals often fail in sideways markets.','Dua indikator populer, cara menghitungnya, dan alasan sinyalnya sering keliru saat harga bergerak menyamping.'],
 [['<h3>What momentum measures</h3><p>Momentum indicators describe how strongly and how fast price has been moving recently. They are calculated from past prices, so they confirm what has happened rather than predict what will.</p>','<h3>Apa yang diukur momentum</h3><p>Indikator momentum menggambarkan seberapa kuat dan cepat harga bergerak belakangan ini. Indikator dihitung dari harga masa lalu, sehingga mengonfirmasi apa yang sudah terjadi, bukan memprediksi yang akan terjadi.</p>'],
  ['<h3>RSI</h3><p>The Relative Strength Index compares average gains with average losses over a period (14 is common) and scales the result from 0 to 100. Readings above 70 are often called overbought and below 30 oversold. These labels mean price moved quickly, not that it must reverse. In a strong trend RSI can stay above 70 for a long time.</p>','<h3>RSI</h3><p>Relative Strength Index membandingkan rata-rata kenaikan dengan rata-rata penurunan selama satu periode (14 lazim dipakai) dan menskalakan hasilnya dari 0 sampai 100. Nilai di atas 70 sering disebut jenuh beli dan di bawah 30 jenuh jual. Sebutan itu berarti harga bergerak cepat, bukan bahwa harga pasti berbalik. Pada tren yang kuat, RSI bisa bertahan di atas 70 cukup lama.</p>'],
  ['<h3>MACD</h3><p>MACD is the difference between a fast and a slow exponential moving average (12 and 26 are common). A signal line, a 9-period average of the MACD, is drawn beside it, and the histogram shows the gap between the two. When the MACD crosses above its signal line, momentum is said to strengthen; below it, to weaken. In sideways markets these crossings happen often and many do not lead to a trend.</p>','<h3>MACD</h3><p>MACD adalah selisih antara rata-rata bergerak eksponensial cepat dan lambat (12 dan 26 lazim dipakai). Garis sinyal, yaitu rata-rata 9 periode dari MACD, digambar di sampingnya, dan histogram menunjukkan jarak antara keduanya. Saat MACD memotong ke atas garis sinyalnya, momentum dikatakan menguat; ke bawah, melemah. Saat harga bergerak menyamping, perpotongan ini sering terjadi dan banyak yang tidak berlanjut menjadi tren.</p>'],
  ['<h3>Try it</h3><p>On any asset page, search for RSI and MACD in the indicator box and tick them. They appear below the chart. Move over the chart to read their values for a specific day.</p>','<h3>Coba sendiri</h3><p>Di halaman aset mana pun, cari RSI dan MACD di kotak indikator lalu centang. Keduanya muncul di bawah grafik. Gerakkan kursor di atas grafik untuk membaca nilainya pada hari tertentu.</p>']],
 [['Momentum indicators are built from past prices. They describe and do not predict.','Indikator momentum dibangun dari harga masa lalu. Indikator menggambarkan dan tidak memprediksi.'],['RSI above 70 or below 30 marks a fast move, not a certain reversal.','RSI di atas 70 atau di bawah 30 menandai pergerakan cepat, bukan pembalikan yang pasti.'],['MACD crossings often give false signals in sideways markets.','Perpotongan MACD sering memberi sinyal palsu saat harga menyamping.']],
 [{q:['An RSI reading above 70 means...','Nilai RSI di atas 70 berarti...'],o:[['the price must fall soon.','harga pasti segera turun.'],['price rose quickly recently; it does not guarantee a reversal.','harga naik cepat belakangan ini; ini tidak menjamin pembalikan.'],['the asset is expensive compared with its value.','aset itu mahal dibandingkan nilainya.']],a:1,w:['RSI only compares recent gains and losses. It says nothing about value.','RSI hanya membandingkan kenaikan dan penurunan terbaru. Ia tidak menilai nilai wajar.']},
  {q:['MACD is based on...','MACD didasarkan pada...'],o:[['company profits.','laba perusahaan.'],['the difference between a fast and a slow moving average.','selisih antara rata-rata bergerak cepat dan lambat.'],['trading volume only.','volume perdagangan saja.']],a:1,w:['It is calculated only from prices.','MACD dihitung hanya dari harga.']}]),

LS('rasio','intermediate',7,['Valuation ratios','Rasio valuasi'],['P/E, P/B, ROE, DER, and dividend yield: what they measure and how to compare them sensibly.','P/E, P/B, ROE, DER, dan dividend yield: apa yang diukur dan cara membandingkannya dengan wajar.'],
 [['<h3>Why ratios</h3><p>A share price alone says little. Ratios relate the price to something the company earns or owns, so that you can compare companies and look at one company over time.</p>','<h3>Mengapa rasio</h3><p>Harga saham saja tidak banyak bercerita. Rasio mengaitkan harga dengan sesuatu yang dihasilkan atau dimiliki perusahaan, sehingga Anda bisa membandingkan antarperusahaan dan melihat satu perusahaan dari waktu ke waktu.</p>'],
  ['<div class="tblwrap"><table><thead><tr><th>Ratio</th><th>Formula</th><th>What it tells you</th></tr></thead><tbody><tr><td>P/E</td><td>Price / earnings per share</td><td>What investors pay for each unit of profit.</td></tr><tr><td>P/B</td><td>Price / book value per share</td><td>Price relative to the net assets on the books.</td></tr><tr><td>ROE</td><td>Net profit / equity</td><td>Profit earned on shareholders\' money.</td></tr><tr><td>DER</td><td>Total debt / equity</td><td>How much the company relies on borrowing.</td></tr><tr><td>Dividend yield</td><td>Dividend per share / price</td><td>Cash paid out relative to the price.</td></tr></tbody></table></div>','<div class="tblwrap"><table><thead><tr><th>Rasio</th><th>Rumus</th><th>Yang ditunjukkan</th></tr></thead><tbody><tr><td>P/E</td><td>Harga / laba per saham</td><td>Berapa yang dibayar investor untuk setiap unit laba.</td></tr><tr><td>P/B</td><td>Harga / nilai buku per saham</td><td>Harga dibandingkan aset bersih yang tercatat.</td></tr><tr><td>ROE</td><td>Laba bersih / ekuitas</td><td>Laba yang diperoleh dari uang pemegang saham.</td></tr><tr><td>DER</td><td>Total utang / ekuitas</td><td>Seberapa bergantung perusahaan pada pinjaman.</td></tr><tr><td>Dividend yield</td><td>Dividen per saham / harga</td><td>Uang tunai yang dibagikan dibandingkan harga.</td></tr></tbody></table></div>'],
  ['<h3>An example with invented numbers</h3><p>Company A trades at Rp 2,000 and earns Rp 200 per share a year, so its P/E is 2,000 / 200 = 10. Company B trades at Rp 3,000 and earns Rp 100 per share, so its P/E is 30. B is not necessarily worse: it may be growing faster, or A\'s profit may be about to fall. A ratio starts a question; it does not answer it.</p>','<h3>Contoh dengan angka rekaan</h3><p>Perusahaan A diperdagangkan di Rp 2.000 dan memperoleh laba Rp 200 per saham per tahun, sehingga P/E-nya 2.000 / 200 = 10. Perusahaan B diperdagangkan di Rp 3.000 dengan laba Rp 100 per saham, sehingga P/E-nya 30. B belum tentu lebih buruk: bisa jadi tumbuh lebih cepat, atau laba A akan segera turun. Rasio memulai pertanyaan, bukan menjawabnya.</p>'],
  ['<h3>How to use them</h3><p>Compare a company with its own history and with similar companies in the same industry. Banks, miners, and technology firms have very different normal ranges. A very low ratio can be a warning sign rather than a bargain.</p>','<h3>Cara memakainya</h3><p>Bandingkan perusahaan dengan riwayatnya sendiri dan dengan perusahaan sejenis di industri yang sama. Bank, perusahaan tambang, dan perusahaan teknologi punya rentang normal yang sangat berbeda. Rasio yang sangat rendah bisa menjadi tanda peringatan, bukan harga murah.</p>']],
 [['Ratios relate price to profit, assets, or dividends so companies can be compared.','Rasio mengaitkan harga dengan laba, aset, atau dividen sehingga perusahaan bisa dibandingkan.'],['Compare within the same industry and against the company\'s own history.','Bandingkan di industri yang sama dan dengan riwayat perusahaan itu sendiri.'],['A low ratio is not automatically cheap. Find out why.','Rasio rendah belum tentu murah. Cari tahu alasannya.']],
 [{q:['A share trades at Rp 4,000 and earns Rp 400 per share a year. Its P/E is...','Sebuah saham diperdagangkan di Rp 4.000 dan memperoleh laba Rp 400 per saham per tahun. P/E-nya...'],o:[['0.1','0,1'],['10','10'],['100','100']],a:1,w:['4,000 divided by 400 is 10.','4.000 dibagi 400 sama dengan 10.']},
  {q:['Why compare ratios mainly within the same industry?','Mengapa rasio terutama dibandingkan dalam industri yang sama?'],o:[['Ratios are not allowed across industries.','Rasio tidak boleh dibandingkan antarindustri.'],['Normal ranges differ a lot between industries.','Rentang normal sangat berbeda antarindustri.'],['All industries have the same ratios.','Semua industri punya rasio yang sama.']],a:1,w:['A bank and a software firm have very different balance sheets, so the same number means different things.','Bank dan perusahaan perangkat lunak punya neraca yang sangat berbeda, sehingga angka yang sama berarti hal yang berbeda.']}]),

LS('obligasi','intermediate',7,['Bonds and yields','Obligasi dan imbal hasil'],['Coupon, maturity, why bond prices fall when rates rise, and the main risks of lending money.','Kupon, jatuh tempo, alasan harga obligasi turun saat suku bunga naik, dan risiko utama meminjamkan uang.'],
 [['<h3>How a bond works</h3><p>A bond is a loan to a government or a company. The issuer pays a fixed <b>coupon</b> (interest) on set dates and repays the <b>face value</b> at maturity. If you hold the bond until maturity and the issuer pays, you receive the promised cash flows.</p>','<h3>Cara kerja obligasi</h3><p>Obligasi adalah pinjaman kepada pemerintah atau perusahaan. Penerbit membayar <b>kupon</b> (bunga) tetap pada tanggal tertentu dan mengembalikan <b>nilai nominal</b> saat jatuh tempo. Jika Anda memegang obligasi sampai jatuh tempo dan penerbit membayar, Anda menerima arus kas yang dijanjikan.</p>'],
  ['<h3>Price and yield move in opposite directions</h3><p>A bond\'s yield is the return implied by its current price. When market interest rates rise, new bonds pay more, so older bonds with lower coupons become less attractive and their prices fall. When rates fall, older bonds rise in price. Example with invented numbers: a bond pays 6% on a face value of Rp 1,000,000. If new bonds pay 8%, buyers will pay less than Rp 1,000,000 for the older one.</p>','<h3>Harga dan imbal hasil bergerak berlawanan</h3><p>Imbal hasil (yield) obligasi adalah hasil yang tersirat dari harganya saat ini. Saat suku bunga pasar naik, obligasi baru membayar lebih tinggi, sehingga obligasi lama berkupon lebih rendah menjadi kurang menarik dan harganya turun. Saat suku bunga turun, harga obligasi lama naik. Contoh dengan angka rekaan: obligasi membayar 6% dari nilai nominal Rp 1.000.000. Jika obligasi baru membayar 8%, pembeli hanya mau membayar di bawah Rp 1.000.000 untuk yang lama.</p>'],
  ['<h3>Risks</h3><ul><li><b>Interest-rate risk</b>: the price falls when rates rise. A longer maturity means a bigger effect.</li><li><b>Credit risk</b>: the issuer may fail to pay.</li><li><b>Inflation risk</b>: a fixed coupon buys less if prices rise.</li></ul>','<h3>Risiko</h3><ul><li><b>Risiko suku bunga</b>: harga turun saat suku bunga naik. Jatuh tempo lebih panjang berarti dampak lebih besar.</li><li><b>Risiko kredit</b>: penerbit bisa gagal membayar.</li><li><b>Risiko inflasi</b>: kupon tetap membeli lebih sedikit saat harga barang naik.</li></ul>'],
  ['<h3>Where this shows up in Finvest</h3><p>Under Rates and volatility you can open the chart of the US 10-year yield. It is a reading of interest rates, not an asset you buy directly. Many people watch it because interest rates influence the prices of both bonds and stocks.</p>','<h3>Di mana ini muncul di Finvest</h3><p>Pada kelompok Suku bunga dan volatilitas, Anda dapat membuka grafik imbal hasil AS 10 tahun. Itu adalah ukuran suku bunga, bukan aset yang dibeli langsung. Banyak orang memantaunya karena suku bunga memengaruhi harga obligasi maupun saham.</p>']],
 [['A bond is a loan: coupon payments plus the face value at maturity.','Obligasi adalah pinjaman: pembayaran kupon ditambah nilai nominal saat jatuh tempo.'],['When yields rise, the prices of existing bonds fall, and the reverse.','Saat imbal hasil naik, harga obligasi yang sudah ada turun, dan sebaliknya.'],['A longer maturity means greater sensitivity to interest rates.','Jatuh tempo yang lebih panjang berarti lebih sensitif terhadap suku bunga.']],
 [{q:['Market interest rates rise. What usually happens to the price of an existing fixed-coupon bond?','Suku bunga pasar naik. Apa yang biasanya terjadi pada harga obligasi berkupon tetap yang sudah ada?'],o:[['It rises.','Naik.'],['It falls.','Turun.'],['It stays exactly the same.','Tetap sama persis.']],a:1,w:['New bonds pay more, so the older, lower-coupon bond must be cheaper to attract buyers.','Obligasi baru membayar lebih tinggi, sehingga obligasi lama berkupon lebih rendah harus lebih murah agar diminati.']},
  {q:['Which risk is about the issuer failing to pay?','Risiko mana yang berkaitan dengan penerbit yang gagal membayar?'],o:[['Credit risk','Risiko kredit'],['Interest-rate risk','Risiko suku bunga'],['Inflation risk','Risiko inflasi']],a:0,w:['Credit risk is the chance that the borrower does not repay.','Risiko kredit adalah kemungkinan peminjam tidak melunasi.']}]),

LS('volatilitas','advanced',8,['Volatility, Bollinger Bands, and ATR','Volatilitas, Bollinger Bands, dan ATR'],['How to measure the size of price swings, and how three common tools express it.','Cara mengukur besarnya ayunan harga, dan bagaimana tiga alat yang lazim menyatakannya.'],
 [['<h3>Measuring how much price moves</h3><p>Volatility is usually the standard deviation of returns, annualized. A 30% annual volatility means that over a typical year the price is expected to move roughly 30% either way around its average path, with larger moves less often. It measures the size of swings, not their direction. Finvest shows annual volatility on every asset page.</p>','<h3>Mengukur seberapa jauh harga bergerak</h3><p>Volatilitas biasanya adalah simpangan baku imbal hasil, yang disetahunkan. Volatilitas tahunan 30% berarti dalam setahun yang lazim harga diperkirakan bergerak sekitar 30% ke kedua arah di sekitar jalur rata-ratanya, dengan gerakan lebih besar lebih jarang terjadi. Ukuran ini menunjukkan besarnya ayunan, bukan arahnya. Finvest menampilkan volatilitas tahunan di setiap halaman aset.</p>'],
  ['<h3>Bollinger Bands</h3><p>Bollinger Bands place a band a chosen number of standard deviations (2 is common) above and below a moving average (20 periods is common). The bands widen when volatility rises and narrow when it falls. Touching a band is not a signal by itself: in a strong trend, price can ride along a band for a long time.</p>','<h3>Bollinger Bands</h3><p>Bollinger Bands menempatkan pita sejauh sejumlah simpangan baku (2 lazim dipakai) di atas dan di bawah rata-rata bergerak (20 periode lazim dipakai). Pita melebar saat volatilitas naik dan menyempit saat turun. Menyentuh pita bukan sinyal dengan sendirinya: pada tren yang kuat, harga bisa menyusuri pita cukup lama.</p>'],
  ['<h3>Average True Range (ATR)</h3><p>ATR averages the true range, which is the largest of: today\'s high minus low, the gap from yesterday\'s close to today\'s high, and the gap from yesterday\'s close to today\'s low. It gives the typical size of a daily swing in price units, which helps compare how large the swings of different assets are and helps with position sizing.</p>','<h3>Average True Range (ATR)</h3><p>ATR merata-ratakan rentang sebenarnya (true range), yaitu yang terbesar dari: selisih harga tertinggi dan terendah hari ini, jarak penutupan kemarin ke harga tertinggi hari ini, dan jarak penutupan kemarin ke harga terendah hari ini. ATR memberi ukuran ayunan harian yang lazim dalam satuan harga, sehingga membantu membandingkan besarnya ayunan antaraset dan menentukan ukuran posisi.</p>'],
  ['<h3>Drawdown and return per unit of risk</h3><p>Maximum drawdown is the largest fall from a peak. A simple measure of return per unit of risk divides return by volatility; the Sharpe ratio does the same after subtracting a risk-free rate. Two assets with the same return are not equal if one needed twice the volatility to get there.</p>','<h3>Drawdown dan hasil per unit risiko</h3><p>Drawdown maksimum adalah penurunan terbesar dari sebuah puncak. Ukuran sederhana hasil per unit risiko membagi hasil dengan volatilitas; rasio Sharpe melakukan hal yang sama setelah mengurangi suku bunga bebas risiko. Dua aset dengan hasil yang sama tidak setara jika salah satunya memerlukan volatilitas dua kali lipat untuk mencapainya.</p>']],
 [['Volatility measures the size of swings, not their direction.','Volatilitas mengukur besarnya ayunan, bukan arahnya.'],['Bollinger Bands widen with volatility. Touching a band is not a signal.','Bollinger Bands melebar bersama volatilitas. Menyentuh pita bukan sinyal.'],['ATR expresses a typical swing in price units.','ATR menyatakan ayunan yang lazim dalam satuan harga.']],
 [{q:['Bollinger Bands become wider when...','Bollinger Bands menjadi lebih lebar saat...'],o:[['volatility rises.','volatilitas naik.'],['volume falls.','volume turun.'],['the price is certain to rise.','harga pasti naik.']],a:0,w:['The bands are set by the standard deviation of recent prices.','Lebar pita ditentukan oleh simpangan baku harga terbaru.']},
  {q:['ATR is mainly used to...','ATR terutama dipakai untuk...'],o:[['predict the direction of price.','memprediksi arah harga.'],['gauge the typical size of price swings.','mengukur ukuran ayunan harga yang lazim.'],['measure company profit.','mengukur laba perusahaan.']],a:1,w:['ATR says how much price tends to move, not which way.','ATR menunjukkan seberapa besar harga cenderung bergerak, bukan ke arah mana.']}]),

LS('fibonacci','advanced',6,['Fibonacci retracement and its limits','Fibonacci retracement dan batasnya'],['What the levels are, how people use them, and why they should be treated with caution.','Apa itu level Fibonacci, cara orang memakainya, dan alasan perlunya kehati-hatian.'],
 [['<h3>Where the ratios come from</h3><p>Fibonacci retracement levels are horizontal lines at fixed fractions of a price move: 23.6%, 38.2%, 50%, 61.8%, and 78.6%. Most come from relationships in the Fibonacci number sequence (a number divided by the one after it approaches 0.618). The 50% level is not from the sequence but is commonly added.</p>','<h3>Dari mana rasio ini berasal</h3><p>Level Fibonacci retracement adalah garis horizontal pada pecahan tetap dari sebuah pergerakan harga: 23,6%, 38,2%, 50%, 61,8%, dan 78,6%. Sebagian besar berasal dari hubungan dalam deret bilangan Fibonacci (sebuah bilangan dibagi bilangan sesudahnya mendekati 0,618). Level 50% bukan dari deret itu, tetapi lazim ditambahkan.</p>'],
  ['<h3>How people use them</h3><p>After a rise from A to B, some people watch whether a pullback pauses near one of these levels, expecting the earlier move to resume. After a fall, the same levels are measured upward. On any asset page, choose the Fibonacci tool, tap the start and then the end of a move, and Finvest draws the levels.</p>','<h3>Cara orang memakainya</h3><p>Setelah kenaikan dari A ke B, sebagian orang memperhatikan apakah koreksi berhenti di dekat salah satu level ini, dengan harapan pergerakan sebelumnya berlanjut. Setelah penurunan, level yang sama diukur ke atas. Di halaman aset mana pun, pilih alat Fibonacci, ketuk awal lalu akhir sebuah pergerakan, dan Finvest menggambar levelnya.</p>'],
  ['<h3>An honest look at the evidence</h3><p>Many levels are drawn, so price passes through or near one of them by chance quite often. Because you can choose the start and end points freely, it is easy to find a pattern in hindsight. Evidence that the levels predict price is mixed. Treat them as one way people mark areas of interest, shared widely enough that they sometimes matter, and never as a prediction.</p>','<h3>Melihat bukti secara jujur</h3><p>Banyak level digambar, sehingga harga cukup sering melewati atau mendekati salah satunya secara kebetulan. Karena titik awal dan akhir bebas dipilih, mudah menemukan pola setelah kejadian. Bukti bahwa level ini memprediksi harga bercampur. Anggap level ini sebagai satu cara orang menandai area yang menarik, dipakai cukup luas sehingga kadang berpengaruh, dan jangan pernah menganggapnya prediksi.</p>']],
 [['Fibonacci levels are fixed fractions of a price move.','Level Fibonacci adalah pecahan tetap dari sebuah pergerakan harga.'],['You choose the start and end points, so results differ between people.','Anda memilih titik awal dan akhir, sehingga hasilnya berbeda antarorang.'],['Evidence that the levels predict price is mixed.','Bukti bahwa level ini memprediksi harga bercampur.']],
 [{q:['Which is a common Fibonacci retracement level?','Mana yang merupakan level Fibonacci retracement yang lazim?'],o:[['61.8%','61,8%'],['45%','45%'],['90%','90%']],a:0,w:['The common levels are 23.6%, 38.2%, 50%, 61.8%, and 78.6%.','Level yang lazim adalah 23,6%, 38,2%, 50%, 61,8%, dan 78,6%.']},
  {q:['Why should Fibonacci levels not be treated as predictions?','Mengapa level Fibonacci tidak boleh dianggap prediksi?'],o:[['They are not legal to use.','Penggunaannya tidak sah.'],['Start and end points are chosen freely, and price often passes near a level by chance.','Titik awal dan akhir dipilih bebas, dan harga sering melewati dekat sebuah level secara kebetulan.'],['They only work on gold.','Hanya berlaku untuk emas.']],a:1,w:['With many levels and free choice of points, a match is easy to find afterwards.','Dengan banyak level dan titik yang bebas dipilih, kecocokan mudah ditemukan setelah kejadian.']}]),

LS('posisi','advanced',8,['Position sizing and risk-reward','Ukuran posisi dan risiko-imbal hasil'],['How to decide the amount first, how to compare possible gain with possible loss, and what expectancy means.','Cara menentukan jumlah dana lebih dulu, membandingkan potensi untung dan rugi, dan arti ekspektasi.'],
 [['<h3>Decide the loss first</h3><p>Position sizing means deciding how much to put into one idea before you know the outcome. One way to think about it: choose the share of your portfolio you accept to lose if the idea is wrong (for example 1%), then size the position so that this loss happens at the price where you would admit you were wrong.</p>','<h3>Tentukan kerugian lebih dulu</h3><p>Ukuran posisi berarti menentukan berapa dana yang ditaruh pada satu gagasan sebelum hasilnya diketahui. Salah satu cara berpikirnya: tentukan porsi portofolio yang Anda terima untuk hilang jika gagasan itu keliru (misalnya 1%), lalu atur ukuran posisi agar kerugian itu terjadi pada harga tempat Anda mengakui keliru.</p>'],
  ['<h3>Worked example (invented numbers)</h3><p>Portfolio Rp 100,000,000. Accepted loss per idea: 1%, or Rp 1,000,000. You would reconsider the idea if the price falls from Rp 5,000 to Rp 4,750, a drop of Rp 250 per share. Position size = 1,000,000 / 250 = 4,000 shares, which costs Rp 20,000,000, or 20% of the portfolio. If the price gaps below your exit level, the actual loss can be larger than planned.</p>','<h3>Contoh hitungan (angka rekaan)</h3><p>Portofolio Rp 100.000.000. Kerugian yang diterima per gagasan: 1%, atau Rp 1.000.000. Anda akan meninjau ulang jika harga turun dari Rp 5.000 ke Rp 4.750, yaitu turun Rp 250 per saham. Ukuran posisi = 1.000.000 / 250 = 4.000 saham, yang bernilai Rp 20.000.000, atau 20% portofolio. Jika harga melompat di bawah level keluar Anda, kerugian sebenarnya bisa lebih besar dari rencana.</p>'],
  ['<h3>Risk-reward and expectancy</h3><p>Risk-reward compares the possible gain with the possible loss. Winning half the time with gains twice the size of losses has a positive expectancy: 0.5 x 2 - 0.5 x 1 = +0.5 per unit risked. Winning 30% of the time with equal gains and losses does not: 0.3 - 0.7 = -0.4. What matters is the combination of hit rate and size, and both are uncertain estimates.</p>','<h3>Risiko-imbal hasil dan ekspektasi</h3><p>Rasio risiko-imbal hasil membandingkan potensi untung dengan potensi rugi. Menang separuh waktu dengan untung dua kali ukuran rugi punya ekspektasi positif: 0,5 x 2 - 0,5 x 1 = +0,5 per unit risiko. Menang 30% dengan untung dan rugi sama besar tidak demikian: 0,3 - 0,7 = -0,4. Yang penting adalah kombinasi tingkat kemenangan dan ukurannya, dan keduanya hanyalah perkiraan yang tidak pasti.</p>'],
  ['<h3>Limits</h3><p>Exit orders are not guaranteed: prices can jump past them overnight or in fast markets. Costs and taxes reduce results. This lesson explains a way of thinking about risk. It is not a recommendation to trade.</p>','<h3>Batasnya</h3><p>Perintah keluar tidak dijamin: harga bisa melompat melewatinya semalam atau saat pasar bergerak cepat. Biaya dan pajak mengurangi hasil. Materi ini menjelaskan cara berpikir tentang risiko. Ini bukan anjuran untuk bertransaksi.</p>']],
 [['Decide how much you accept to lose before deciding how much to buy.','Tentukan berapa kerugian yang Anda terima sebelum menentukan berapa yang dibeli.'],['Position size = accepted loss divided by the loss per unit.','Ukuran posisi = kerugian yang diterima dibagi kerugian per unit.'],['Hit rate and risk-reward must be judged together.','Tingkat kemenangan dan risiko-imbal hasil harus dinilai bersama.']],
 [{q:['Portfolio Rp 50,000,000, accepted loss 2% (Rp 1,000,000), and a loss of Rp 500 per share if the idea is wrong. Position size?','Portofolio Rp 50.000.000, kerugian yang diterima 2% (Rp 1.000.000), dan kerugian Rp 500 per saham jika gagasan keliru. Ukuran posisi?'],o:[['1,000 shares','1.000 saham'],['2,000 shares','2.000 saham'],['500 shares','500 saham']],a:1,w:['1,000,000 divided by 500 is 2,000 shares.','1.000.000 dibagi 500 sama dengan 2.000 saham.']},
  {q:['You win 40% of the time, and the average gain equals the average loss. The expectancy per unit risked is...','Anda menang 40% dari waktu, dan rata-rata untung sama dengan rata-rata rugi. Ekspektasi per unit risiko adalah...'],o:[['positive.','positif.'],['negative.','negatif.'],['zero.','nol.']],a:1,w:['0.4 x 1 - 0.6 x 1 = -0.2.','0,4 x 1 - 0,6 x 1 = -0,2.']}]),

LS('alokasi','advanced',7,['Correlation, allocation, and rebalancing','Korelasi, alokasi, dan penyeimbangan ulang'],['Why the split between asset classes matters, how correlation changes in stress, and what rebalancing does.','Mengapa pembagian antarkelas aset penting, bagaimana korelasi berubah saat pasar tertekan, dan apa fungsi penyeimbangan ulang.'],
 [['<h3>Allocation matters</h3><p>Asset allocation is the split of a portfolio between classes such as stocks, bonds, gold, and cash. Many studies of institutional portfolios find that the split explains more of the variation in results than picking individual securities, although this depends on the period and the method.</p>','<h3>Alokasi itu penting</h3><p>Alokasi aset adalah pembagian portofolio antarkelas seperti saham, obligasi, emas, dan kas. Banyak kajian atas portofolio institusi menemukan bahwa pembagian ini menjelaskan lebih banyak variasi hasil daripada pemilihan sekuritas satu per satu, meskipun hal ini bergantung pada periode dan metodenya.</p>'],
  ['<h3>Correlation</h3><p>Correlation ranges from -1 to +1. Two assets with a correlation near +1 move together, so holding both adds little diversification. Correlations are not fixed: in market stress many assets fall together and correlations rise. Use the Compare tab to put assets side by side and judge how similarly they move.</p>','<h3>Korelasi</h3><p>Korelasi berkisar dari -1 sampai +1. Dua aset dengan korelasi mendekati +1 bergerak bersama, sehingga memegang keduanya memberi sedikit penyebaran. Korelasi tidak tetap: saat pasar tertekan banyak aset turun bersamaan dan korelasi naik. Gunakan tab Bandingkan untuk menyandingkan aset dan menilai seberapa mirip pergerakannya.</p>'],
  ['<h3>Rebalancing</h3><p>Over time, assets that rose become a larger share of the portfolio. Rebalancing means returning to the target split, either on a schedule (for example once a year) or when a share drifts beyond a band (for example 5 percentage points). Example with invented numbers: the target is 60% stocks and 40% bonds. After stocks rise, the split is 70/30. Rebalancing sells some stocks and buys bonds to restore 60/40. It limits drift in risk. It does not guarantee a higher return, and selling can create transaction costs or taxes.</p>','<h3>Penyeimbangan ulang</h3><p>Seiring waktu, aset yang naik menjadi porsi yang lebih besar dalam portofolio. Penyeimbangan ulang berarti mengembalikan pembagian ke target, baik secara terjadwal (misalnya setahun sekali) maupun saat suatu porsi melenceng melewati batas (misalnya 5 poin persentase). Contoh dengan angka rekaan: targetnya 60% saham dan 40% obligasi. Setelah saham naik, pembagiannya menjadi 70/30. Penyeimbangan ulang menjual sebagian saham dan membeli obligasi untuk memulihkan 60/40. Cara ini membatasi pergeseran risiko. Cara ini tidak menjamin hasil lebih tinggi, dan penjualan dapat menimbulkan biaya transaksi atau pajak.</p>']],
 [['The split between asset classes shapes much of a portfolio\'s behavior.','Pembagian antarkelas aset membentuk sebagian besar perilaku portofolio.'],['Correlation shows how much two assets move together, and it changes over time.','Korelasi menunjukkan seberapa searah dua aset bergerak, dan nilainya berubah dari waktu ke waktu.'],['Rebalancing restores the target split. It controls risk rather than boosting return.','Penyeimbangan ulang memulihkan pembagian target. Fungsinya mengendalikan risiko, bukan menaikkan hasil.']],
 [{q:['Two assets with a correlation of +0.95 give...','Dua aset dengan korelasi +0,95 memberi...'],o:[['strong diversification.','penyebaran yang kuat.'],['little diversification.','sedikit penyebaran.'],['a guaranteed profit.','keuntungan yang dijamin.']],a:1,w:['They move almost together, so one does little to offset the other.','Keduanya bergerak hampir bersamaan, sehingga yang satu hampir tidak mengimbangi yang lain.']},
  {q:['The target is 60/40, and after stocks rose the split is 70/30. Rebalancing means...','Targetnya 60/40, dan setelah saham naik pembagiannya 70/30. Penyeimbangan ulang berarti...'],o:[['buying more stocks.','membeli lebih banyak saham.'],['selling some stocks and buying bonds to move back toward 60/40.','menjual sebagian saham dan membeli obligasi untuk kembali mendekati 60/40.'],['selling everything.','menjual semuanya.']],a:1,w:['The aim is to return to the intended mix.','Tujuannya mengembalikan komposisi yang dikehendaki.']}]),

LS('laporan','advanced',8,['Reading financial statements','Membaca laporan keuangan'],['The three statements, why profit is not the same as cash, and what to look for in an annual report.','Tiga laporan utama, alasan laba tidak sama dengan kas, dan hal yang dicari dalam laporan tahunan.'],
 [['<h3>Three statements</h3><dl class="defs"><div><dt>Income statement</dt><dd>Revenue, costs, and profit over a period.</dd></div><div><dt>Balance sheet</dt><dd>What the company owns (assets), what it owes (liabilities), and the difference (equity) on one date.</dd></div><div><dt>Cash flow statement</dt><dd>Cash actually moving in and out: from operations, investing, and financing.</dd></div></dl>','<h3>Tiga laporan utama</h3><dl class="defs"><div><dt>Laporan laba rugi</dt><dd>Pendapatan, biaya, dan laba selama satu periode.</dd></div><div><dt>Neraca</dt><dd>Apa yang dimiliki perusahaan (aset), apa yang terutang (liabilitas), dan selisihnya (ekuitas) pada satu tanggal.</dd></div><div><dt>Laporan arus kas</dt><dd>Uang tunai yang benar-benar masuk dan keluar: dari operasi, investasi, dan pendanaan.</dd></div></dl>'],
  ['<h3>Profit is not cash</h3><p>A company can report a profit while cash runs short, for example when customers pay late or it spends heavily on equipment. Compare net profit with operating cash flow over several years. A large and persistent gap deserves an explanation.</p>','<h3>Laba bukan kas</h3><p>Perusahaan bisa melaporkan laba sementara kasnya menipis, misalnya saat pelanggan membayar terlambat atau perusahaan banyak mengeluarkan uang untuk peralatan. Bandingkan laba bersih dengan arus kas operasi selama beberapa tahun. Selisih yang besar dan berkepanjangan perlu dijelaskan.</p>'],
  ['<h3>What to look for</h3><ul><li><b>Revenue growth</b>: is it steady, and where does it come from?</li><li><b>Margins</b>: gross and net margin over time and against peers.</li><li><b>Debt</b>: can operating profit cover interest payments several times over?</li><li><b>One-off items</b>: large gains or charges that will not repeat.</li><li><b>Notes and the auditor\'s opinion</b>: accounting choices and warnings.</li></ul>','<h3>Yang dicari</h3><ul><li><b>Pertumbuhan pendapatan</b>: apakah stabil, dan dari mana asalnya?</li><li><b>Margin</b>: margin kotor dan bersih dari waktu ke waktu dan dibandingkan perusahaan sejenis.</li><li><b>Utang</b>: apakah laba operasi mampu menutup beban bunga beberapa kali lipat?</li><li><b>Pos sekali jalan</b>: keuntungan atau beban besar yang tidak akan berulang.</li><li><b>Catatan dan opini auditor</b>: pilihan akuntansi dan peringatan.</li></ul>'],

var Sim={
  seed:7,
  params:function(){var s=Store.state.sim;return s||{initial:5000000,monthly:1000000,years:10,profile:'campuran',mu:8,vol:11};},
  run:function(p){
    var months=p.years*12,paths=400,r=rng(this.seed),sig=p.vol/100,mu=p.mu/100,drift=(mu-sig*sig/2)/12,s=sig/Math.sqrt(12);
    var vals=[],m,k;for(m=0;m<=months;m++)vals.push(new Float64Array(paths));
    for(k=0;k<paths;k++){var v=p.initial;vals[0][k]=v;for(m=1;m<=months;m++){v=(v+p.monthly)*Math.exp(drift+s*gauss(r));vals[m][k]=v;}}
    var P={p10:[],p25:[],p50:[],p75:[],p90:[],contrib:[]};
    for(m=0;m<=months;m++){
      var a=vals[m].slice().sort(),q=function(f){return a[Math.min(paths-1,Math.floor(f*(paths-1)))];};
      P.p10.push(q(.1));P.p25.push(q(.25));P.p50.push(q(.5));P.p75.push(q(.75));P.p90.push(q(.9));P.contrib.push(p.initial+p.monthly*m);
    }
    var contribEnd=P.contrib[months],lose=0;for(k=0;k<paths;k++)if(vals[months][k]<contribEnd)lose++;
    P.months=months;P.loss=lose/paths*100;P.paths=paths;return P;
  },

     _t(370,'<div class="keyline"><span><i style="background:var(--accent);opacity:.25"></i>80% skenario (P10 sampai P90)</span><span><i style="background:var(--accent);opacity:.5"></i>50% skenario di tengah (P25 sampai P75)</span><span><i style="background:var(--accent)"></i>Median</span><span><i style="background:var(--ink-3);height:2px"></i>Total setoran</span></div>')+

   Alerts, watchlist, actions
   ===================================================================== */
function addAlert(id,dir,val){
  var a=BY[id],price=Number(val),cur=Market.price(id);
  if(!isFinite(price)||price<=0){toast(_t(522,'Isi harga target dengan angka lebih dari 0.'));return false;}
  if(dir==='above'&&price<=cur){toast(_t(523,'Untuk peringatan naik, harga target harus di atas harga sekarang (')+fmtPrice(a,cur)+').');return false;}
  if(dir==='below'&&price>=cur){toast(_t(524,'Untuk peringatan turun, harga target harus di bawah harga sekarang (')+fmtPrice(a,cur)+').');return false;}
  Store.state.alerts.push({aid:Date.now()+'-'+Math.floor(Math.random()*1e4),id:id,dir:dir,price:price,hit:null});
  Store.save();toast(_t(525,'Peringatan dipasang untuk ')+a.name+'.');rerender(true);return true;
}
function checkAlerts(){
  var changed=false;
  Store.state.alerts.forEach(function(al){
    if(al.hit)return;
    var p=Market.price(al.id),a=BY[al.id];
    if((al.dir==='above'&&p>=al.price)||(al.dir==='below'&&p<=al.price)){
      al.hit=Date.now();al.hitPrice=p;changed=true;
      toast(_t(526,'Peringatan: ')+a.name+' menyentuh '+fmtPrice(a,al.price)+_t(527,' (data ')+statusLong(al.id)+').','alert');
    }
  });
  if(changed){Store.save();rerender(true);}
}
function setTf(tf){Store.state.tf=tf;Store.save();rerender(true);}
function toggleWatch(id,on){
  var w=Store.state.watch,i=w.indexOf(id);
  if(on&&i<0)w.push(id);if(!on&&i>=0)w.splice(i,1);
  Store.save();rerender(true);
}

function parseHash(){
  var h=(location.hash||'#beranda').slice(1),parts=h.split('-'),page=parts.shift(),sub=parts.join('-');
  if(page==='pasar'&&sub==='chart'){page='aset';sub='IHSG';}
  if(page==='pasar'&&sub==='latihan')sub='';
  if(page==='aset')sub=sub.toUpperCase();
  if(['beranda','pasar','belajar','simulasi','aset'].indexOf(page)<0){page='beranda';sub='';}
  return {page:page,sub:sub};
}
function render(keepScroll){
  var r=parseHash(),view=$('#view'),y=window.scrollY;
  document.body.dataset.page=r.page;
  Charts.clearPage();AP.destroy();
  var html='';
  if(Market.loading&&(r.page==='beranda'||r.page==='pasar'||r.page==='aset'))html=viewSkeleton(r);
  else if(r.page==='beranda')html=viewBeranda();
  else if(r.page==='aset')html=viewAset(r.sub);
  else if(r.page==='pasar')html=viewPasar(r.sub);
  else if(r.page==='belajar')html=viewBelajar(r.sub);
  else html=viewSimulasi();
  view.innerHTML=html+siteFooter();
  $$('#nav a,#tabbar a').forEach(function(a){if(a.dataset.p===(r.page==='aset'?'pasar':r.page))a.setAttribute('aria-current','page');else a.removeAttribute('aria-current');});
  mountSparks(view);
  document.title=r.page==='aset'&&BY[r.sub]?BY[r.sub].name+' | Finvest':'Finvest';
  if(Market.loading){/* skeleton only */}
  else if(r.page==='beranda'){Charts.mount($('#heroChart'),function(){return priceCfg(heroId,'3B');});}
  else if(r.page==='aset'){if(BY[r.sub])AP.mount(r.sub);}
  else if(r.page==='pasar'){
    if(r.sub==='bandingkan'){var cc=$('#cmpChart');Charts.mount(cc,cmpCfg);$('#cmpBody').innerHTML=cmpRows();}
    else if(r.sub==='alert'){syncAlertForm();}
    else if(r.sub==='jelajah'){}
    else{for(var i=0;i<Store.state.layout;i++)(function(i){Charts.mount($('#pc'+i),function(){return priceCfg(Store.state.panels[i],Store.state.tf);});})(i);}
  }
  if(r.page==='belajar'){$$('[data-widget]',view).forEach(function(h){h.className='widget';Widgets[h.dataset.widget](h);});}
  if(r.page==='simulasi'){Sim.update();}
  var ct=$('.tabs a[aria-current="page"]');if(ct&&ct.parentNode)ct.parentNode.scrollLeft=ct.offsetLeft-(ct.parentNode.clientWidth-ct.offsetWidth)/2;
  if(keepScroll)window.scrollTo(0,y);else{window.scrollTo(0,0);}
}

var IND_ORDER=['sma','ema','wma','bb','don','rsi','macd','stoch','willr','cci','roc','atr'];
function indName(d){

}
function emaArr(v,p){
  var out=new Array(v.length).fill(NaN),s=0,i,sum=0;
  while(s<v.length&&!isFinite(v[s]))s++;
  if(v.length-s<p)return out;
  for(i=s;i<s+p;i++)sum+=v[i];
  var e=sum/p,a=2/(p+1);out[s+p-1]=e;
  for(i=s+p;i<v.length;i++){e=a*v[i]+(1-a)*e;out[i]=e;}
  return out;
}
function wmaArr(v,p){var out=new Array(v.length).fill(NaN),den=p*(p+1)/2,i,j,s;for(i=p-1;i<v.length;i++){s=0;for(j=0;j<p;j++)s+=v[i-p+1+j]*(j+1);out[i]=s/den;}return out;}
function bbArr(v,p,m){
  var mid=sma(v,p),up=new Array(v.length).fill(NaN),lo=new Array(v.length).fill(NaN),i,j;
  for(i=p-1;i<v.length;i++){
    var s=0;for(j=i-p+1;j<=i;j++){var d=v[j]-mid[i];s+=d*d;}
    var sd=Math.sqrt(s/p);up[i]=mid[i]+m*sd;lo[i]=mid[i]-m*sd;
  }
  return {mid:mid,up:up,lo:lo};
}
function rollArr(a,p,fn){var out=new Array(a.length).fill(NaN),i,j,m;for(i=p-1;i<a.length;i++){m=a[i];for(j=i-p+1;j<i;j++)m=fn(m,a[j]);out[i]=m;}return out;}
function rsiArr(v,p){
  var out=new Array(v.length).fill(NaN),i,d;
  if(v.length<=p)return out;
  var g=0,l=0;
  for(i=1;i<=p;i++){d=v[i]-v[i-1];if(d>=0)g+=d;else l-=d;}
  g/=p;l/=p;out[p]=l===0?100:100-100/(1+g/l);
  for(i=p+1;i<v.length;i++){d=v[i]-v[i-1];g=(g*(p-1)+(d>0?d:0))/p;l=(l*(p-1)+(d<0?-d:0))/p;out[i]=l===0?100:100-100/(1+g/l);}
  return out;
}

function stochArr(h,l,c,p,d){

  var k=c.map(function(x,i2){var r=hh[i2]-ll[i2];return isFinite(r)?(r>0?(x-ll[i2])/r*100:50):NaN;});
  var dd=new Array(n).fill(NaN);
  for(i=p-1+d-1;i<n;i++){var s=0;for(j=0;j<d;j++)s+=k[i-j];dd[i]=s/d;}
  return {k:k,d:dd};

function cciArr(h,l,c,p){
  var tp=c.map(function(x,i){return (h[i]+l[i]+x)/3;}),m=sma(tp,p),out=new Array(c.length).fill(NaN),i,j;

  var n=c.length,tr=[],out=new Array(n).fill(NaN),i;
  for(i=0;i<n;i++)tr.push(i===0?h[0]-l[0]:Math.max(h[i]-l[i],Math.abs(h[i]-c[i-1]),Math.abs(l[i]-c[i-1])));
  if(n<=p)return out;
  var s=0;for(i=1;i<=p;i++)s+=tr[i];var a=s/p;out[p]=a;
  for(i=p+1;i<n;i++){a=(a*(p-1)+tr[i])/p;out[i]=a;}
  return out;
}

function fracIdx(t,tt){
  var n=t.length;
  if(tt<=t[0])return (tt-t[0])/(t[1]-t[0]);
  if(tt>=t[n-1])return n-1+(tt-t[n-1])/(t[n-1]-t[n-2]);
  var lo=0,hi=n-1;
  while(hi-lo>1){var mid=(lo+hi)>>1;if(t[mid]<=tt)lo=mid;else hi=mid;}
  return lo+(tt-t[lo])/(t[lo+1]-t[lo]);
}
