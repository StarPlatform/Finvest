      if(P.hist){var bw=Math.max(1,iw/n*0.7),y0=Yp(0);P.hist.forEach(function(q,i2){if(!isFinite(q))return;var y1=Yp(q);s+='<rect x="'+(Xf(i2)-bw/2).toFixed(1)+'" y="'+Math.min(y0,y1).toFixed(1)+'" width="'+bw.toFixed(1)+'" height="'+Math.max(0.5,Math.abs(y1-y0)).toFixed(1)+'" fill="'+(q>=0?'var(--up)':'var(--down)')+'" fill-opacity=".5"'+pc+'/>';});}
      P.lines.forEach(function(l){s+='<path d="'+pathOf(l.a,Xf,Yp)+'" fill="none" stroke="'+l.c+'" stroke-width="1.5"'+pc+'/>';});
      s+='<text id="pl'+k+'" class="stlbl" x="'+(ml+6)+'" y="'+(py+14)+'"></text>';
    });
    for(var k=0;k<5;k++){var ii=Math.round(k*(n-1)/4);s+='<text class="al" x="'+Xf(ii).toFixed(1)+'" y="'+(H-8)+'" text-anchor="'+(k===0?'start':k===4?'end':'middle')+'">'+esc(fmtDate(t[ii]))+'</text>';}
    s+='<g id="stxh" style="display:none;pointer-events:none"><line id="xhv" x1="0" x2="0" y1="'+mt+'" y2="'+bot+'" stroke="var(--ink-3)" stroke-width="1" stroke-dasharray="3 3"/><line id="xhh" x1="'+ml+'" x2="'+(W-mr)+'" y1="0" y2="0" stroke="var(--ink-3)" stroke-width="1" stroke-dasharray="3 3"/><rect id="xhpr" rx="3" fill="var(--ink)" style="display:none"/><text id="xhpt" style="fill:var(--bg);font:500 10.5px var(--font-data);display:none"></text><rect id="xhtr" rx="3" fill="var(--ink)"/><text id="xhtt" style="fill:var(--bg);font:500 10.5px var(--font-data)"></text></g>';
    s+='<line id="stpv" style="display:none;pointer-events:none" stroke="var(--accent)" stroke-width="1.4" stroke-dasharray="5 4"/><rect id="stpr" style="display:none;pointer-events:none" fill="var(--accent)" fill-opacity=".08" stroke="var(--accent)" stroke-width="1.2" stroke-dasharray="5 4"/>';
    s+='<rect x="0" y="0" width="'+W+'" height="'+H+'" fill="transparent" style="cursor:'+(this.tool==='cursor'?'crosshair':'copy')+'"/></svg>';
    host.innerHTML=s;
    this.geo={o:co,hi:ch,lo:cl,id:id,W:W,H:H,ml:ml,mr:mr,iw:iw,mt:mt,Hm:Hm,n:n,t:t,v:v,X:Xf,Y:Yf,inv:inv,dec:dec,ov:ov,panes:panes,intraday:D.intraday};
    this.legend(n-1);
  }
};
function viewAset(id){
  if(!BY[id]){
    return '<div class="page-head"><div><h1>'+X('Instrument not available yet','Instrumen belum tersedia')+'</h1><p>'+X('We could not find "'+esc(id)+'" in Finvest. Search for another instrument below.','Kami tidak menemukan "'+esc(id)+'" di Finvest. Cari instrumen lain di bawah ini.')+'</p></div></div>'+
      '<div class="hsearch">'+Combo.html('goto',{ph:X('Search name or ticker','Cari nama atau kode')})+'</div>'+
      '<p style="margin-top:16px"><a class="btn" href="#pasar-jelajah">'+X('Browse all instruments','Jelajahi semua instrumen')+'</a></p>';
  }
  return AP.html(id);
}

/* live updates */
function updateLive(){
  $$('[data-price]').forEach(function(el){var a=BY[el.dataset.price];if(a)el.textContent=fmtPrice(a,Market.price(a.id));});
  $$('[data-chg]').forEach(function(el){
    var id=el.dataset.chg,tf=el.dataset.tf||Store.state.tf,c=Market.stats(id,tf).chg;
    el.textContent=(c>0.005?'▲ ':c<-0.005?'▼ ':'– ')+pct(c);
    el.classList.remove('up','down');if(c>0.005)el.classList.add('up');else if(c<-0.005)el.classList.add('down');
  });
  $$('[data-clock]').forEach(function(el){el.textContent=fmtClock(SimProvider.last);});
  var cb=$('#cmpBody');if(cb)cb.innerHTML=cmpRows();
  Charts.redrawAll(true);
  if(AP.host&&AP.host.isConnected)AP.draw();
  checkAlerts();
}

/* =====================================================================
   Events
   ===================================================================== */
document.addEventListener('click',function(e){
  if(!e.target.closest('#statusPop,#statusBtn'))closeStatus();
  var t=e.target.closest('[data-act]');if(!t)return;
  var act=t.dataset.act,id=t.dataset.id;
  switch(act){
    case 'status':toggleStatus();break;
    case 'goto-status':closeStatus();setTimeout(function(){var el=$('#status');if(el)el.scrollIntoView();},140);break;
    case 'hero':heroId=id;rerender(true);break;
    case 'lang':{try{localStorage.setItem('finvest.lang',LANG==='en'?'id':'en');}catch(e){}location.reload();return;}
    case 'theme':{
      var de=document.documentElement,cur=de.dataset.theme||(window.matchMedia&&matchMedia('(prefers-color-scheme: dark)').matches?'dark':'light'),nx=cur==='dark'?'light':'dark';
      de.dataset.theme=nx;Store.state.theme=nx;Store.save();break;}
    case 'open-asset':if(BY[id])location.hash='#aset-'+id;break;
    case 'tf':setTf(t.dataset.v);break;
    case 'layout':Store.state.layout=Number(t.dataset.v);Store.save();rerender(true);break;
    case 'watch':toggleWatch(id,true);toast(_t(540,'Ditambahkan ke daftar pantau.'));break;
    case 'unwatch':toggleWatch(id,false);break;
    case 'to-dash':{Store.state.panels[0]=id;Store.save();if(parseHash().page==='pasar'&&!parseHash().sub)rerender(true);else location.hash='#pasar';toast(X('Shown in the first dashboard chart.','Ditampilkan di grafik dasbor pertama.'));break;}
    case 'exp-grp':EXP.g=t.dataset.v;rerender(true);break;
    case 'cmp':{var c=Store.state.compare,i=c.indexOf(id);if(i>=0){if(c.length<=2){toast(_t(541,'Minimal 2 aset untuk dibandingkan.'));break;}c.splice(i,1);}else{if(c.length>=4){toast(_t(542,'Maksimal 4 aset.'));break;}c.push(id);}Store.save();rerender(true);break;}
    case 'alert-del':Store.state.alerts=Store.state.alerts.filter(function(a){return a.aid!==t.dataset.aid;});Store.save();rerender(true);break;
    case 'pause':paused=!paused;t.textContent=paused?_t(543,'Lanjutkan simulasi'):_t(544,'Jeda simulasi');break;
    case 'lesson-done':{var d=Store.state.done,k=d.indexOf(id);if(k>=0)d.splice(k,1);else d.push(id);Store.save();rerender(true);break;}
    case 'quiz-check':{
      var r=parseHash(),L=LBY[r.sub]||LESSONS[0],ok=0,all=true;
      $$('.quiz fieldset').forEach(function(fs,qi){
        var q=L.quiz[qi],sel=fs.querySelector('input:checked'),fb=fs.querySelector('.fb');
        if(!sel){all=false;return;}
        var good=Number(sel.value)===q.a;if(good)ok++;
        fb.hidden=false;fb.className='fb '+(good?'ok':'no');fb.textContent=(good?_t(546,'Tepat. '):_t(547,'Belum tepat. Jawaban yang lebih sesuai: ')+q.o[q.a]+'. ')+q.why;
      });
      $('#quizres').textContent=all?(_t(548,'Skor ')+ok+(LANG==='en'?' of ':' dari ')+L.quiz.length+'.'):_t(549,'Jawab semua pertanyaan dulu.');break;}
    case 'sim-reseed':Sim.seed=Math.floor(Math.random()*1e6);Sim.update();break;
    default:break;
  }
});
document.addEventListener('change',function(e){
  var t=e.target;
  if(t.id==='sp'){var pr=PROFILES[t.value];if(pr){$('#smu').value=pr.mu;$('#sv').value=pr.vol;Sim.update();}}
});
document.addEventListener('input',function(e){
  var t=e.target;if(t.id==='expq'){EXP.q=t.value;var eb=$('#expBody');if(eb){eb.innerHTML=exploreRows();mountSparks(eb);}return;}if(t.closest&&t.closest('#simform')&&t.id!=='sp'){if(t.id==='smu'||t.id==='sv'){var sp=$('#sp');var pr=PROFILES[sp.value];if(pr&&(Number($('#smu').value)!==pr.mu||Number($('#sv').value)!==pr.vol)){/* custom assumptions stay selected profile as a starting point */}}Sim.update();}
});
document.addEventListener('submit',function(e){
  if(e.target.id==='alertForm'){e.preventDefault();addAlert($('#aa').value,$('#ad').value,$('#ap').value);}
});
document.addEventListener('keydown',function(e){if(e.key==='Escape'){closeStatus();AP.cancel();}});
window.addEventListener('hashchange',function(){closeStatus();render(false);});
var lastW=0,rafId=0;
window.addEventListener('resize',function(){if(rafId)return;rafId=requestAnimationFrame(function(){rafId=0;var w=document.body.clientWidth;if(w!==lastW){lastW=w;Charts.redrawAll(false);}});});

/* =====================================================================
   Boot
   ===================================================================== */
Store.load();
(function sanitize(){
  var s=Store.state,ok=function(id){return !!BY[id];};
  s.watch=(Array.isArray(s.watch)?s.watch:[]).filter(ok);
  s.panels=(Array.isArray(s.panels)?s.panels:[]).filter(ok);
  var def=['IHSG','BBCA','EMAS','BTC'];while(s.panels.length<4)s.panels.push(def[s.panels.length]);
  s.compare=(Array.isArray(s.compare)?s.compare:[]).filter(ok).slice(0,4);if(s.compare.length<2)s.compare=['IHSG','EMAS','BTC'];
  s.alerts=(Array.isArray(s.alerts)?s.alerts:[]).filter(function(a){return a&&ok(a.id)&&isFinite(a.price)&&a.aid;});
  s.done=(Array.isArray(s.done)?s.done:[]).filter(function(id){return !!LBY[id];});
  if(!TFS[s.tf])s.tf='1B';if([1,2,4].indexOf(s.layout)<0)s.layout=2;
  if(s.sim){var p=s.sim;if(!PROFILES[p.profile]||!isFinite(p.initial)||!isFinite(p.monthly)||!(p.years>=1&&p.years<=30)||!isFinite(p.mu)||!isFinite(p.vol))s.sim=null;}
  if(s.theme==='dark'||s.theme==='light')document.documentElement.dataset.theme=s.theme;
})();

function applyStaticLang(){
  var en=LANG==='en';
  var N=en?{beranda:'Home',pasar:'Markets',belajar:'Learn',simulasi:'Simulator'}:{beranda:'Beranda',pasar:'Pasar',belajar:'Belajar',simulasi:'Simulator'};
  $$('#nav a').forEach(function(a){a.textContent=N[a.getAttribute('data-p')];});
  $$('#tabbar a').forEach(function(a){a.lastChild.nodeValue=N[a.getAttribute('data-p')];});
  var set=function(s,at,v){var e=$(s);if(e)e.setAttribute(at,v);};
  set('.brand','aria-label',en?'Finvest, go to home':'Finvest, ke beranda');
  set('#nav','aria-label',en?'Main navigation':'Navigasi utama');
  set('#tabbar','aria-label',en?'Main navigation (mobile)':'Navigasi utama (ponsel)');
  set('#statusPop','aria-label',en?'Data status':'Status data');
  var th=$('[data-act="theme"]');if(th){th.setAttribute('aria-label',en?'Switch light or dark mode':'Ganti mode terang atau gelap');th.setAttribute('title',en?'Switch light/dark mode':'Ganti mode terang/gelap');}
  var lb=$('[data-act="lang"]');if(lb){lb.textContent=en?'EN':'ID';lb.setAttribute('aria-label',en?'Language: English. Switch to Indonesian':'Bahasa: Indonesia. Ganti ke bahasa Inggris');lb.setAttribute('title',en?'Switch to Indonesian':'Ganti ke bahasa Inggris');}
  var m=document.querySelector('meta[name="description"]');if(m)m.setAttribute('content',en?'Finvest: learn investing from scratch and monitor markets with delayed data. Not advice to buy or sell.':'Finvest: belajar investasi dari nol dan pantau pasar dengan data tertunda. Bukan saran beli atau jual.');
}
applyStaticLang();
SimProvider.init();
Combo.bind();
renderSimbar();
render(false);
lastW=document.body.clientWidth;
Market.load().then(function(){Market.loading=false;renderSimbar();rerender(true);});
setInterval(function(){
  if(document.hidden)return;
  var g=Market.gen;
  Market.load().then(function(ok){if(ok&&Market.gen!==g){renderSimbar();rerender(true);toast(_t(552,'Data pasar diperbarui.'));}});
},1800000);
setInterval(function(){if(paused||document.hidden)return;SimProvider.tick();updateLive();},3000);
})();
</script>
