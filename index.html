<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="description" content="Finvest: belajar investasi dari nol dan pantau pasar dengan data tertunda. Bukan saran beli atau jual.">
<title>Finvest</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap">
<style>
html{-webkit-text-size-adjust:100%;color-scheme:light}
[hidden]{display:none!important}
img{max-width:100%}
/* Layout concept: chart-first workspace. Beranda opens with a live simulated chart beside two entry paths
   (pemula / berpengalaman). Pasar is a customizable multi-chart grid with a watchlist rail.
   Every price carries its data-status badge (Aktual / Tertunda / Simulasi). */
:root{
  --font-display:"Inter",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --font-body:"Inter",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --font-data:"Inter",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --bg:#F7F7F8; --surface:#FFFFFF; --surface-2:#EFEFF2; --line:#E1E2E7;
  --ink:#111318; --ink-2:#4A4E58; --ink-3:#6B7080;
  --accent:#2F4BCB; --accent-ink:#FFFFFF; --accent-soft:#E2E8FC;
  --up:#0B7A55; --up-soft:#DCF2E9; --down:#C23B2B; --down-soft:#FBE3DF;
  --warn:#8A5200; --warn-soft:#F5EEDC;
  --s1:#111318; --s2:#4A4E58; --s3:#767B88; --s4:#8E93A0;
  --shadow:0 1px 2px rgba(17,19,24,.05),0 8px 24px rgba(17,19,24,.05);
  --grid:rgba(17,19,24,.05); --glow:rgba(17,19,24,.05);
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#0B0C0F; --surface:#131419; --surface-2:#1B1D24; --line:#272A33;
    --ink:#EDEEF1; --ink-2:#A7ABB6; --ink-3:#8A8F9C;
    --accent:#8FA3FF; --accent-ink:#0A1120; --accent-soft:#1B2852;
    --up:#3FD6A2; --up-soft:#10332A; --down:#FF7F6D; --down-soft:#3A1C19;
    --warn:#F2B654; --warn-soft:#2A2312;
    --s1:#EDEEF1; --s2:#B6BAC4; --s3:#8E93A0; --s4:#747987;
    --shadow:0 0 0 1px rgba(255,255,255,.03);
  --grid:rgba(255,255,255,.05); --glow:rgba(255,255,255,.05);
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0B0C0F; --surface:#131419; --surface-2:#1B1D24; --line:#272A33;
  --ink:#EDEEF1; --ink-2:#A7ABB6; --ink-3:#8A8F9C;
  --accent:#8FA3FF; --accent-ink:#0A1120; --accent-soft:#1B2852;
  --up:#3FD6A2; --up-soft:#10332A; --down:#FF7F6D; --down-soft:#3A1C19;
  --warn:#F2B654; --warn-soft:#2A2312;
  --s1:#EDEEF1; --s2:#B6BAC4; --s3:#8E93A0; --s4:#747987;
  --shadow:0 0 0 1px rgba(255,255,255,.03);
  --grid:rgba(255,255,255,.05); --glow:rgba(255,255,255,.05);
  color-scheme:dark;
}
*,*::before,*::after{box-sizing:border-box}
html{scroll-behavior:auto}
body{
  margin:0;background:var(--bg);color:var(--ink);
  font:400 15px/1.55 var(--font-body);
  padding-left:max(16px,env(safe-area-inset-left,0px));
  padding-right:max(16px,env(safe-area-inset-right,0px));
  padding-block:0;
}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:30;background:var(--bg)}
body.noscroll{overflow:hidden}
h1,h2,h3{font-family:var(--font-display);font-weight:700;letter-spacing:-.015em;text-wrap:balance;margin:0}
p{margin:0}
a{color:var(--accent)}
button,select,input{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:6px}
.num{font-family:var(--font-data);font-variant-numeric:tabular-nums}
.wrap{max-width:1280px;margin:0 auto}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}

/* header */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:31;background:color-mix(in srgb,var(--bg) 86%,transparent);-webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px);border-bottom:1px solid var(--line)}
.top-row{display:flex;align-items:center;gap:20px;height:58px}
.brand{display:flex;align-items:center;gap:10px;text-decoration:none;color:var(--ink);font:700 20px/1 var(--font-display);letter-spacing:-.02em}
.brand .mark{width:30px;height:30px;border-radius:9px;background:var(--accent);color:var(--accent-ink);display:grid;place-items:center}
.brand .mark svg{width:18px;height:18px}
.nav{display:flex;gap:2px;margin-left:12px}
.nav a{padding:8px 14px;border-radius:10px;text-decoration:none;color:var(--ink-2);font-weight:500}
.nav a:hover{background:var(--surface-2);color:var(--ink)}
.nav a[aria-current="page"]{background:var(--accent-soft);color:var(--accent)}
.top-right{margin-left:auto;display:flex;gap:8px;align-items:center}
.langbtn{height:38px;min-width:38px;padding:0 10px;border-radius:10px;border:1px solid var(--line);background:var(--surface);cursor:pointer;color:var(--ink-2);font:600 12px var(--font-data);letter-spacing:.06em}
.langbtn:hover{color:var(--ink)}
.iconbtn{width:38px;height:38px;border-radius:10px;border:1px solid var(--line);background:var(--surface);display:grid;place-items:center;cursor:pointer;color:var(--ink-2)}
.iconbtn:hover{color:var(--ink);background:var(--surface-2)}
.iconbtn svg{width:18px;height:18px}

/* badges, pills */
.badge{display:inline-block;font:500 10.5px/1 var(--font-data);letter-spacing:.06em;padding:4px 6px;border-radius:6px;white-space:nowrap}
.badge.sim{background:var(--warn-soft);color:var(--warn)}
.badge.live{background:var(--up-soft);color:var(--up)}
.badge.delayed{background:var(--accent-soft);color:var(--accent)}
.pill{display:inline-block;font:500 12.5px/1 var(--font-data);padding:5px 8px;border-radius:999px;background:var(--surface-2);color:var(--ink-2);white-space:nowrap;font-variant-numeric:tabular-nums}
.pill.up{background:var(--up-soft);color:var(--up)}
.pill.down{background:var(--down-soft);color:var(--down)}
.pill.big{font-size:14px;padding:7px 11px}

/* buttons, segmented */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:40px;padding:9px 16px;border-radius:10px;border:1px solid var(--line);background:var(--surface);color:var(--ink);font-weight:500;text-decoration:none;cursor:pointer}
.btn:hover{background:var(--surface-2)}
.btn-primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn-primary:hover{background:var(--accent);filter:brightness(1.08)}
.btn-sm{min-height:34px;padding:6px 12px;font-size:13.5px}
.btn-ghost{border-color:transparent;background:transparent;color:var(--ink-2)}
.seg{display:inline-flex;background:var(--surface-2);border-radius:10px;padding:3px;gap:2px;max-width:100%;overflow-x:auto}
.seg button{border:0;background:transparent;color:var(--ink-2);padding:6px 11px;border-radius:8px;font:500 13px var(--font-body);cursor:pointer;min-height:32px;white-space:nowrap}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--ink);box-shadow:var(--shadow)}
.field{display:flex;flex-direction:column;gap:6px;min-width:0}
.field label,.lab{font-size:12px;font-weight:600;letter-spacing:.04em;text-transform:uppercase;color:var(--ink-3)}
.input,select.input{width:100%;min-height:40px;padding:8px 12px;border-radius:10px;border:1px solid var(--line);background:var(--surface);color:var(--ink)}
input[type=range]{width:100%;accent-color:var(--accent)}

main{padding-block:28px 96px}
.page-head{display:flex;flex-wrap:wrap;gap:12px 24px;align-items:end;justify-content:space-between;margin-bottom:20px}
.page-head h1{font-size:clamp(1.6rem,3vw,2.2rem)}
.page-head p{color:var(--ink-2);max-width:60ch;margin-top:4px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:16px;min-width:0}
.eyebrow{font:500 12px var(--font-data);letter-spacing:.08em;text-transform:uppercase;color:var(--accent)}

/* chart hosts */
.chart{position:relative;width:100%;height:240px;min-width:0}
.chart svg{display:block;overflow:visible}
.chart .gl{stroke:var(--line);stroke-width:1}
.chart .bl{stroke:var(--ink-3);stroke-width:1;stroke-dasharray:2 4}
.chart .al{fill:var(--ink-3);font:400 10.5px var(--font-data)}
.chart .el{font:500 11px var(--font-data)}
.chart .ch{stroke:var(--ink-3);stroke-width:1}
.chart .hd{stroke:var(--surface);stroke-width:2}
.chart .ov{touch-action:pan-y;cursor:crosshair}
.chart .tip{position:absolute;pointer-events:none;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:8px 10px;box-shadow:var(--shadow);font-size:12px;display:flex;flex-direction:column;gap:2px;white-space:nowrap;z-index:2}
.chart .tip b{font:500 13px var(--font-data)}
.chart .tip span{color:var(--ink-3)}
.chart .tip em{font:500 9.5px var(--font-data);letter-spacing:.08em;color:var(--warn);font-style:normal}
.spark{display:block;width:88px;height:34px}

/* hero */
.hero{display:grid;gap:32px;grid-template-columns:minmax(0,1fr);padding-block:16px 8px}
@media(min-width:960px){.hero{grid-template-columns:minmax(0,5fr) minmax(0,6fr);align-items:center;gap:48px;padding-block:28px 16px}}
.hero h1{font-size:clamp(2.1rem,5vw,3.4rem);font-weight:700;line-height:1.08;margin:12px 0 16px;letter-spacing:-.03em}
.lead{font-size:17px;color:var(--ink-2);max-width:52ch}
.cta{display:flex;gap:10px;flex-wrap:wrap;margin-top:24px}
.hero-chart{padding:16px 16px 10px;box-shadow:var(--shadow)}
.hero-chart header{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:6px;flex-wrap:wrap}
.hero-chart .nm{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap}
.hero-chart .nm b{font:600 16px var(--font-body)}
.hero-chart .nm .num{font-size:clamp(20px,5vw,28px);font-weight:500}
.hero-chart figcaption{color:var(--ink-3);font-size:12.5px;margin-top:6px}
.section{margin-top:44px}
.section>h2{font-size:1.4rem;margin-bottom:14px}
.paths{display:grid;gap:16px;grid-template-columns:minmax(0,1fr)}
@media(min-width:760px){.paths{grid-template-columns:repeat(2,minmax(0,1fr))}}
.path{padding:22px;display:flex;flex-direction:column;gap:14px}
.path h3{font-size:1.25rem}
.path ol{margin:0;padding:0;list-style:none;display:flex;flex-direction:column;gap:10px;counter-reset:s}
.path li{display:flex;gap:12px;color:var(--ink-2);counter-increment:s}
.path li::before{content:counter(s);flex:none;width:24px;height:24px;border-radius:50%;background:var(--accent-soft);color:var(--accent);font:500 12px/24px var(--font-data);text-align:center}
.path .btn{align-self:flex-start;margin-top:auto}
.principles{display:grid;gap:12px;grid-template-columns:repeat(auto-fit,minmax(220px,1fr))}
.principles div{padding:16px 18px}
.principles b{display:block;font:600 15px var(--font-body);margin-bottom:4px}
.principles span{color:var(--ink-2);font-size:14px}
.legend{display:grid;gap:12px;grid-template-columns:repeat(auto-fit,minmax(240px,1fr))}
.legend div{padding:16px 18px;display:flex;flex-direction:column;gap:8px;align-items:flex-start}
.legend span.t{color:var(--ink-2);font-size:14px}
.strip{display:grid;gap:12px;grid-template-columns:repeat(auto-fit,minmax(230px,1fr))}
.tile{padding:14px 16px;display:grid;grid-template-columns:1fr auto;gap:2px 12px;align-items:center;text-align:left;cursor:pointer;width:100%}
.tile:hover{border-color:var(--ink-3)}
.tile b{font:600 15px var(--font-body)}
.tile .sub{color:var(--ink-3);font-size:12.5px}
.tile .num{font-size:17px}
.tile .spark{grid-row:1/3;grid-column:2}
.tile .r{display:flex;gap:8px;align-items:center;margin-top:6px;grid-column:1}

/* market */
.mbar{display:flex;flex-wrap:wrap;gap:10px 14px;align-items:center;margin-bottom:14px}
.mbar .grow{flex:1}
.stamp{font-size:12.5px;color:var(--ink-3);display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.tabs{display:flex;gap:4px;border-bottom:1px solid var(--line);margin-bottom:16px;overflow-x:auto}
.tabs a{padding:10px 14px;text-decoration:none;color:var(--ink-2);font-weight:500;border-bottom:2px solid transparent;white-space:nowrap;margin-bottom:-1px}
.tabs a[aria-current="page"]{color:var(--accent);border-color:var(--accent)}
.tabs .cnt{display:inline-block;min-width:18px;padding:1px 5px;margin-left:6px;border-radius:9px;background:var(--surface-2);font:500 11px/16px var(--font-data);text-align:center}
.mkt{display:grid;gap:20px;grid-template-columns:minmax(0,1fr)}
@media(min-width:1100px){.mkt{grid-template-columns:minmax(0,1fr) 320px;align-items:start}}
.panels{display:grid;gap:16px;grid-template-columns:minmax(0,1fr)}
@media(min-width:900px){.panels[data-layout="2"],.panels[data-layout="4"]{grid-template-columns:repeat(2,minmax(0,1fr))}}
.panel{padding:14px 14px 8px}
.panel-h{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-bottom:6px}
.panel-h select{max-width:170px;min-height:34px;padding:4px 8px;font-weight:600}
.panel-h .px{font-size:16px}
.panel-h .sp{flex:1}
.panels[data-layout="1"] .chart{height:380px}
.aside{padding:14px;position:sticky;top:140px}
@media(max-width:1099px){.aside{position:static}}
.aside h2{font-size:1.05rem;margin-bottom:2px}
.aside .hint{color:var(--ink-3);font-size:12.5px;margin-bottom:10px}
.wl{list-style:none;margin:8px 0 0;padding:0;display:flex;flex-direction:column}
.wl li{display:flex;align-items:center;gap:4px;border-top:1px solid var(--line)}
.wl .open{flex:1;min-width:0;display:grid;grid-template-columns:1fr auto auto;gap:2px 10px;align-items:center;padding:10px 4px;background:transparent;border:0;text-align:left;cursor:pointer;border-radius:8px}
.wl .open:hover{background:var(--surface-2)}
.wl .nm{font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.wl .sub{grid-column:1;color:var(--ink-3);font-size:12px}
.wl .num{font-size:13px;text-align:right}
.wl .spark{grid-row:1/3;grid-column:2;width:60px}
.wl .open .pill{grid-column:3;grid-row:1/3}
.wl .star{width:34px;height:34px;border:0;background:transparent;color:var(--accent);cursor:pointer;border-radius:8px;font-size:17px}
.wl .star:hover{background:var(--surface-2)}
.wl-add{margin-top:10px;display:flex;gap:8px}
.cmpchips{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:14px}
.chip{display:inline-flex;align-items:center;gap:8px;padding:6px 12px;border-radius:999px;border:1px solid var(--line);background:var(--surface);cursor:pointer;font-size:13.5px;font-weight:500;min-height:34px}
.chip[aria-pressed="true"]{background:var(--accent-soft);border-color:var(--accent);color:var(--accent)}
.chip i{width:10px;height:10px;border-radius:50%;display:inline-block}
.tblwrap{overflow-x:auto;margin-top:16px}
table{border-collapse:collapse;width:100%;font-size:14px}
th,td{padding:10px 12px;text-align:left;border-bottom:1px solid var(--line);vertical-align:top}
th{font-size:12px;letter-spacing:.04em;text-transform:uppercase;color:var(--ink-3);font-weight:600;white-space:nowrap}
td.r,th.r{text-align:right}
.alertform{display:grid;gap:12px;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));align-items:end;padding:16px}
.alist{list-style:none;margin:16px 0 0;padding:0;display:flex;flex-direction:column;gap:8px}
.alist li{display:flex;gap:12px;align-items:center;padding:12px 14px;flex-wrap:wrap}
.alist .grow{flex:1;min-width:180px}
.empty{padding:28px;text-align:center;color:var(--ink-2)}

/* sheet */
.sheet{position:fixed;inset:0;z-index:50;display:flex;justify-content:flex-end}
.sheet-bg{position:absolute;inset:0;background:rgba(5,10,20,.5)}
.sheet-panel{position:relative;width:min(560px,100%);height:100%;overflow-y:auto;background:var(--bg);border-left:1px solid var(--line);padding:18px max(18px,env(safe-area-inset-right,0px)) calc(24px + env(safe-area-inset-bottom,0px)) 18px;padding-top:calc(18px + env(safe-area-inset-top,0px));display:flex;flex-direction:column;gap:16px}
@media(max-width:640px){.sheet{align-items:flex-end}.sheet-panel{height:92%;border-left:0;border-top:1px solid var(--line);border-radius:18px 18px 0 0;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}}
@media(prefers-reduced-motion:no-preference){.sheet-panel{animation:slide .22s ease-out}@keyframes slide{from{transform:translateX(24px);opacity:0}to{transform:none;opacity:1}}}
.sh-h{display:flex;justify-content:space-between;gap:12px;align-items:flex-start}
.sh-h h2{font-size:1.5rem}
.sh-h .meta{display:flex;gap:8px;align-items:center;color:var(--ink-3);font-size:13px;margin-bottom:4px;flex-wrap:wrap}
.sh-px{display:flex;gap:12px;align-items:center;flex-wrap:wrap}
.sh-px .num{font-size:28px;font-weight:500}
.stats{display:grid;gap:1px;grid-template-columns:repeat(3,minmax(0,1fr));background:var(--line);border:1px solid var(--line);border-radius:12px;overflow:hidden}
.stats div{background:var(--surface);padding:10px 12px;display:flex;flex-direction:column;gap:2px;min-width:0}
.stats span{font-size:11.5px;color:var(--ink-3)}
.stats b{font:500 13.5px var(--font-data);overflow:hidden;text-overflow:ellipsis}
@media(max-width:420px){.stats{grid-template-columns:repeat(2,minmax(0,1fr))}}
.risk{display:flex;align-items:center;gap:10px;font-size:13.5px}
.pips{display:flex;gap:3px}
.pips i{width:16px;height:8px;border-radius:2px;background:var(--line)}
.pips i.on{background:var(--ink-2)}
.sheet .block{padding:14px 16px;display:flex;flex-direction:column;gap:10px}
.sheet .block h3{font-size:1rem}
.sheet .block p{color:var(--ink-2);font-size:14px}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.check{display:flex;gap:8px;align-items:center;font-size:13.5px;color:var(--ink-2)}
.fine{font-size:12.5px;color:var(--ink-3)}

/* toast */
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(24px + env(safe-area-inset-bottom,0px));z-index:70;display:flex;flex-direction:column;gap:8px;align-items:center;pointer-events:none;width:max-content;max-width:calc(100% - 32px)}
.toast div{background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:12px;font-size:14px;box-shadow:var(--shadow)}
.toast div.alert{background:var(--accent);color:var(--accent-ink)}

/* learn */
.learn{display:grid;gap:24px;grid-template-columns:minmax(0,1fr)}
@media(min-width:900px){.learn{grid-template-columns:270px minmax(0,1fr);align-items:start}.lnav-wrap{position:sticky;top:140px}}
.lnav-wrap h2{font-size:1rem;margin-bottom:8px}
.prog{height:6px;border-radius:3px;background:var(--surface-2);overflow:hidden;margin:6px 0 12px}
.prog i{display:block;height:100%;background:var(--accent)}
.lnav{display:flex;flex-direction:column;gap:2px}
.lnav a{display:grid;grid-template-columns:26px 1fr auto;gap:8px;align-items:center;padding:9px 10px;border-radius:10px;text-decoration:none;color:var(--ink-2);font-weight:500;font-size:14px}
.lnav a:hover{background:var(--surface-2)}
.lnav a[aria-current="page"]{background:var(--accent-soft);color:var(--accent)}
.lnav .n{width:24px;height:24px;border-radius:50%;border:1px solid var(--line);display:grid;place-items:center;font:500 11.5px var(--font-data)}
.lnav a.done .n{background:var(--up);border-color:var(--up);color:var(--surface)}
.lnav .m{font:400 11.5px var(--font-data);color:var(--ink-3)}
@media(max-width:899px){.lnav{flex-direction:row;overflow-x:auto;padding-bottom:4px}.lnav a{white-space:nowrap;grid-template-columns:24px auto;border:1px solid var(--line);background:var(--surface)}.lnav .m{display:none}}
.lesson{padding:clamp(18px,3vw,34px)}
.lesson h1{font-size:clamp(1.7rem,3.2vw,2.3rem);margin:6px 0 6px}
.lesson .blurb{color:var(--ink-2);font-size:16.5px;margin-bottom:8px}
.prose{max-width:68ch}
.prose h3{font-size:1.2rem;margin:26px 0 8px}
.prose p,.prose li{color:var(--ink-2);font-size:16px;line-height:1.65}
.prose p+p{margin-top:10px}

updated ", "95": " assets are still simulated.", "96": "</p><p>Not a basis for buy or sell decisions.</p><a href=\"#beranda\" data-act=\"goto-status\">View source details</a>", "97": "<b>Simulated data</b><p>All prices come from a random generator, not market prices. Market data has not loaded yet.</p><p>Not a basis for buy or sell decisions.</p><div class=\"row\"><button class=\"btn btn-sm\" type=\"button\" data-act=\"pause\">", "98": "Resume simulation", "99": "Pause simulation", "100": "</button><a href=\"#beranda\" data-act=\"goto-status\">View details</a></div>", "105": "Chart of ", "106": " over 3 months from delayed data, latest point ", "107": ". Source details are in the Data status section.", "108": "Example chart of ", "109": " over 3 months. Figures and movements come from a random generator and do not reflect actual prices.", "110": "Delayed data, last updated ", "111": "Simulated data, not market prices.", "112": "Market data has not loaded, so this page uses <b>simulated</b> data. Source: ", "113": "Data is fetched on a schedule from ", "114": "data provider", "115": " and stored in <span class=\"num\">data/market.json</span>. Last updated ", "116": ". Gold is calculated from the world gold price times the USD/IDR rate, not the Antam price. This source is unofficial and may change or stop at any time.", "125": "Chart", "166": "Price chart ", "169": "Mini chart ", "174": "\" role=\"img\" aria-label=\"Example candlestick chart, 24 candles\">", "193": "Start from zero", "194": "What investing is, how it differs from saving, and what to have ready before you start.", "195": "<h3>What is investing?</h3><p>Investing means putting money into an asset in the hope that its value grows over time. The key word is <em>hope</em>. No investment is guaranteed to profit, and its value can fall below the amount you put in.</p>", "196": "<h3>Saving, investing, and speculating</h3><dl class=\"defs\"><div><dt>Saving</dt><dd>Money set aside for near-term needs. Its value is stable and easy to access, but it grows little.</dd></div><div><dt>Investing</dt><dd>Money put to work for medium- or long-term goals. Its value goes up and down, with the hope of growing over time.</dd></div><div><dt>Speculating</dt><dd>Chasing price differences in a short time. The chances of gain and loss are both large, and the outcome is hard to predict.</dd></div></dl>", "197": "<h3>Why do people invest?</h3><p>Prices of goods tend to rise year after year (inflation). If inflation is 4% a year, Rp 100 million held only as cash has the purchasing power of about Rp 96 million a year later. Investing is one way to protect or grow purchasing power, in exchange for uncertainty.</p>", "198": "<h3>Before you start</h3><ul><li>Prepare an emergency fund somewhere easy to cash out. 3 to 6 months of expenses is commonly recommended.</li><li>Decide your goal and its time frame. Money needed in 6 months is different from money needed in 10 years.</li><li>Use money you will not need in the near term.</li></ul>", "199": "Investing involves uncertainty: value can go up and down.", "200": "The emergency fund and near-term needs come first.", "201": "Goals and time frame determine the choice of instrument.", "202": "Which statement is most accurate?", "203": "Investing always profits if you hold long enough.", "204": "Investing involves uncertainty: its value can go up or down.", "205": "Investing is safe as long as you pick a popular asset.", "206": "No asset is completely risk-free, and popularity is not a guarantee.", "207": "Which money is most appropriate for risky investing?", "208": "Money for next month's installment.", "209": "Emergency fund.", "210": "Money you do not need soon, after the emergency fund is in place.", "211": "If prices are falling, you should not be forced to sell because you need the money.", "212": "Get to know the instruments", "213": "Stocks, bonds, mutual funds, gold, and crypto: what they are, where returns come from, and what the risks are.", "214": "<p>Each instrument has a different way of working, source of returns, and risk. This table is a general summary, not a ranking of which is best.</p><div class=\"tblwrap\"><table><thead><tr><th>Instrument</th><th>What it is</th><th>Source of returns</th><th>Main risk</th></tr></thead><tbody>", "215": "<tr><td>Stocks</td><td>Ownership of a small part of a company.</td><td>Price increases, dividends if paid.</td><td>Prices fall, company performance worsens. Losses can be large.</td></tr>", "216": "<tr><td>Bonds / government securities</td><td>Debt: you lend money to the issuer.</td><td>Regular coupons (interest) and principal back at maturity.</td><td>Issuer defaults. Prices fall if sold before maturity when interest rates rise.</td></tr>", "217": "<tr><td>Mutual funds</td><td>A pooled fund run by an investment manager.</td><td>Depends on holdings: money market, bonds, stocks, or a mix.</td><td>Unit value falls. Risk follows the portfolio's holdings.</td></tr>", "218": "<tr><td>Gold</td><td>Precious metal, often used as a store of value.</td><td>Changes in the gold price.</td><td>Price fluctuates, there is a buy-sell spread, and no interest or dividends.</td></tr>", "219": "<tr><td>Crypto</td><td>Digital assets based on blockchain.</td><td>Generally price changes.</td><td>Very large swings, platform and security risk, rules can change.</td></tr></tbody></table></div>", "220": "<h3>How to choose as a beginner</h3><p>Start by understanding one or two instruments until you can explain where their returns come from and what could make them fall. If you cannot explain it, hold off.</p><h3>Past performance</h3><p>A chart that rose in the past does not guarantee the same in the future. Use it as study material, not as a promise.</p>", "221": "Understand the source of returns before buying anything.", "222": "Bonds and stocks differ fundamentally: one is a loan, the other is ownership.", "223": "Past performance does not guarantee future results.", "224": "A bond or government security is basically...", "225": "Ownership of part of a company.", "226": "Debt: you lend money to the issuer.", "227": "A digital asset.", "228": "A bondholder is a lender and usually receives regular coupons.", "229": "Gold generally gives returns from...", "230": "Regular dividends.", "231": "Monthly interest.", "232": "The change in the gold price itself.", "233": "Gold produces no cash flow, so its return depends on the price.", "234": "Risk and return", "235": "Types of risk, how risk relates to potential return, and two key terms: volatility and drawdown.", "236": "<h3>Risk is not only falling prices</h3><ul><li><b>Market risk</b>: the whole market falls.</li><li><b>Specific risk</b>: a problem at one company or asset.</li><li><b>Inflation</b>: returns do not keep up with rising prices.</li><li><b>Liquidity</b>: hard to sell quickly at a fair price.</li><li><b>Platform and fraud</b>: unlicensed apps or hacked accounts.</li><li><b>Behavior</b>: emotional decisions, such as panicking when prices fall.</li></ul>", "237": "<h3>Risk and potential return</h3><p>Assets with the potential for larger returns are usually also more uncertain. That does not mean high risk will surely pay off. High risk can also mean large losses.</p>", "238": "<h3>Two key terms</h3><p><b>Volatility</b> measures how widely the price moves up and down. <b>Drawdown</b> is the drop from a peak to the lowest point after it. If a value falls from 100 to 70, the drawdown is 30%.</p>", "239": "<h3>Try it yourself</h3><p>Every path below uses the same average return assumption, 7% a year. Only the volatility differs. Press Reshuffle a few times and watch the spread of final values.</p><div data-widget=\"paths\"></div>", "240": "Larger potential returns usually come with greater uncertainty.", "241": "High volatility means a wider range of outcomes, both up and down.", "242": "Drawdown shows how deep a decline has been.", "243": "High volatility means...", "244": "The price will definitely rise.", "245": "The price swings up and down more widely.", "246": "The risk disappears.", "247": "Volatility measures the width of movement, not its direction.", "248": "Drawdown is...", "249": "The drop from the highest point to the lowest point after it.", "250": "The daily price increase.", "251": "Transaction fees.", "252": "Drawdown helps judge how severe a decline an asset has experienced.", "253": "Reading price charts", "254": "Axes, lines and candlesticks, timeframes, and what a chart cannot tell you.", "255": "<h3>Line charts</h3><p>The line connects closing prices over time. The horizontal axis is time, the vertical axis is price. The dotted line on the Markets chart marks the price at the start of the period, so you can see where the price is now relative to the starting point.</p>", "256": "<h3>Candlesticks</h3><p>One candle represents one period (for example, one day). The <b>body</b> shows the distance from the opening price to the closing price. The <b>thin wicks</b> show the highest and lowest prices in that period. Colors differ between platforms; here green means the close was higher than the open. Click a candle to see its details.</p><div data-widget=\"candles\"></div>", "257": "<h3>Timeframes</h3><p>A 1-day chart and a 1-year chart of the same asset can look opposite: down today, up over the past year. Both are right, they just capture different time spans. Choose a timeframe that fits your goal.</p>", "258": "<h3>The limits of a chart</h3><p>A chart shows what has already happened. Trend lines, support areas, and resistance are ways people summarize the past, not fences that will surely hold the price.</p>", "259": "Candle body: open-to-close distance. Wicks: highest to lowest.", "260": "Different timeframes can give different impressions of the same asset.", "261": "A chart summarizes the past and does not guarantee what comes next.", "262": "The body of a candle shows...", "263": "The distance between the opening and closing price.", "264": "Trading volume.", "265": "Only the highest price.", "266": "The thin wicks above and below the body show the highest and lowest prices.", "267": "Why can a 1-day and a 1-year chart look opposite?", "268": "One of them is fake data.", "269": "Different timeframes capture different time spans.", "270": "Charts keep changing on their own.", "271": "Choose a timeframe that fits your goal and time frame.", "272": "Fundamental and technical analysis", "273": "Two commonly used viewpoints, and their limits.", "274": "<h3>Fundamental: is the business healthy and the price fair?</h3><p>Fundamental analysis studies a company through its financial statements and business prospects. Some commonly used measures:</p><ul><li><b>Earnings</b>: whether the company makes a profit, and whether it tends to grow.</li><li><b>P/E (price to earnings)</b>: share price divided by earnings per share. Shows how many times earnings the market pays for one share.</li><li><b>ROE</b>: earnings relative to shareholders' equity, a measure of efficiency.</li><li><b>Debt</b>: too much debt can endanger a company in hard times.</li><li><b>Dividends</b>: the portion of earnings paid out, if any.</li></ul><p>These numbers only become useful when compared with similar companies and with the company's own history. A low P/E can mean cheap, but it can also mean the market expects earnings to fall.</p>", "275": "<h3>Technical: what do price patterns say?</h3><p>Technical analysis studies price movement and volume. Two basic tools:</p><ul><li><b>Moving average (MA)</b>: the average closing price over the last several periods. It smooths daily movement so the trend is easier to see.</li><li><b>RSI</b>: a momentum measure from 0 to 100. A reading above 70 is often called overbought and below 30 oversold. That is a reading habit, not an automatic signal.</li></ul>", "276": "<h3>Try it yourself</h3><p>The chart below uses one year of IHSG data currently loaded in Finvest. Turn on MA 20 and MA 50, then see how the average lines always lag behind the price.</p><div data-widget=\"ma\"></div>", "277": "<h3>Its limits</h3><p>Both are aids to understanding, not answer machines. MA lags because it is computed from the past, and it often gives false signals when the price moves sideways.</p>", "278": "Fundamental judges the business and a fair price; technical reads price patterns.", "279": "A low P/E is not necessarily cheap. Find out why.", "280": "Technical indicators are not automatic buy or sell signals.", "281": "Does a low P/E always mean a cheap stock worth buying?", "282": "Yes, always.", "283": "No, you need to look at why the P/E is low, for example falling earnings.", "284": "It only applies to gold.", "285": "Ratios must be compared with similar companies and the company's own history.", "286": "A moving average (MA) is calculated from...", "287": "The average price over the last several periods.", "288": "A prediction of tomorrow's price.", "289": "Company earnings.", "290": "Because it is calculated from past data, MA always lags behind the price.", "291": "Diversification and risk management", "292": "Spreading risk, deciding position sizes, and why diversification does not remove risk.", "293": "<h3>Do not put all your eggs in one basket</h3><p>Diversification means spreading money across several assets that do not move exactly alike. If one falls, the others may not fall as deeply. You can spread across asset types, across sectors, and across time (buying in stages).</p>", "294": "<h3>Correlation determines the benefit</h3><p>Correlation measures how closely two assets move together, from 1 (always together) to -1 (always opposite). Two assets with high correlation give only a small diversification benefit. Move the settings below to see it.</p><div data-widget=\"divers\"></div>", "295": "<h3>Risk management practices</h3><ul><li><b>Limit position size</b>: decide the maximum loss you can accept on one asset, before buying.</li><li><b>Buy in stages</b>: spreading out purchase timing reduces the risk of buying everything at a bad time, though it does not guarantee better results.</li><li><b>Review regularly</b>: positions can drift as prices move. Check whether they still fit your goals.</li><li><b>Avoid borrowing to invest</b>: losses still have to be paid back.</li></ul>", "296": "<h3>Its limits</h3><p>Diversification reduces specific risk, but does not remove market risk. In a major crisis, many assets can fall at the same time.</p>", "297": "Diversification reduces the impact of one bad asset; it does not remove risk.", "298": "Low correlation gives a larger diversification benefit.", "299": "Set your loss limit before buying, not after.", "300": "The goal of diversification is...", "301": "To guarantee you never lose.", "302": "To reduce the impact of one bad asset on the whole.", "303": "To make sure you profit more.", "304": "Diversification reduces specific risk, but market risk remains.", "305": "Two assets that move very much together (high correlation) give a diversification benefit that is...", "306": "Larger.", "307": "Smaller.", "308": "The same.", "309": "If both fall together, spreading out does not help much.", "310": "Psychology and common mistakes", "311": "Emotions are often more dangerous than prices. Learn the common traps and the signs of fraud.", "312": "<h3>Behavioral traps</h3><dl class=\"defs\"><div><dt>FOMO</dt><dd>Fear of missing out. Buying because the price is surging, not because you understand the asset.</dd></div><div><dt>Panic selling</dt><dd>Selling when the price drops sharply, locking in a loss that may not have been necessary.</dd></div><div><dt>Overconfidence</dt><dd>Thinking a few wins mean you already understand. Markets can change.</dd></div><div><dt>Debt or leverage</dt><dd>Enlarging a position with borrowed money. Gains and losses both grow, and losses still have to be paid back.</dd></div></dl>", "313": "<h3>Signs of a suspicious investment</h3><ul><li>Promises high, fixed returns with no risk.</li><li>Pressures you to decide quickly or to recruit others for a bonus.</li><li>It is unclear where the returns come from.</li><li>The seller or platform has an unclear license. Check the list of licensed entities on the OJK website.</li></ul>", "314": "<h3>Helpful questions</h3><ul><li>Where do the returns on this investment come from?</li><li>What is the worst-case scenario, and can I bear it?</li><li>Does this fit my goals and time frame?</li></ul>", "315": "Write down your plan and loss limit before buying, so emotions do not take the lead.", "316": "High returns with no risk is a red flag.", "317": "Check the seller's license before sending money.", "318": "Which of these is a suspicious sign?", "319": "An offer of high, fixed returns with no risk.", "320": "Risks are explained and the seller is licensed.", "321": "Fees are written clearly.", "322": "Returns and risk go hand in hand. A promise of no risk is almost always misleading.", "323": "The price drops sharply and you panic. A healthier step is...", "324": "Sell everything now.", "325": "Revisit your plan and time frame before acting.", "326": "Add money by borrowing.", "327": "Decisions based on a plan are less often regretted than decisions made in a panic.", "328": "<h4>Eight possible paths over 5 years</h4><div class=\"ctl\"><div class=\"field\"><label for=\"pf\">Volatility</label><select class=\"input\" id=\"pf\"><option value=\"3\">Low (3% a year)</option><option value=\"15\" selected>Medium (15% a year)</option><option value=\"40\">High (40% a year)</option></select></div><button class=\"btn btn-sm\" type=\"button\" id=\"pr\">Reshuffle</button></div><div class=\"chart\"></div><p class=\"out\" id=\"po\" aria-live=\"polite\"></p>", "329": "Of 8 paths starting at 100: lowest final value ", "330": ", highest ", "331": ". This is an illustration, not a prediction.", "333": "Eight simulated paths", "334": "Start", "335": "<h4>Example candlesticks (24 periods, simulated)</h4><div class=\"chart\"></div><div class=\"row\" style=\"margin-top:8px\"><button class=\"btn btn-sm\" type=\"button\" id=\"cp\">Previous</button><button class=\"btn btn-sm\" type=\"button\" id=\"cn\">Next</button></div><p class=\"out\" id=\"co\" aria-live=\"polite\"></p>", "336": "<b>Period ", "337": "</b>: opened at ", "338": ", closed at ", "339": "). Highest ", "340": ", lowest ", "341": ". The price range during this period ", "343": "<h4>IHSG 1 year with moving averages</h4><div class=\"ctl\"><label class=\"check\"><input type=\"checkbox\" id=\"m20\" checked> MA 20</label><label class=\"check\"><input type=\"checkbox\" id=\"m50\"> MA 50</label></div><div class=\"chart\"></div><p class=\"out\">The average line only turns after the price turns. That is why MA is called a lagging indicator.</p>", "346": "<h4>Example blend of two assets</h4><div class=\"ctl\"><div class=\"field\"><div class=\"rangeval\"><label for=\"dw\">Share of asset A</label><b id=\"dwv\"></b></div><input type=\"range\" id=\"dw\" min=\"0\" max=\"100\" step=\"2\" value=\"50\"></div><div class=\"field\"><div class=\"rangeval\"><label for=\"dr\">Correlation of A and B</label><b id=\"drv\"></b></div><input type=\"range\" id=\"dr\" min=\"-50\" max=\"100\" step=\"5\" value=\"30\"></div></div><div class=\"chart\"></div><p class=\"out\" id=\"do\" aria-live=\"polite\"></p>", "348": "Volatility of a two-asset blend", "349": "% B</b><span>Volatility ", "350": "Blend volatility: <b>", "351": "%</b> a year. Asset A alone ", "352": "%, asset B alone ", "353": "%. These example figures are only an illustration.", "354": "Conservative (similar to money market or deposits)", "355": "Fixed income (bonds)", "356": "Mix of stocks and bonds", "357": "Stocks (broad index)", "358": "Highly volatile assets", "359": "<div class=\"kpis\"><div><span>Total contributed</span><b>", "360": "</b><small>initial capital + monthly contributions</small></div>", "361": "<div><span>Middle value (median)</span><b>", "362": "</b><small>half of scenarios are above this</small></div>", "363": "<div><span>Weaker scenario</span><b>", "364": "</b><small>10% of scenarios are below this</small></div>", "365": "<div><span>Stronger scenario</span><b>", "366": "</b><small>10% of scenarios are above this</small></div>", "367": "<div><span>Final value &lt; contributions</span><b>", "368": "%</b><small>of ", "369": " scenarios</small></div></div>", "370": "<div class=\"keyline\"><span><i style=\"background:var(--accent);opacity:.25\"></i>80% of scenarios (P10 to P90)</span><span><i style=\"background:var(--accent);opacity:.5\"></i>middle 50% of scenarios (P25 to P75)</span><span><i style=\"background:var(--accent)\"></i>Median</span><span><i style=\"background:var(--ink-3);height:2px\"></i>Total contributed</span></div>", "371": "<p class=\"fine\">How to read it: the band shows the spread of outcomes from ", "372": " random paths using the assumptions on the left. This is an illustration to understand uncertainty, not a prediction and not historical data. Taxes, fees, and inflation are not included.</p>", "377": "Spread of simulated portfolio values", "378": "</b><span>Median ", "379": "</span><span>Contributions ", "380": "</span><em>SIMULATED</em>", "382": "<div class=\"seg\" role=\"group\" aria-label=\"Choose timeframe\">", "390": "<section class=\"hero\"><div><p class=\"eyebrow\">Learn investing &middot; Track markets</p><h1>Understand the <em>risk</em> first, then watch the market.</h1><p class=\"lead\">Learn investing from scratch in simple language, then follow many instruments on one screen. No promises of profit and no buy or sell recommendations.</p><div class=\"cta\"><a class=\"btn btn-primary\" href=\"#belajar\">Start learning from zero</a><a class=\"btn\" href=\"#pasar\">Open market dashboard</a></div></div>", "391": "<figure class=\"hero-chart card\" style=\"margin:0\"><div class=\"seg hero-pick\" role=\"group\" aria-label=\"Choose asset for the chart\">", "395": "<section class=\"section\"><h2>Two ways in</h2><div class=\"paths\"><article class=\"card path\"><p class=\"eyebrow\">For beginners</p><h3>I'm just starting</h3><ol><li>Read the basics of investing and get to know the instruments.</li><li>Understand risk, price charts, and how to spread your money.</li><li>Try the simulator to see the range of possible outcomes.</li></ol><a class=\"btn btn-primary\" href=\"#belajar\">Start learning</a></article>", "396": "<article class=\"card path\"><p class=\"eyebrow\">For those already investing</p><h3>I need monitoring tools</h3><ol><li>Build a dashboard of 1, 2, or 4 charts as you need.</li><li>Add assets to a watchlist and compare their performance.</li><li>Set price alerts to watch while the page is open.</li></ol><a class=\"btn btn-primary\" href=\"#pasar\">Open dashboard</a></article></div></section>", "397": "<section class=\"section\"><h2>Market snapshot</h2><p class=\"fine\" style=\"margin:-8px 0 12px\">", "398": "<section class=\"section\"><h2>Product principles</h2><div class=\"principles\"><div class=\"card\"><b>Neutral</b><span>Education does not promise profit.</span></div><div class=\"card\"><b>Risk explained</b><span>Simple language, including the less pleasant scenarios.</span></div><div class=\"card\"><b>No recommendations</b><span>No automatic buy or sell advice.</span></div><div class=\"card\"><b>Transparent data</b><span>Every price shows its status and update time.</span></div></div></section>", "399": "<section class=\"section\" id=\"status\"><h2>Data status</h2><div class=\"legend\"><div class=\"card\"><span class=\"badge live\">ACTUAL</span><span class=\"t\">Prices from a market source, shown with the source name and update time.</span></div><div class=\"card\"><span class=\"badge delayed\">DELAYED</span><span class=\"t\">Market data with a lag. In Finvest the lag follows the data fetch schedule, and the time of the latest data is written near the price.</span></div><div class=\"card\"><span class=\"badge sim\">SIMULATED</span><span class=\"t function alignSeries(ids,tf){

  ser.forEach(function(s){s.t.forEach(function(t){set[t]=1;});});
  var grid=Object.keys(set).map(Number).sort(function(a,b){return a-b;});
  var cols=ser.map(function(s){var out=[],p=0,last=NaN;for(k=0;k<grid.length;k++){while(p<s.t.length&&s.t[p]<=grid[k]){last=s.v[p];p++;}out.push(last);}return out;});
  var start=0;
  while(start<grid.length&&cols.some(function(c){return !isFinite(c[start]);}))start++;

  clearPage:function(){var ov=$('#overlay'),self=this;Array.from(this.reg.keys()).forEach(function(h){if(!ov.contains(h))self.reg.delete(h);});}
};
function yDec(vals){var mn=Math.min.apply(null,vals),mx=Math.max.apply(null,vals),sp=mx-mn;return sp<5?2:sp<50?1:0;}
function xText(tf,s,i){return fmtDate(s.t[i]);}
function priceCfg(id,tf,opts){
  opts=opts||{};
  var a=BY[id],s=Market.series(id,tf),v=s.v,up=v[v.length-1]>=v[0];
  var series=[{v:v,color:up?'var(--up)':'var(--down)',width:2}];
  (opts.ma||[]).forEach(function(p,k){series.push({v:sma(v,p),color:k?'var(--s2)':'var(--s1)',width:1.4,dash:k?'5 3':null});});
  var dec=yDec(v),st=STATUS[Market.status(id)].label;
  return {series:series,area:true,axis:opts.noAxis?false:'right',baseline:v[0],noDots:false,
    label:_t(166,'Grafik harga ')+a.name+', '+TFS[tf].name+' ('+statusLong(id)+')',
    yFmt:function(t){return nf(t,dec);},xLabel:function(i){return xText(tf,s,i);},
    tip:opts.noTip?null:function(i){return '<b>'+esc(fmtPrice(a,v[i]))+'</b><span>'+esc(s.intraday?fmtDateTime(s.t[i]):fmtDate(s.t[i]))+'</span><em>'+st+'</em>';}};
}
function sparkCfg(id,tf){var v=Market.series(id,tf).v,up=v[v.length-1]>=v[0];return {series:[{v:v,color:up?'var(--up)':'var(--down)',width:1.6}],noDots:true,label:_t(169,'Grafik mini ')+BY[id].name};}
function mountSparks(root){$$('[data-spark]',root).forEach(function(h){Charts.mount(h,function(){return sparkCfg(h.dataset.spark,h.dataset.tf||Store.state.tf);});});}

function drawCandles(host,candles,sel){
  var W=host.clientWidth,H=host.clientHeight;if(W<20||H<20)return;
  var mn=Infinity,mx=-Infinity;candles.forEach(function(c){mn=Math.min(mn,c.l);mx=Math.max(mx,c.h);});
  var pv=(mx-mn)*0.08;mn-=pv;mx+=pv;
  var m={l:4,r:44,t:8,b:8},iw=W-m.l-m.r,ih=H-m.t-m.b,n=candles.length,cw=iw/n;
  var Y=function(v){return m.t+(1-(v-mn)/(mx-mn))*ih;};
  var svg='<svg width="'+W+'" height="'+H+'" viewBox="0 0 '+W+' '+H+_t(174,'" role="img" aria-label="Grafik candlestick contoh, 24 batang">');
  niceTicks(mn,mx,4).forEach(function(t){svg+='<line class="gl" x1="'+m.l+'" x2="'+(W-m.r)+'" y1="'+Y(t).toFixed(1)+'" y2="'+Y(t).toFixed(1)+'"/><text class="al" x="'+(W-m.r+6)+'" y="'+(Y(t)+4).toFixed(1)+'">'+nf(t,0)+'</text>';});
  candles.forEach(function(c,i){
    var x=m.l+i*cw+cw/2,up=c.c>=c.o,col=up?'var(--up)':'var(--down)',bw=Math.max(3,cw*0.58);
    var top=Y(Math.max(c.o,c.c)),bot=Y(Math.min(c.o,c.c));
    if(i===sel)svg+='<rect x="'+(m.l+i*cw).toFixed(1)+'" y="'+m.t+'" width="'+cw.toFixed(1)+'" height="'+ih+'" style="fill:var(--accent-soft)"/>';
    svg+='<g data-i="'+i+'" style="cursor:pointer"><rect x="'+(m.l+i*cw).toFixed(1)+'" y="0" width="'+cw.toFixed(1)+'" height="'+H+'" fill="transparent"/><line x1="'+x.toFixed(1)+'" x2="'+x.toFixed(1)+'" y1="'+Y(c.h).toFixed(1)+'" y2="'+Y(c.l).toFixed(1)+'" style="stroke:'+col+'" stroke-width="1.5"/><rect x="'+(x-bw/2).toFixed(1)+'" y="'+top.toFixed(1)+'" width="'+bw.toFixed(1)+'" height="'+Math.max(2,bot-top).toFixed(1)+'" rx="1.5" style="fill:'+col+'"/></g>';
  });
  host.innerHTML=svg+'</svg>';
}

function toast(msg,kind){
  var box=$('#toast'),el=document.createElement('div');
  el.textContent=msg;if(kind)el.className=kind;box.appendChild(el);
  setTimeout(function(){if(el.parentNode)el.parentNode.removeChild(el);},kind==='alert'?6000:3200);
}

var LESSONS=[
{id:'dasar',title:_t(193,'Mulai dari nol'),mins:5,blurb:_t(194,'Apa itu investasi, apa bedanya dengan menabung, dan apa yang perlu siap sebelum mulai.'),
 body:_t(195,'<h3>Apa itu investasi?</h3><p>Investasi berarti menaruh uang pada suatu aset dengan harapan nilainya bertambah seiring waktu. Kata kuncinya adalah <em>harapan</em>. Tidak ada investasi yang pasti untung, dan nilainya bisa turun di bawah jumlah uang yang Anda tanam.</p>')+
 _t(196,'<h3>Menabung, berinvestasi, dan spekulasi</h3><dl class="defs"><div><dt>Menabung</dt><dd>Uang disimpan untuk keperluan dekat. Nilainya stabil dan mudah diambil, tetapi pertumbuhannya kecil.</dd></div><div><dt>Berinvestasi</dt><dd>Uang ditanam untuk tujuan jangka menengah atau panjang. Nilainya naik-turun, dengan harapan tumbuh dari waktu ke waktu.</dd></div><div><dt>Spekulasi</dt><dd>Mengejar selisih harga dalam waktu singkat. Peluang untung dan rugi sama-sama besar, dan hasilnya sulit diprediksi.</dd></div></dl>')+
 _t(197,'<h3>Mengapa orang berinvestasi?</h3><p>Harga barang cenderung naik dari tahun ke tahun (inflasi). Jika inflasi 4% per tahun, uang Rp 100 juta yang hanya disimpan tunai setara daya beli sekitar Rp 96 juta setahun kemudian. Investasi adalah salah satu cara menjaga atau menumbuhkan daya beli, dengan imbalan berupa ketidakpastian.</p>')+
 _t(198,'<h3>Sebelum mulai</h3><ul><li>Siapkan dana darurat di tempat yang mudah dicairkan. Umumnya dianjurkan 3 sampai 6 bulan pengeluaran.</li><li>Tentukan tujuan dan jangka waktunya. Dana untuk 6 bulan lagi berbeda dengan dana untuk 10 tahun lagi.</li><li>Pakai uang yang tidak Anda butuhkan dalam waktu dekat.</li></ul>'),
 points:[_t(199,'Investasi mengandung ketidakpastian: nilai bisa naik dan bisa turun.'),_t(200,'Dana darurat dan kebutuhan dekat didahulukan.'),_t(201,'Tujuan dan jangka waktu menentukan pilihan instrumen.')],
 quiz:[{q:_t(202,'Pernyataan mana yang paling tepat?'),o:[_t(203,'Investasi pasti untung jika dipegang cukup lama.'),_t(204,'Investasi mengandung ketidakpastian: nilainya bisa naik maupun turun.'),_t(205,'Investasi aman selama memilih aset yang populer.')],a:1,why:_t(206,'Tidak ada aset yang bebas risiko sepenuhnya, dan popularitas bukan jaminan.')},
  {q:_t(207,'Uang mana yang paling pantas dipakai untuk investasi berisiko?'),o:[_t(208,'Uang untuk cicilan bulan depan.'),_t(209,'Dana darurat.'),_t(210,'Uang yang tidak dibutuhkan dalam waktu dekat, setelah dana darurat tersedia.')],a:2,why:_t(211,'Jika harga sedang turun, Anda tidak boleh terpaksa menjual karena butuh uang.')}]},

{id:'instrumen',title:_t(212,'Mengenal instrumen'),mins:6,blurb:_t(213,'Saham, obligasi, reksa dana, emas, dan kripto: apa itu, dari mana hasilnya, dan apa risikonya.'),
 body:_t(214,'<p>Setiap instrumen punya cara kerja, sumber hasil, dan risiko berbeda. Tabel ini ringkasan umum, bukan peringkat mana yang terbaik.</p><div class="tblwrap"><table><thead><tr><th>Instrumen</th><th>Apa itu</th><th>Sumber hasil</th><th>Risiko utama</th></tr></thead><tbody>')+
 _t(215,'<tr><td>Saham</td><td>Kepemilikan sebagian kecil perusahaan.</td><td>Kenaikan harga, dividen jika dibagikan.</td><td>Harga turun, kinerja perusahaan memburuk. Kerugian bisa besar.</td></tr>')+
 _t(216,'<tr><td>Obligasi / SBN</td><td>Surat utang: Anda meminjamkan uang ke penerbit.</td><td>Kupon (bunga) berkala dan pokok kembali saat jatuh tempo.</td><td>Penerbit gagal bayar. Harga turun jika dijual sebelum jatuh tempo saat suku bunga naik.</td></tr>')+
 _t(217,'<tr><td>Reksa dana</td><td>Dana bersama yang dikelola manajer investasi.</td><td>Tergantung isi: pasar uang, obligasi, saham, atau campuran.</td><td>Nilai unit turun. Risikonya mengikuti isi portofolio.</td></tr>')+
 _t(218,'<tr><td>Emas</td><td>Logam mulia, sering dipakai sebagai penyimpan nilai.</td><td>Perubahan harga emas.</td><td>Harga berfluktuasi, ada selisih jual-beli, tidak ada bunga atau dividen.</td></tr>')+
 _t(219,'<tr><td>Kripto</td><td>Aset digital berbasis blockchain.</td><td>Umumnya perubahan harga.</td><td>Fluktuasi sangat besar, risiko platform dan keamanan, aturan bisa berubah.</td></tr></tbody></table></div>')+
 _t(220,'<h3>Cara memilih untuk pemula</h3><p>Mulailah dari memahami satu atau dua instrumen sampai Anda bisa menjelaskan dari mana hasilnya berasal dan apa yang bisa membuatnya turun. Jika Anda tidak bisa menjelaskannya, tunda dulu.</p><h3>Hasil masa lalu</h3><p>Grafik naik di masa lalu tidak menjamin hal yang sama di masa depan. Gunakan sebagai bahan belajar, bukan janji.</p>'),
 points:[_t(221,'Pahami sumber hasil sebelum membeli apa pun.'),_t(222,'Obligasi dan saham berbeda mendasar: yang satu pinjaman, yang lain kepemilikan.'),_t(223,'Hasil masa lalu tidak menjamin hasil masa depan.')],
 quiz:[{q:_t(224,'Obligasi atau SBN pada dasarnya adalah...'),o:[_t(225,'Kepemilikan sebagian perusahaan.'),_t(226,'Surat utang: Anda meminjamkan uang ke penerbit.'),_t(227,'Aset digital.')],a:1,why:_t(228,'Pemegang obligasi adalah pemberi pinjaman, biasanya menerima kupon berkala.')},
  {q:_t(229,'Emas umumnya memberi hasil dari...'),o:[_t(230,'Dividen rutin.'),_t(231,'Bunga bulanan.'),_t(232,'Perubahan harga emas itu sendiri.')],a:2,why:_t(233,'Emas tidak menghasilkan arus kas, jadi hasilnya bergantung pada harga.')}]},

{id:'risiko',title:_t(234,'Risiko dan imbal hasil'),mins:7,blurb:_t(235,'Jenis-jenis risiko, hubungan risiko dengan potensi hasil, dan dua istilah penting: volatilitas dan drawdown.'),
 body:_t(236,'<h3>Risiko bukan hanya harga turun</h3><ul><li><b>Risiko pasar</b>: harga seluruh pasar turun.</li><li><b>Risiko spesifik</b>: masalah pada satu perusahaan atau aset.</li><li><b>Inflasi</b>: hasil tidak mengejar kenaikan harga barang.</li><li><b>Likuiditas</b>: sulit dijual cepat pada harga wajar.</li><li><b>Platform dan penipuan</b>: aplikasi tidak berizin atau akun diretas.</li><li><b>Perilaku</b>: keputusan emosional, misalnya panik saat harga turun.</li></ul>')+
 _t(237,'<h3>Risiko dan potensi hasil</h3><p>Aset yang berpotensi memberi hasil lebih besar biasanya juga lebih tidak pasti. Itu tidak berarti risiko tinggi pasti menguntungkan. Risiko tinggi juga bisa berarti rugi besar.</p>')+
 _t(238,'<h3>Dua istilah penting</h3><p><b>Volatilitas</b> mengukur seberapa lebar harga bergerak naik-turun. <b>Drawdown</b> adalah penurunan dari puncak ke titik terendah sesudahnya. Jika nilai turun dari 100 ke 70, drawdown-nya 30%.</p>')+
 _t(239,'<h3>Cobalah sendiri</h3><p>Setiap jalur di bawah memakai asumsi hasil rata-rata yang sama, 7% per tahun. Bedanya hanya volatilitas. Tekan Acak ulang beberapa kali dan perhatikan sebaran nilai akhirnya.</p><div data-widget="paths"></div>'),
 points:[_t(240,'Potensi hasil lebih besar biasanya datang bersama ketidakpastian lebih besar.'),_t(241,'Volatilitas tinggi berarti rentang hasil lebih lebar, ke atas maupun ke bawah.'),_t(242,'Drawdown menunjukkan seberapa dalam penurunan yang pernah terjadi.')],
 quiz:[{q:_t(243,'Volatilitas tinggi berarti...'),o:[_t(244,'Harga pasti naik.'),_t(245,'Harga bergerak naik-turun lebih lebar.'),_t(246,'Risiko hilang.')],a:1,why:_t(247,'Volatilitas mengukur lebar pergerakan, bukan arahnya.')},
  {q:_t(248,'Drawdown adalah...'),o:[_t(249,'Penurunan dari titik tertinggi ke titik terendah sesudahnya.'),_t(250,'Kenaikan harga harian.'),_t(251,'Biaya transaksi.')],a:0,why:_t(252,'Drawdown membantu menilai seberapa berat penurunan yang pernah dialami sebuah aset.')}]},

{id:'grafik',title:_t(253,'Membaca grafik harga'),mins:6,blurb:_t(254,'Sumbu, garis dan candlestick, timeframe, serta apa yang tidak bisa dikatakan sebuah grafik.'),
 body:_t(255,'<h3>Grafik garis</h3><p>Garis menghubungkan harga penutupan dari waktu ke waktu. Sumbu mendatar adalah waktu, sumbu tegak adalah harga. Garis putus-putus di grafik Pasar menandai harga di awal periode, sehingga Anda bisa melihat posisi harga sekarang terhadap titik awal.</p>')+
 _t(256,'<h3>Candlestick</h3><p>Satu batang mewakili satu periode (misalnya satu hari). <b>Badan</b> menunjukkan jarak harga buka ke harga tutup. <b>Sumbu tipis</b> menunjukkan harga tertinggi dan terendah dalam periode itu. Warna berbeda antar platform; di sini hijau berarti tutup lebih tinggi dari buka. Klik sebuah batang untuk melihat rinciannya.</p><div data-widget="candles"></div>')+
 _t(257,'<h3>Rentang waktu</h3><p>Grafik 1 hari dan 1 tahun untuk aset yang sama bisa terlihat berlawanan: turun hari ini, naik setahun terakhir. Keduanya benar, hanya menangkap jangka waktu berbeda. Pilih rentang waktu sesuai tujuan Anda.</p>')+
 _t(258,'<h3>Batas sebuah grafik</h3><p>Grafik menunjukkan apa yang sudah terjadi. Garis tren, area support, dan resistance adalah cara orang merangkum masa lalu, bukan pagar yang pasti menahan harga.</p>'),
 points:[_t(259,'Badan candle: jarak buka-tutup. Sumbu: tertinggi-terendah.'),_t(260,'Rentang waktu berbeda bisa memberi kesan berbeda untuk aset yang sama.'),_t(261,'Grafik merangkum masa lalu dan tidak menjamin arah berikutnya.')],
 quiz:[{q:_t(262,'Badan sebuah candle menunjukkan...'),o:[_t(263,'Jarak harga buka dan harga tutup.'),_t(264,'Volume transaksi.'),_t(265,'Hanya harga tertinggi.')],a:0,why:_t(266,'Sumbu tipis di atas dan bawah badan yang menunjukkan harga tertinggi dan terendah.')},
  {q:_t(267,'Mengapa grafik 1 hari dan 1 tahun bisa tampak berlawanan?'),o:[_t(268,'Salah satunya data palsu.'),_t(269,'Rentang waktu berbeda menangkap jangka waktu berbeda.'),_t(270,'Grafik selalu berubah sendiri.')],a:1,why:_t(271,'Pilih rentang waktu yang sesuai dengan tujuan dan jangka waktu Anda.')}]},

{id:'analisis',title:_t(272,'Analisis fundamental dan teknikal'),mins:8,blurb:_t(273,'Dua cara pandang yang sering dipakai, beserta batasannya.'),
 body:_t(274,'<h3>Fundamental: bisnisnya sehat dan harganya wajar?</h3><p>Analisis fundamental mempelajari perusahaan lewat laporan keuangan dan prospek bisnisnya. Beberapa ukuran yang sering dipakai:</p><ul><li><b>Laba</b>: apakah perusahaan menghasilkan keuntungan, dan apakah cenderung naik.</li><li><b>P/E (price to earnings)</b>: harga saham dibagi laba per saham. Menunjukkan berapa kali laba yang dibayar pasar untuk satu saham.</li><li><b>ROE</b>: laba dibandingkan modal pemegang saham, ukuran efisiensi.</li><li><b>Utang</b>: beban utang yang terlalu besar bisa membahayakan perusahaan saat kondisi sulit.</li><li><b>Dividen</b>: bagian laba yang dibagikan, jika ada.</li></ul><p>Angka ini baru berguna jika dibandingkan dengan perusahaan sejenis dan dengan riwayatnya sendiri. P/E rendah bisa berarti murah, bisa juga berarti pasar melihat labanya akan turun.</p>')+
 _t(275,'<h3>Teknikal: apa yang dikatakan pola harga?</h3><p>Analisis teknikal mempelajari pergerakan harga dan volume. Dua alat dasar:</p><ul><li><b>Rata-rata bergerak (MA)</b>: rata-rata harga penutupan beberapa periode terakhir. Meratakan gerakan harian agar tren lebih terlihat.</li><li><b>RSI</b>: ukuran momentum dari 0 sampai 100. Angka di atas 70 sering disebut jenuh beli dan di bawah 30 jenuh jual. Itu kebiasaan membaca, bukan sinyal otomatis.</li></ul>')+
 _t(276,'<h3>Cobalah sendiri</h3><p>Grafik di bawah memakai data IHSG satu tahun yang sedang dimuat di Finvest. Nyalakan MA 20 dan MA 50, lalu lihat bagaimana garis rata-rata selalu tertinggal dari harga.</p><div data-widget="ma"></div>')+
 _t(277,'<h3>Batasnya</h3><p>Keduanya alat bantu memahami, bukan mesin pemberi jawaban. MA tertinggal karena dihitung dari masa lalu, dan sering memberi sinyal palsu saat harga bergerak menyamping.</p>'),
 points:[_t(278,'Fundamental menilai bisnis dan harga wajar; teknikal membaca pola harga.'),_t(279,'P/E rendah belum tentu murah. Cari tahu alasannya.'),_t(280,'Indikator teknikal bukan sinyal beli atau jual otomatis.')],
 quiz:[{q:_t(281,'P/E rendah selalu berarti saham murah dan layak dibeli?'),o:[_t(282,'Ya, selalu.'),_t(283,'Tidak, perlu dilihat alasan P/E rendah, misalnya laba yang menurun.'),_t(284,'Hanya berlaku untuk emas.')],a:1,why:_t(285,'Rasio harus dibandingkan dengan perusahaan sejenis dan riwayatnya.')},
  {q:_t(286,'Rata-rata bergerak (MA) dihitung dari...'),o:[_t(287,'Rata-rata harga beberapa periode terakhir.'),_t(288,'Prediksi harga besok.'),_t(289,'Laba perusahaan.')],a:0,why:_t(290,'Karena dihitung dari data lampau, MA selalu tertinggal dari harga.')}]},

{id:'diversifikasi',title:_t(291,'Diversifikasi dan manajemen risiko'),mins:7,blurb:_t(292,'Menyebar risiko, menentukan porsi, dan alasan diversifikasi tidak menghapus risiko.'),
 body:_t(293,'<h3>Jangan taruh semua telur di satu keranjang</h3><p>Diversifikasi berarti menyebar dana ke beberapa aset yang tidak bergerak persis sama. Jika satu turun, yang lain mungkin tidak ikut turun sedalam itu. Penyebaran bisa dilakukan antar jenis aset, antar sektor, dan antar waktu (membeli bertahap).</p>')+
 _t(294,'<h3>Korelasi menentukan manfaatnya</h3><p>Korelasi mengukur seberapa searah dua aset bergerak, dari 1 (selalu searah) sampai -1 (selalu berlawanan). Dua aset dengan korelasi tinggi memberi manfaat penyebaran yang kecil. Geser pengaturan di bawah untuk melihatnya.</p><div data-widget="divers"></div>')+
 _t(295,'<h3>Praktik pengelolaan risiko</h3><ul><li><b>Batasi porsi</b>: tentukan kerugian maksimum yang sanggup Anda terima untuk satu aset, sebelum membeli.</li><li><b>Beli bertahap</b>: menyebar waktu pembelian mengurangi risiko membeli seluruhnya di waktu yang kurang baik, meski tidak menjamin hasil lebih baik.</li><li><b>Tinjau berkala</b>: porsi bisa bergeser seiring harga. Tinjau apakah masih sesuai tujuan.</li><li><b>Hindari utang untuk berinvestasi</b>: kerugian tetap harus dibayar.</li></ul>')+
 _t(296,'<h3>Batasnya</h3><p>Diversifikasi mengurangi risiko spesifik, tetapi tidak menghapus risiko pasar. Saat krisis besar, banyak aset bisa turun bersamaan.</p>'),
 points:[_t(297,'Diversifikasi mengurangi dampak satu aset yang buruk, bukan menghapus risiko.'),_t(298,'Korelasi rendah memberi manfaat penyebaran lebih besar.'),_t(299,'Tentukan batas kerugian sebelum membeli, bukan sesudahnya.')],
 quiz:[{q:_t(300,'Tujuan diversifikasi adalah...'),o:[_t(301,'Menjamin tidak pernah rugi.'),_t(302,'Mengurangi dampak satu aset yang buruk terhadap keseluruhan.'),_t(303,'Memastikan untung lebih besar.')],a:1,why:_t(304,'Diversifikasi mengurangi risiko spesifik, tetapi risiko pasar tetap ada.')},
  {q:_t(305,'Dua aset yang bergerak sangat searah (korelasi tinggi) memberi manfaat diversifikasi...'),o:[_t(306,'Lebih besar.'),_t(307,'Lebih kecil.'),_t(308,'Sama saja.')],a:1,why:_t(309,'Jika keduanya turun bersamaan, penyebaran tidak banyak membantu.')}]},

{id:'perilaku',title:_t(310,'Psikologi dan kesalahan umum'),mins:6,blurb:_t(311,'Emosi sering lebih berbahaya dari harga. Kenali jebakan umum dan tanda penipuan.'),
 body:_t(312,'<h3>Jebakan perilaku</h3><dl class="defs"><div><dt>FOMO</dt><dd>Takut ketinggalan. Membeli karena harga sedang ramai naik, bukan karena paham asetnya.</dd></div><div><dt>Panik jual</dt><dd>Menjual saat harga turun tajam, lalu mengunci kerugian yang mungkin belum perlu.</dd></div><div><dt>Terlalu percaya diri</dt><dd>Menganggap beberapa kali untung berarti sudah paham. Pasar bisa berubah.</dd></div><div><dt>Utang atau leverage</dt><dd>Memperbesar posisi dengan pinjaman. Untung dan rugi sama-sama membesar, dan rugi tetap harus dibayar.</dd></div></dl>')+
 _t(313,'<h3>Tanda investasi yang patut dicurigai</h3><ul><li>Menjanjikan hasil tetap tinggi dan tanpa risiko.</li><li>Menekan Anda untuk segera memutuskan atau mengajak orang lain bergabung demi bonus.</li><li>Tidak jelas dari mana hasilnya berasal.</li><li>Pihak penawar atau platformnya tidak jelas izinnya. Periksa daftar entitas berizin di situs OJK.</li></ul>')+

{id:"inflasi",title:X("Inflation and compounding","Inflasi dan bunga majemuk"),mins:5,blurb:X("Why money loses purchasing power, how returns build on returns, and the difference between nominal and real returns.","Mengapa uang kehilangan daya beli, bagaimana hasil berbunga atas hasil, dan beda hasil nominal dengan hasil riil."),
 body:X("<h3>Inflation erodes purchasing power</h3><p>Inflation is the general rise in prices. At 4% a year, goods that cost Rp 10,000,000 today would cost about Rp 14.8 million in 10 years. Put the other way, Rp 10,000,000 held as cash would buy only about Rp 6.8 million worth of today's goods.</p>","<h3>Inflasi menggerus daya beli</h3><p>Inflasi adalah kenaikan harga secara umum. Pada 4% per tahun, barang yang kini seharga Rp 10.000.000 menjadi sekitar Rp 14,8 juta dalam 10 tahun. Sebaliknya, uang tunai Rp 10.000.000 hanya akan membeli barang senilai sekitar Rp 6,8 juta menurut harga hari ini.</p>")+X("<h3>Compounding</h3><p>Compounding means earning returns on earlier returns. Rp 10,000,000 growing 6% a year becomes about Rp 17.9 million after 10 years and about Rp 32.1 million after 20 years. Simple interest on the original amount alone would give Rp 16 million after 10 years. The longer the time, the larger the gap.</p>","<h3>Bunga majemuk</h3><p>Bunga majemuk berarti hasil ikut menghasilkan. Rp 10.000.000 yang tumbuh 6% per tahun menjadi sekitar Rp 17,9 juta setelah 10 tahun dan sekitar Rp 32,1 juta setelah 20 tahun. Bunga tunggal atas modal awal saja hanya menghasilkan Rp 16 juta setelah 10 tahun. Semakin lama waktunya, semakin lebar selisihnya.</p>")+X("<h3>Nominal and real returns</h3><p>The nominal return is the figure you see. The real return is what remains after inflation. A 6% return with 4% inflation is only about 1.9% in real terms. If inflation is higher than your return, your purchasing power shrinks even though the number grows.</p>","<h3>Hasil nominal dan hasil riil</h3><p>Hasil nominal adalah angka yang Anda lihat. Hasil riil adalah yang tersisa setelah inflasi. Hasil 6% dengan inflasi 4% hanya sekitar 1,9% secara riil. Jika inflasi lebih tinggi daripada hasil Anda, daya beli menyusut walaupun angkanya bertambah.</p>")+X("<h3>Try it yourself</h3><p>Change the return, inflation, and number of years. Compare the solid line (nominal) with the dashed line (after inflation).</p><div data-widget=\"compound\"></div>","<h3>Cobalah sendiri</h3><p>Ubah hasil, inflasi, dan jangka waktu. Bandingkan garis penuh (nominal) dengan garis putus-putus (setelah inflasi).</p><div data-widget=\"compound\"></div>")+X("<h3>It works both ways</h3><p>Losses and costs compound too. A 50% loss needs a 100% gain just to return to the starting value, which is why avoiding large losses matters.</p>","<h3>Berlaku ke dua arah</h3><p>Kerugian dan biaya juga berlipat. Kerugian 50% memerlukan kenaikan 100% hanya untuk kembali ke nilai awal. Karena itu, menghindari kerugian besar sangat penting.</p>"),
 points:[X("Time is the main ingredient of compounding.","Waktu adalah bahan utama bunga majemuk."),X("Compare returns with inflation, not just with zero.","Bandingkan hasil dengan inflasi, bukan hanya dengan nol."),X("Large losses are hard to recover from.","Kerugian besar sulit dipulihkan.")],
 quiz:[{q:X("If inflation is higher than your return, your purchasing power...","Jika inflasi lebih tinggi daripada hasil Anda, daya beli Anda..."),o:[X("increases.","meningkat."),X("stays the same.","tetap."),X("decreases, even though the number grows.","menurun, meskipun angkanya bertambah.")],a:2,why:X("The real return is negative, so the same money buys less.","Hasil riilnya negatif, sehingga uang yang sama membeli lebih sedikit.")},
  {q:X("After a 50% loss, what gain is needed to return to the starting value?","Setelah rugi 50%, berapa kenaikan yang diperlukan untuk kembali ke nilai awal?"),o:[X("50%","50%"),X("100%","100%"),X("150%","150%")],a:1,why:X("Falling from 100 to 50 and then needing to climb back to 100 is a 100% gain.","Turun dari 100 ke 50 lalu harus naik kembali ke 100 berarti kenaikan 100%.")}]},

{id:"biaya",title:X("Costs, fees, and taxes","Biaya, komisi, dan pajak"),mins:5,blurb:X("The costs that reduce returns, why small yearly fees add up, and where to find them.","Biaya yang mengurangi hasil, mengapa biaya tahunan yang kecil bisa menumpuk, dan di mana mencarinya."),
 body:X("<h3>Costs reduce what you keep</h3><ul><li><b>Transaction fee</b>: charged by the broker or platform when you buy or sell.</li><li><b>Management fee</b>: charged yearly on the value of a fund, usually as a percentage.</li><li><b>Spread</b>: the gap between the buying and selling price.</li><li><b>Tax</b>: may apply to dividends, interest, or gains. Rules differ by instrument and change over time.</li></ul>","<h3>Biaya mengurangi hasil bersih</h3><ul><li><b>Biaya transaksi</b>: dikenakan oleh perusahaan sekuritas atau platform saat membeli atau menjual.</li><li><b>Biaya pengelolaan</b>: dikenakan setiap tahun atas nilai dana, biasanya dalam persen.</li><li><b>Selisih harga (spread)</b>: jarak antara harga beli dan harga jual.</li><li><b>Pajak</b>: dapat berlaku atas dividen, bunga, atau keuntungan. Aturannya berbeda menurut instrumen dan dapat berubah.</li></ul>")+X("<h3>Small percentages add up</h3><p>Suppose Rp 100 million earns 7% a year before costs for 20 years. With a 0.5% yearly fee it grows to about Rp 352 million. With a 2% yearly fee it grows to about Rp 265 million. The gap of roughly Rp 87 million comes from the fee alone. This is an illustration, not a forecast.</p>","<h3>Persentase kecil bisa menumpuk</h3><p>Misalkan Rp 100 juta menghasilkan 7% per tahun sebelum biaya selama 20 tahun. Dengan biaya tahunan 0,5%, nilainya menjadi sekitar Rp 352 juta. Dengan biaya tahunan 2%, nilainya menjadi sekitar Rp 265 juta. Selisih sekitar Rp 87 juta itu berasal dari biaya saja. Ini ilustrasi, bukan perkiraan.</p>")+X("<h3>Where to look</h3><p>Check the product's official documents, such as a fund fact sheet and the platform's fee table, before buying. Look for fees charged at purchase, yearly fees, and fees at sale.</p>","<h3>Di mana mencarinya</h3><p>Periksa dokumen resmi produk, seperti lembar fakta kinerja reksa dana dan tabel biaya di platform, sebelum membeli. Perhatikan biaya saat pembelian, biaya tahunan, dan biaya saat penjualan.</p>")+X("<h3>Low cost is not the same as low risk</h3><p>A cheap product can still lose value. Costs are one factor to compare, alongside risk, goals, and time frame. Finvest does not give tax advice; check the current rules with the tax authority or a licensed professional.</p>","<h3>Biaya rendah bukan berarti risiko rendah</h3><p>Produk berbiaya murah tetap bisa merugi. Biaya adalah satu faktor pembanding, di samping risiko, tujuan, dan jangka waktu. Finvest tidak memberikan nasihat pajak; periksa aturan terbaru ke otoritas pajak atau profesional berlisensi.</p>"),
 points:[X("Costs are certain, returns are not.","Biaya itu pasti, hasil tidak."),X("A yearly fee compounds against you over time.","Biaya tahunan berlipat melawan Anda seiring waktu."),X("Read the official fee documents before buying.","Baca dokumen biaya resmi sebelum membeli.")],
 quiz:[{q:X("A fund charges 2% a year. This means...","Sebuah reksa dana mengenakan biaya 2% per tahun. Artinya..."),o:[X("it is charged only in years when you profit.","biaya hanya dikenakan pada tahun ketika Anda untung."),X("it is charged on the fund value every year, including losing years.","biaya dikenakan atas nilai dana setiap tahun, termasuk saat merugi."),X("it is a one-time charge at purchase.","biaya hanya sekali saat pembelian.")],a:1,why:X("Management fees are usually deducted from the fund value regardless of performance.","Biaya pengelolaan umumnya dipotong dari nilai dana tanpa memandang kinerja.")},
  {q:X("Where can you find the fees of an investment product?","Di mana Anda dapat menemukan biaya suatu produk investasi?"),o:[X("Only in advertisements.","Hanya di iklan."),X("In official documents, such as the fund fact sheet and the platform fee table.","Di dokumen resmi, seperti lembar fakta kinerja dan tabel biaya platform."),X("Fees do not exist for beginners.","Pemula tidak dikenai biaya.")],a:1,why:X("Official documents list the fees; advertisements often leave them out.","Dokumen resmi memuat biaya; iklan sering tidak mencantumkannya.")}]},

{id:"rencana",title:X("Building your plan","Menyusun rencana"),mins:6,blurb:X("From goal to routine: setting a target, investing regularly, and reviewing without reacting to every price move.","Dari tujuan menjadi kebiasaan: menetapkan target, berinvestasi berkala, dan meninjau tanpa bereaksi pada setiap pergerakan harga."),
 body:X("<h3>1. Start with the goal</h3><p>Write down what the money is for, how much you need, and by when. A house down payment in 3 years and retirement in 25 years call for different choices, because the time available to recover from a decline is different.</p>","<h3>1. Mulai dari tujuan</h3><p>Tuliskan untuk apa dana itu, berapa yang dibutuhkan, dan kapan. Uang muka rumah dalam 3 tahun dan pensiun dalam 25 tahun memerlukan pilihan yang berbeda, karena waktu untuk pulih dari penurunan juga berbeda.</p>")+X("<h3>2. Invest on a schedule</h3><p>Investing a fixed amount at regular intervals, for example every month, spreads your purchases across different prices. It reduces the risk of putting everything in at a bad moment. It does not guarantee a profit and does not prevent losses. Try the savings simulator to see the range of outcomes.</p>","<h3>2. Berinvestasi secara berkala</h3><p>Menanam jumlah tetap pada selang waktu teratur, misalnya setiap bulan, menyebar pembelian pada berbagai harga. Cara ini mengurangi risiko menanam semuanya pada saat yang kurang tepat. Cara ini tidak menjamin keuntungan dan tidak mencegah kerugian. Gunakan simulator tabungan untuk melihat rentang hasil yang mungkin.</p>")+X("<h3>3. Review, do not react</h3><p>Review your plan on a schedule, for example once or twice a year, and when your goals or income change. Reviewing on a schedule is different from reacting to every price swing.</p>","<h3>3. Tinjau, jangan bereaksi</h3><p>Tinjau rencana Anda secara terjadwal, misalnya sekali atau dua kali setahun, serta saat tujuan atau penghasilan berubah. Meninjau secara terjadwal berbeda dengan bereaksi pada setiap gejolak harga.</p>")+X("<h3>A simple checklist</h3><ul><li>Emergency fund in place.</li><li>Goal, amount, and deadline written down.</li><li>Maximum loss I can accept, decided in advance.</li><li>I understand where the returns come from and what the costs are.</li><li>The seller or platform is licensed.</li></ul>","<h3>Daftar periksa sederhana</h3><ul><li>Dana darurat sudah tersedia.</li><li>Tujuan, jumlah, dan tenggat sudah dituliskan.</li><li>Batas kerugian yang dapat saya terima sudah ditetapkan sebelumnya.</li><li>Saya memahami sumber hasil dan biayanya.</li><li>Penjual atau platform memiliki izin.</li></ul>"),
 points:[X("A written plan helps you avoid decisions made in a panic.","Rencana tertulis membantu menghindari keputusan yang diambil saat panik."),X("Regular investing spreads timing risk but does not remove risk.","Berinvestasi berkala menyebar risiko waktu pembelian, tetapi tidak menghilangkan risiko."),X("Review on a schedule, not on every price move.","Tinjau secara terjadwal, bukan pada setiap pergerakan harga.")],
 quiz:[{q:X("Investing a fixed amount on a regular schedule...","Menanam jumlah tetap secara berkala..."),o:[X("guarantees a profit.","menjamin keuntungan."),X("spreads out purchase timing but does not remove the risk of loss.","menyebar waktu pembelian, tetapi tidak menghilangkan risiko rugi."),X("removes the need for an emergency fund.","menghilangkan kebutuhan dana darurat.")],a:1,why:X("It manages timing risk only; the asset can still fall in value.","Cara ini hanya mengelola risiko waktu pembelian; nilai aset tetap bisa turun.")},
  {q:X("When is a good time to review your plan?","Kapan waktu yang baik untuk meninjau rencana Anda?"),o:[X("Only when prices crash.","Hanya saat harga anjlok."),X("On a schedule, and when your goals or situation change.","Secara terjadwal, dan saat tujuan atau keadaan Anda berubah."),X("Never, once it is set.","Tidak pernah, setelah rencana dibuat.")],a:1,why:X("A regular review keeps the plan matched to your goals without reacting to noise.","Tinjauan berkala menjaga rencana tetap sesuai tujuan tanpa terpengaruh gejolak sesaat.")}]}
];
