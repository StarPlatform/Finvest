<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="description" content="Finvest: belajar investasi dari nol dan pantau pasar dengan data tertunda. Bukan saran beli atau jual.">
<title>Finvest</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap">
<style>
html{-webkit-text-size-adjust:100%;color-scheme:light}
[hidden]{display:none!important}
img{max-width:100%}
/* Layout concept: chart-first workspace. Beranda opens with a live simulated chart beside two entry paths
   (pemula / berpengalaman). Pasar is a customizable multi-chart grid with a watchlist rail.
   Every price carries its data-status badge (Aktual / Tertunda / Simulasi). */
:root{
  --font-display:"Inter",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --font-body:"Inter",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --font-data:"Inter",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --bg:#F7F7F8; --surface:#FFFFFF; --surface-2:#EFEFF2; --line:#E1E2E7;
  --ink:#111318; --ink-2:#4A4E58; --ink-3:#6B7080;
  --accent:#2F4BCB; --accent-ink:#FFFFFF; --accent-soft:#E2E8FC;
  --up:#0B7A55; --up-soft:#DCF2E9; --down:#C23B2B; --down-soft:#FBE3DF;
  --warn:#8A5200; --warn-soft:#F5EEDC;
  --s1:#111318; --s2:#4A4E58; --s3:#767B88; --s4:#8E93A0;
  --shadow:0 1px 2px rgba(17,19,24,.05),0 8px 24px rgba(17,19,24,.05);
  --grid:rgba(17,19,24,.05); --glow:rgba(17,19,24,.05);
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#0B0C0F; --surface:#131419; --surface-2:#1B1D24; --line:#272A33;
    --ink:#EDEEF1; --ink-2:#A7ABB6; --ink-3:#8A8F9C;
    --accent:#8FA3FF; --accent-ink:#0A1120; --accent-soft:#1B2852;
    --up:#3FD6A2; --up-soft:#10332A; --down:#FF7F6D; --down-soft:#3A1C19;
    --warn:#F2B654; --warn-soft:#2A2312;
    --s1:#EDEEF1; --s2:#B6BAC4; --s3:#8E93A0; --s4:#747987;
    --shadow:0 0 0 1px rgba(255,255,255,.03);
  --grid:rgba(255,255,255,.05); --glow:rgba(255,255,255,.05);
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0B0C0F; --surface:#131419; --surface-2:#1B1D24; --line:#272A33;
  --ink:#EDEEF1; --ink-2:#A7ABB6; --ink-3:#8A8F9C;
  --accent:#8FA3FF; --accent-ink:#0A1120; --accent-soft:#1B2852;
  --up:#3FD6A2; --up-soft:#10332A; --down:#FF7F6D; --down-soft:#3A1C19;
  --warn:#F2B654; --warn-soft:#2A2312;
  --s1:#EDEEF1; --s2:#B6BAC4; --s3:#8E93A0; --s4:#747987;
  --shadow:0 0 0 1px rgba(255,255,255,.03);
  --grid:rgba(255,255,255,.05); --glow:rgba(255,255,255,.05);
  color-scheme:dark;
}
*,*::before,*::after{box-sizing:border-box}
html{scroll-behavior:auto}
body{
  margin:0;background:var(--bg);color:var(--ink);
  font:400 15px/1.55 var(--font-body);
  padding-left:max(16px,env(safe-area-inset-left,0px));
  padding-right:max(16px,env(safe-area-inset-right,0px));
  padding-block:0;
}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:30;background:var(--bg)}
body.noscroll{overflow:hidden}
h1,h2,h3{font-family:var(--font-display);font-weight:700;letter-spacing:-.015em;text-wrap:balance;margin:0}
p{margin:0}
a{color:var(--accent)}
button,select,input{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:6px}
.num{font-family:var(--font-data);font-variant-numeric:tabular-nums}
.wrap{max-width:1280px;margin:0 auto}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}

/* header */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:31;background:color-mix(in srgb,var(--bg) 86%,transparent);-webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px);border-bottom:1px solid var(--line)}
.top-row{display:flex;align-items:center;gap:20px;height:58px}
.brand{display:flex;align-items:center;gap:10px;text-decoration:none;color:var(--ink);font:700 20px/1 var(--font-display);letter-spacing:-.02em}
.brand .mark{width:30px;height:30px;border-radius:9px;background:var(--accent);color:var(--accent-ink);display:grid;place-items:center}
.brand .mark svg{width:18px;height:18px}
.nav{display:flex;gap:2px;margin-left:12px}
.nav a{padding:8px 14px;border-radius:10px;text-decoration:none;color:var(--ink-2);font-weight:500}
.nav a:hover{background:var(--surface-2);color:var(--ink)}
.nav a[aria-current="page"]{background:var(--accent-soft);color:var(--accent)}
.top-right{margin-left:auto;display:flex;gap:8px;align-items:center}
.langbtn{height:38px;min-width:38px;padding:0 10px;border-radius:10px;border:1px solid var(--line);background:var(--surface);cursor:pointer;color:var(--ink-2);font:600 12px var(--font-data);letter-spacing:.06em}
.langbtn:hover{color:var(--ink)}
.iconbtn{width:38px;height:38px;border-radius:10px;border:1px solid var(--line);background:var(--surface);display:grid;place-items:center;cursor:pointer;color:var(--ink-2)}
.iconbtn:hover{color:var(--ink);background:var(--surface-2)}
.iconbtn svg{width:18px;height:18px}

/* badges, pills */
.badge{display:inline-block;font:500 10.5px/1 var(--font-data);letter-spacing:.06em;padding:4px 6px;border-radius:6px;white-space:nowrap}
.badge.sim{background:var(--warn-soft);color:var(--warn)}
.badge.live{background:var(--up-soft);color:var(--up)}
.badge.delayed{background:var(--accent-soft);color:var(--accent)}
.pill{display:inline-block;font:500 12.5px/1 var(--font-data);padding:5px 8px;border-radius:999px;background:var(--surface-2);color:var(--ink-2);white-space:nowrap;font-variant-numeric:tabular-nums}
.pill.up{background:var(--up-soft);color:var(--up)}
.pill.down{background:var(--down-soft);color:var(--down)}
.pill.big{font-size:14px;padding:7px 11px}

/* buttons, segmented */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:40px;padding:9px 16px;border-radius:10px;border:1px solid var(--line);background:var(--surface);color:var(--ink);font-weight:500;text-decoration:none;cursor:pointer}
.btn:hover{background:var(--surface-2)}
.btn-primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn-primary:hover{background:var(--accent);filter:brightness(1.08)}
.btn-sm{min-height:34px;padding:6px 12px;font-size:13.5px}
.btn-ghost{border-color:transparent;background:transparent;color:var(--ink-2)}
.seg{display:inline-flex;background:var(--surface-2);border-radius:10px;padding:3px;gap:2px;max-width:100%;overflow-x:auto}
.seg button{border:0;background:transparent;color:var(--ink-2);padding:6px 11px;border-radius:8px;font:500 13px var(--font-body);cursor:pointer;min-height:32px;white-space:nowrap}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--ink);box-shadow:var(--shadow)}
.field{display:flex;flex-direction:column;gap:6px;min-width:0}
.field label,.lab{font-size:12px;font-weight:600;letter-spacing:.04em;text-transform:uppercase;color:var(--ink-3)}
.input,select.input{width:100%;min-height:40px;padding:8px 12px;border-radius:10px;border:1px solid var(--line);background:var(--surface);color:var(--ink)}
input[type=range]{width:100%;accent-color:var(--accent)}

main{padding-block:28px 96px}
.page-head{display:flex;flex-wrap:wrap;gap:12px 24px;align-items:end;justify-content:space-between;margin-bottom:20px}
.page-head h1{font-size:clamp(1.6rem,3vw,2.2rem)}
.page-head p{color:var(--ink-2);max-width:60ch;margin-top:4px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:16px;min-width:0}
.eyebrow{font:500 12px var(--font-data);letter-spacing:.08em;text-transform:uppercase;color:var(--accent)}

/* chart hosts */
.chart{position:relative;width:100%;height:240px;min-width:0}
.chart svg{display:block;overflow:visible}
.chart .gl{stroke:var(--line);stroke-width:1}
.chart .bl{stroke:var(--ink-3);stroke-width:1;stroke-dasharray:2 4}
.chart .al{fill:var(--ink-3);font:400 10.5px var(--font-data)}
.chart .el{font:500 11px var(--font-data)}
.chart .ch{stroke:var(--ink-3);stroke-width:1}
.chart .hd{stroke:var(--surface);stroke-width:2}
.chart .ov{touch-action:pan-y;cursor:crosshair}
.chart .tip{position:absolute;pointer-events:none;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:8px 10px;box-shadow:var(--shadow);font-size:12px;display:flex;flex-direction:column;gap:2px;white-space:nowrap;z-index:2}
.chart .tip b{font:500 13px var(--font-data)}
.chart .tip span{color:var(--ink-3)}
.chart .tip em{font:500 9.5px var(--font-data);letter-spacing:.08em;color:var(--warn);font-style:normal}
.spark{display:block;width:88px;height:34px}

/* hero */
.hero{display:grid;gap:32px;grid-template-columns:minmax(0,1fr);padding-block:16px 8px}
@media(min-width:960px){.hero{grid-template-columns:minmax(0,5fr) minmax(0,6fr);align-items:center;gap:48px;padding-block:28px 16px}}
.hero h1{font-size:clamp(2.1rem,5vw,3.4rem);font-weight:700;line-height:1.08;margin:12px 0 16px;letter-spacing:-.03em}
.lead{font-size:17px;color:var(--ink-2);max-width:52ch}
.cta{display:flex;gap:10px;flex-wrap:wrap;margin-top:24px}
.hero-chart{padding:16px 16px 10px;box-shadow:var(--shadow)}
.hero-chart header{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:6px;flex-wrap:wrap}
.hero-chart .nm{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap}
.hero-chart .nm b{font:600 16px var(--font-body)}
.hero-chart .nm .num{font-size:clamp(20px,5vw,28px);font-weight:500}
.hero-chart figcaption{color:var(--ink-3);font-size:12.5px;margin-top:6px}
.section{margin-top:44px}
.section>h2{font-size:1.4rem;margin-bottom:14px}
.paths{display:grid;gap:16px;grid-template-columns:minmax(0,1fr)}
@media(min-width:760px){.paths{grid-template-columns:repeat(2,minmax(0,1fr))}}
.path{padding:22px;display:flex;flex-direction:column;gap:14px}
.path h3{font-size:1.25rem}
.path ol{margin:0;padding:0;list-style:none;display:flex;flex-direction:column;gap:10px;counter-reset:s}
.path li{display:flex;gap:12px;color:var(--ink-2);counter-increment:s}
.path li::before{content:counter(s);flex:none;width:24px;height:24px;border-radius:50%;background:var(--accent-soft);color:var(--accent);font:500 12px/24px var(--font-data);text-align:center}
.path .btn{align-self:flex-start;margin-top:auto}
.principles{display:grid;gap:12px;grid-template-columns:repeat(auto-fit,minmax(220px,1fr))}
.principles div{padding:16px 18px}
.principles b{display:block;font:600 15px var(--font-body);margin-bottom:4px}
.principles span{color:var(--ink-2);font-size:14px}
.legend{display:grid;gap:12px;grid-template-columns:repeat(auto-fit,minmax(240px,1fr))}
.legend div{padding:16px 18px;display:flex;flex-direction:column;gap:8px;align-items:flex-start}
.legend span.t{color:var(--ink-2);font-size:14px}
.strip{display:grid;gap:12px;grid-template-columns:repeat(auto-fit,minmax(230px,1fr))}
.tile{padding:14px 16px;display:grid;grid-template-columns:1fr auto;gap:2px 12px;align-items:center;text-align:left;cursor:pointer;width:100%}
.tile:hover{border-color:var(--ink-3)}
.tile b{font:600 15px var(--font-body)}
.tile .sub{color:var(--ink-3);font-size:12.5px}
.tile .num{font-size:17px}
.tile .spark{grid-row:1/3;grid-column:2}
.tile .r{display:flex;gap:8px;align-items:center;margin-top:6px;grid-column:1}

/* market */
.mbar{display:flex;flex-wrap:wrap;gap:10px 14px;align-items:center;margin-bottom:14px}
.mbar .grow{flex:1}
.stamp{font-size:12.5px;color:var(--ink-3);display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.tabs{display:flex;gap:4px;border-bottom:1px solid var(--line);margin-bottom:16px;overflow-x:auto}
.tabs a{padding:10px 14px;text-decoration:none;color:var(--ink-2);font-weight:500;border-bottom:2px solid transparent;white-space:nowrap;margin-bottom:-1px}
.tabs a[aria-current="page"]{color:var(--accent);border-color:var(--accent)}
.tabs .cnt{display:inline-block;min-width:18px;padding:1px 5px;margin-left:6px;border-radius:9px;background:var(--surface-2);font:500 11px/16px var(--font-data);text-align:center}
.mkt{display:grid;gap:20px;grid-template-columns:minmax(0,1fr)}
@media(min-width:1100px){.mkt{grid-template-columns:minmax(0,1fr) 320px;align-items:start}}
.panels{display:grid;gap:16px;grid-template-columns:minmax(0,1fr)}
@media(min-width:900px){.panels[data-layout="2"],.panels[data-layout="4"]{grid-template-columns:repeat(2,minmax(0,1fr))}}
.panel{padding:14px 14px 8px}
.panel-h{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-bottom:6px}
.panel-h select{max-width:170px;min-height:34px;padding:4px 8px;font-weight:600}
.panel-h .px{font-size:16px}
.panel-h .sp{flex:1}
.panels[data-layout="1"] .chart{height:380px}
.aside{padding:14px;position:sticky;top:140px}
@media(max-width:1099px){.aside{position:static}}
.aside h2{font-size:1.05rem;margin-bottom:2px}
.aside .hint{color:var(--ink-3);font-size:12.5px;margin-bottom:10px}
.wl{list-style:none;margin:8px 0 0;padding:0;display:flex;flex-direction:column}
.wl li{display:flex;align-items:center;gap:4px;border-top:1px solid var(--line)}
.wl .open{flex:1;min-width:0;display:grid;grid-template-columns:1fr auto auto;gap:2px 10px;align-items:center;padding:10px 4px;background:transparent;border:0;text-align:left;cursor:pointer;border-radius:8px}
.wl .open:hover{background:var(--surface-2)}
.wl .nm{font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.wl .sub{grid-column:1;color:var(--ink-3);font-size:12px}
.wl .num{font-size:13px;text-align:right}
.wl .spark{grid-row:1/3;grid-column:2;width:60px}
.wl .open .pill{grid-column:3;grid-row:1/3}
.wl .star{width:34px;height:34px;border:0;background:transparent;color:var(--accent);cursor:pointer;border-radius:8px;font-size:17px}
.wl .star:hover{background:var(--surface-2)}
.wl-add{margin-top:10px;display:flex;gap:8px}
.cmpchips{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:14px}
.chip{display:inline-flex;align-items:center;gap:8px;padding:6px 12px;border-radius:999px;border:1px solid var(--line);background:var(--surface);cursor:pointer;font-size:13.5px;font-weight:500;min-height:34px}
.chip[aria-pressed="true"]{background:var(--accent-soft);border-color:var(--accent);color:var(--accent)}
.chip i{width:10px;height:10px;border-radius:50%;display:inline-block}
.tblwrap{overflow-x:auto;margin-top:16px}
table{border-collapse:collapse;width:100%;font-size:14px}
th,td{padding:10px 12px;text-align:left;border-bottom:1px solid var(--line);vertical-align:top}
th{font-size:12px;letter-spacing:.04em;text-transform:uppercase;color:var(--ink-3);font-weight:600;white-space:nowrap}
td.r,th.r{text-align:right}
.alertform{display:grid;gap:12px;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));align-items:end;padding:16px}
.alist{list-style:none;margin:16px 0 0;padding:0;display:flex;flex-direction:column;gap:8px}
.alist li{display:flex;gap:12px;align-items:center;padding:12px 14px;flex-wrap:wrap}
.alist .grow{flex:1;min-width:180px}
.empty{padding:28px;text-align:center;color:var(--ink-2)}

.stats{display:grid;gap:1px;grid-template-columns:repeat(3,minmax(0,1fr));background:var(--line);border:1px solid var(--line);border-radius:12px;overflow:hidden}
.stats div{background:var(--surface);padding:10px 12px;display:flex;flex-direction:column;gap:2px;min-width:0}
.stats span{font-size:11.5px;color:var(--ink-3)}
.stats b{font:500 13.5px var(--font-data);overflow:hidden;text-overflow:ellipsis}
@media(max-width:420px){.stats{grid-template-columns:repeat(2,minmax(0,1fr))}}
.risk{display:flex;align-items:center;gap:10px;font-size:13.5px}
.pips{display:flex;gap:3px}
.pips i{width:16px;height:8px;border-radius:2px;background:var(--line)}
.pips i.on{background:var(--ink-2)}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.check{display:flex;gap:8px;align-items:center;font-size:13.5px;color:var(--ink-2)}
.fine{font-size:12.5px;color:var(--ink-3)}

/* toast */
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(24px + env(safe-area-inset-bottom,0px));z-index:70;display:flex;flex-direction:column;gap:8px;align-items:center;pointer-events:none;width:max-content;max-width:calc(100% - 32px)}
.toast div{background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:12px;font-size:14px;box-shadow:var(--shadow)}
.toast div.alert{background:var(--accent);color:var(--accent-ink)}

/* learn */
.learn{display:grid;gap:24px;grid-template-columns:minmax(0,1fr)}
@media(min-width:900px){.learn{grid-template-columns:270px minmax(0,1fr);align-items:start}.lnav-wrap{position:sticky;top:140px}}
.lnav-wrap h2{font-size:1rem;margin-bottom:8px}
.prog{height:6px;border-radius:3px;background:var(--surface-2);overflow:hidden;margin:6px 0 12px}
.prog i{display:block;height:100%;background:var(--accent)}
.lnav{display:flex;flex-direction:column;gap:2px}
.lnav a{display:grid;grid-template-columns:26px 1fr auto;gap:8px;align-items:center;padding:9px 10px;border-radius:10px;text-decoration:none;color:var(--ink-2);font-weight:500;font-size:14px}
.lnav a:hover{background:var(--surface-2)}
.lnav a[aria-current="page"]{background:var(--accent-soft);color:var(--accent)}
.lnav .n{width:24px;height:24px;border-radius:50%;border:1px solid var(--line);display:grid;place-items:center;font:500 11.5px var(--font-data)}
.lnav a.done .n{background:var(--up);border-color:var(--up);color:var(--surface)}
.lnav .m{font:400 11.5px var(--font-data);color:var(--ink-3)}
@media(max-width:899px){.lnav{flex-direction:row;overflow-x:auto;padding-bottom:4px}.lnav a{white-space:nowrap;grid-template-columns:24px auto;border:1px solid var(--line);background:var(--surface)}.lnav .m{display:none}}
.lesson{padding:clamp(18px,3vw,34px)}
.lesson h1{font-size:clamp(1.7rem,3.2vw,2.3rem);margin:6px 0 6px}
.lesson .blurb{color:var(--ink-2);font-size:16.5px;margin-bottom:8px}
.prose{max-width:68ch}
.prose h3{font-size:1.2rem;margin:26px 0 8px}
.prose p,.prose li{color:var(--ink-2);font-size:16px;line-height:1.65}
.prose p+p{margin-top:10px}
.prose ul{margin:8px 0;padding-left:20px;display:flex;flex-direction:column;gap:6px}
.prose b{color:var(--ink)}
.prose em{font-style:normal;color:var(--ink);font-weight:600}
.defs{display:grid;gap:10px;margin:10px 0}
.defs>div{border:1px solid var(--line);border-radius:12px;padding:12px 14px;background:var(--bg)}
.defs dt{font:600 15px var(--font-body);color:var(--ink)}
.defs dd{margin:2px 0 0;color:var(--ink-2);font-size:15px}
.lesson .tblwrap{max-width:100%}
.lesson table td:first-child{font-weight:600;color:var(--ink);white-space:nowrap}
.lesson table td{font-size:14px;color:var(--ink-2)}
.widget{margin:18px 0;padding:16px;border:1px solid var(--line);border-radius:14px;background:var(--bg);max-width:760px}
.widget h4{margin:0 0 4px;font:600 15px var(--font-body)}
.widget .ctl{display:flex;gap:12px;flex-wrap:wrap;align-items:end;margin:10px 0}
.widget .ctl .field{flex:1;min-width:150px}
.widget .out{font-size:14px;color:var(--ink-2);margin-top:8px}
.widget .chart{height:230px}
.points{margin-top:26px;padding:16px 18px;border-radius:12px;background:var(--accent-soft);max-width:68ch}
.points h3{font-size:1rem;margin-bottom:6px;color:var(--accent)}
.points ul{margin:0;padding-left:18px;color:var(--ink);display:flex;flex-direction:column;gap:4px}
.quiz{margin-top:30px;max-width:68ch}

var EN={"13": "Jakarta Composite Index", "14": "Stock index", "15": "An index that measures the movement of share prices on the Indonesia Stock Exchange as a whole. You cannot buy an index directly, but it is often used as a benchmark for the stock market.", "16": "Moves up and down with economic conditions and market sentiment. An index can fall for a long time.", "18": "Stock", "19": "A share represents a small ownership stake in a company. Shareholders can earn from price increases and dividends, if the company pays them.", "20": "Prices can fall because of company performance, industry conditions, or the market. Losses can be large.", "22": "Stock", "23": "A share represents a small ownership stake in a company. A share with a low price is not necessarily cheaper than one with a high price; what matters is the value of the company.", "24": "Company-specific and banking-sector risk, plus general market risk.", "26": "Stock", "27": "Shares of a company in the telecommunications sector. Even a stable sector can see its prices fall.", "28": "Industry competition, heavy investment needs, and general market risk.", "30": "Stock", "31": "Shares of a company with many lines of business. A diversified business does not automatically make its share price more stable.", "32": "Affected by the economic cycle and commodity prices, plus market risk.", "33": "Gold", "34": "World gold price in Rp per gram (estimate)", "35": "Precious metal", "36": "Gold is often used as a store of value over the long term. Gold pays no interest or dividends, so its return comes only from price changes.", "37": "Prices can fall for quite a long time. There is a gap between selling and buying prices, and storage costs if physical.", "39": "Crypto asset", "40": "Crypto", "41": "A digital asset based on blockchain technology that trades almost around the clock. It generally has no cash flow, so its value depends heavily on demand.", "42": "Very large price swings, security and platform risk, and changing regulations.", "44": "Crypto asset", "45": "Crypto", "46": "A crypto asset that is also a platform for blockchain applications. Its swings are generally wider than those of traditional assets.", "47": "Very large price swings, technology and security risk, and regulatory changes.", "49": "US dollar to Indonesian rupiah exchange rate", "50": "Foreign exchange", "51": "How many rupiah it takes to buy one US dollar. The rate matters to anyone with needs or assets in dollars.", "52": "The rate is affected by interest rates, trade, and global sentiment. It can move sharply during turmoil.", "53": "Index of 500 large US stocks", "54": "Stock index", "55": "An index that measures 500 large companies in the United States. Many investment products track this index.", "56": "US stock market risk, plus currency risk if you invest from rupiah.", "57": "Very low", "58": "Low", "59": "Medium", "60": "High", "61": "Very high", "62": "1 week", "63": "1 month", "64": "3 months", "65": "1 year", "66": "SIMULATED", "67": "Simulated", "68": "Live", "69": "DELAYED", "70": "Delayed", "71": "Internal random generator. Not connected to an exchange or data provider.", "73": "Prices for ", "74": " here come from a random generator and do not match actual prices.", "75": "Delayed data from ", "76": "data provider", "77": ", latest data point ", "78": ". May differ from the price on the platform where you trade.", "79": " Calculated from the world gold price times the USD/IDR rate, per gram. Not an Antam or gold-shop price.", "81": "\" title=\"Data status: ", "82": "DELAYED", "83": "SIMULATED", "84": "MIXED", "85": "<footer class=\"site\"><b>Finvest</b><span>General education for learning, not advice to buy or sell. Investing involves risk: value can go up and down.</span><span>", "88": "DELAYED", "89": "SIMULATED", "90": "Data status: ", "91": ". Tap for details.", "92": "<b>Delayed data, not real-time</b><p>Prices are fetched on a schedule from ", "93": "data provider", "94": ". Last updated ", "95": " assets are still simulated.", "96": "</p><p>Not a basis for buy or sell decisions.</p><a href=\"#beranda\" data-act=\"goto-status\">View source details</a>", "97": "<b>Simulated data</b><p>All prices come from a random generator, not market prices. Market data has not loaded yet.</p><p>Not a basis for buy or sell decisions.</p><div class=\"row\"><button class=\"btn btn-sm\" type=\"button\" data-act=\"pause\">", "98": "Resume simulation", "99": "Pause simulation", "100": "</button><a href=\"#beranda\" data-act=\"goto-status\">View details</a></div>", "105": "Chart of ", "106": " over 3 months from delayed data, latest point ", "107": ". Source details are in the Data status section.", "108": "Example chart of ", "109": " over 3 months. Figures and movements come from a random generator and do not reflect actual prices.", "110": "Delayed data, last updated ", "111": "Simulated data, not market prices.", "112": "Market data has not loaded, so this page uses <b>simulated</b> data. Source: ", "113": "Data is fetched on a schedule from ", "114": "data provider", "115": " and stored in <span class=\"num\">data/market.json</span>. Last updated ", "116": ". Gold is calculated from the world gold price times the USD/IDR rate, not the Antam price. This source is unofficial and may change or stop at any time.", "125": "Chart", "166": "Price chart ", "169": "Mini chart ", "174": "\" role=\"img\" aria-label=\"Example candlestick chart, 24 candles\">", "193": "Start from zero", "194": "What investing is, how it differs from saving, and what to have ready before you start.", "195": "<h3>What is investing?</h3><p>Investing means putting money into an asset in the hope that its value grows over time. The key word is <em>hope</em>. No investment is guaranteed to profit, and its value can fall below the amount you put in.</p>", "196": "<h3>Saving, investing, and speculating</h3><dl class=\"defs\"><div><dt>Saving</dt><dd>Money set aside for near-term needs. Its value is stable and easy to access, but it grows little.</dd></div><div><dt>Investing</dt><dd>Money put to work for medium- or long-term goals. Its value goes up and down, with the hope of growing over time.</dd></div><div><dt>Speculating</dt><dd>Chasing price differences in a short time. The chances of gain and loss are both large, and the outcome is hard to predict.</dd></div></dl>", "197": "<h3>Why do people invest?</h3><p>Prices of goods tend to rise year after year (inflation). If inflation is 4% a year, Rp 100 million held only as cash has the purchasing power of about Rp 96 million a year later. Investing is one way to protect or grow purchasing power, in exchange for uncertainty.</p>", "198": "<h3>Before you start</h3><ul><li>Prepare an emergency fund somewhere easy to cash out. 3 to 6 months of expenses is commonly recommended.</li><li>Decide your goal and its time frame. Money needed in 6 months is different from money needed in 10 years.</li><li>Use money you will not need in the near term.</li></ul>", "199": "Investing involves uncertainty: value can go up and down.", "200": "The emergency fund and near-term needs come first.", "201": "Goals and time frame determine the choice of instrument.", "202": "Which statement is most accurate?", "203": "Investing always profits if you hold long enough.", "204": "Investing involves uncertainty: its value can go up or down.", "205": "Investing is safe as long as you pick a popular asset.", "206": "No asset is completely risk-free, and popularity is not a guarantee.", "207": "Which money is most appropriate for risky investing?", "208": "Money for next month's installment.", "209": "Emergency fund.", "210": "Money you do not need soon, after the emergency fund is in place.", "211": "If prices are falling, you should not be forced to sell because you need the money.", "212": "Get to know the instruments", "213": "Stocks, bonds, mutual funds, gold, and crypto: what they are, where returns come from, and what the risks are.", "214": "<p>Each instrument has a different way of working, source of returns, and risk. This table is a general summary, not a ranking of which is best.</p><div class=\"tblwrap\"><table><thead><tr><th>Instrument</th><th>What it is</th><th>Source of returns</th><th>Main risk</th></tr></thead><tbody>", "215": "<tr><td>Stocks</td><td>Ownership of a small part of a company.</td><td>Price increases, dividends if paid.</td><td>Prices fall, company performance worsens. Losses can be large.</td></tr>", "216": "<tr><td>Bonds / government securities</td><td>Debt: you lend money to the issuer.</td><td>Regular coupons (interest) and principal back at maturity.</td><td>Issuer defaults. Prices fall if sold before maturity when interest rates rise.</td></tr>", "217": "<tr><td>Mutual funds</td><td>A pooled fund run by an investment manager.</td><td>Depends on holdings: money market, bonds, stocks, or a mix.</td><td>Unit value falls. Risk follows the portfolio's holdings.</td></tr>", "218": "<tr><td>Gold</td><td>Precious metal, often used as a store of value.</td><td>Changes in the gold price.</td><td>Price fluctuates, there is a buy-sell spread, and no interest or dividends.</td></tr>", "219": "<tr><td>Crypto</td><td>Digital assets based on blockchain.</td><td>Generally price changes.</td><td>Very large swings, platform and security risk, rules can change.</td></tr></tbody></table></div>", "220": "<h3>How to choose as a beginner</h3><p>Start by understanding one or two instruments until you can explain where their returns come from and what could make them fall. If you cannot explain it, hold off.</p><h3>Past performance</h3><p>A chart that rose in the past does not guarantee the same in the future. Use it as study material, not as a promise.</p>", "221": "Understand the source of returns before buying anything.", "222": "Bonds and stocks differ fundamentally: one is a loan, the other is ownership.", "223": "Past performance does not guarantee future results.", "224": "A bond or government security is basically...", "225": "Ownership of part of a company.", "226": "Debt: you lend money to the issuer.", "227": "A digital asset.", "228": "A bondholder is a lender and usually receives regular coupons.", "229": "Gold generally gives returns from...", "230": "Regular dividends.", "231": "Monthly interest.", "232": "The change in the gold price itself.", "233": "Gold produces no cash flow, so its return depends on the price.", "234": "Risk and return", "235": "Types of risk, how risk relates to potential return, and two key terms: volatility and drawdown.", "236": "<h3>Risk is not only falling prices</h3><ul><li><b>Market risk</b>: the whole market falls.</li><li><b>Specific risk</b>: a problem at one company or asset.</li><li><b>Inflation</b>: returns do not keep up with rising prices.</li><li><b>Liquidity</b>: hard to sell quickly at a fair price.</li><li><b>Platform and fraud</b>: unlicensed apps or hacked accounts.</li><li><b>Behavior</b>: emotional decisions, such as panicking when prices fall.</li></ul>", "237": "<h3>Risk and potential return</h3><p>Assets with the potential for larger returns are usually also more uncertain. That does not mean high risk will surely pay off. High risk can also mean large losses.</p>", "238": "<h3>Two key terms</h3><p><b>Volatility</b> measures how widely the price moves up and down. <b>Drawdown</b> is the drop from a peak to the lowest point after it. If a value falls from 100 to 70, the drawdown is 30%.</p>", "239": "<h3>Try it yourself</h3><p>Every path below uses the same average return assumption, 7% a year. Only the volatility differs. Press Reshuffle a few times and watch the spread of final values.</p><div data-widget=\"paths\"></div>", "240": "Larger potential returns usually come with greater uncertainty.", "241": "High volatility means a wider range of outcomes, both up and down.", "242": "Drawdown shows how deep a decline has been.", "243": "High volatility means...", "244": "The price will definitely rise.", "245": "The price swings up and down more widely.", "246": "The risk disappears.", "247": "Volatility measures the width of movement, not its direction.", "248": "Drawdown is...", "249": "The drop from the highest point to the lowest point after it.", "250": "The daily price increase.", "251": "Transaction fees.", "252": "Drawdown helps judge how severe a decline an asset has experienced.", "253": "Reading price charts", "254": "Axes, lines and candlesticks, timeframes, and what a chart cannot tell you.", "255": "<h3>Line charts</h3><p>The line connects closing prices over time. The horizontal axis is time, the vertical axis is price. The dotted line on the Markets chart marks the price at the start of the period, so you can see where the price is now relative to the starting point.</p>", "256": "<h3>Candlesticks</h3><p>One candle represents one period (for example, one day). The <b>body</b> shows the distance from the opening price to the closing price. The <b>thin wicks</b> show the highest and lowest prices in that period. Colors differ between platforms; here green means the close was higher than the open. Click a candle to see its details.</p><div data-widget=\"candles\"></div>", "257": "<h3>Timeframes</h3><p>A 1-day chart and a 1-year chart of the same asset can look opposite: down today, up over the past year. Both are right, they just capture different time spans. Choose a timeframe that fits your goal.</p>", "258": "<h3>The limits of a chart</h3><p>A chart shows what has already happened. Trend lines, support areas, and resistance are ways people summarize the past, not fences that will surely hold the price.</p>", "259": "Candle body: open-to-close distance. Wicks: highest to lowest.", "260": "Different timeframes can give different impressions of the same asset.", "261": "A chart summarizes the past and does not guarantee what comes next.", "262": "The body of a candle shows...", "263": "The distance between the opening and closing price.", "264": "Trading volume.", "265": "Only the highest price.", "266": "The thin wicks above and below the body show the highest and lowest prices.", "267": "Why can a 1-day and a 1-year chart look opposite?", "268": "One of them is fake data.", "269": "Different timeframes capture different time spans.", "270": "Charts keep changing on their own.", "271": "Choose a timeframe that fits your goal and time frame.", "272": "Fundamental and technical analysis", "273": "Two commonly used viewpoints, and their limits.", "274": "<h3>Fundamental: is the business healthy and the price fair?</h3><p>Fundamental analysis studies a company through its financial statements and business prospects. Some commonly used measures:</p><ul><li><b>Earnings</b>: whether the company makes a profit, and whether it tends to grow.</li><li><b>P/E (price to earnings)</b>: share price divided by earnings per share. Shows how many times earnings the market pays for one share.</li><li><b>ROE</b>: earnings relative to shareholders' equity, a measure of efficiency.</li><li><b>Debt</b>: too much debt can endanger a company in hard times.</li><li><b>Dividends</b>: the portion of earnings paid out, if any.</li></ul><p>These numbers only become useful when compared with similar companies and with the company's own history. A low P/E can mean cheap, but it can also mean the market expects earnings to fall.</p>", "275": "<h3>Technical: what do price patterns say?</h3><p>Technical analysis studies price movement and volume. Two basic tools:</p><ul><li><b>Moving average (MA)</b>: the average closing price over the last several periods. It smooths daily movement so the trend is easier to see.</li><li><b>RSI</b>: a momentum measure from 0 to 100. A reading above 70 is often called overbought and below 30 oversold. That is a reading habit, not an automatic signal.</li></ul>", "276": "<h3>Try it yourself</h3><p>The chart below uses one year of IHSG data currently loaded in Finvest. Turn on MA 20 and MA 50, then see how the average lines always lag behind the price.</p><div data-widget=\"ma\"></div>", "277": "<h3>Its limits</h3><p>Both are aids to understanding, not answer machines. MA lags because it is computed from the past, and it often gives false signals when the price moves sideways.</p>", "278": "Fundamental judges the business and a fair price; technical reads price patterns.", "279": "A low P/E is not necessarily cheap. Find out why.", "280": "Technical indicators are not automatic buy or sell signals.", "281": "Does a low P/E always mean a cheap stock worth buying?", "282": "Yes, always.", "283": "No, you need to look at why the P/E is low, for example falling earnings.", "284": "It only applies to gold.", "285": "Ratios must be compared with similar companies and the company's own history.", "286": "A moving average (MA) is calculated from...", "287": "The average price over the last several periods.", "288": "A prediction of tomorrow's price.", "289": "Company earnings.", "290": "Because it is calculated from past data, MA always lags behind the price.", "291": "Diversification and risk management", "292": "Spreading risk, deciding position sizes, and why diversification does not remove risk.", "293": "<h3>Do not put all your eggs in one basket</h3><p>Diversification means spreading money across several assets that do not move exactly alike. If one falls, the others may not fall as deeply. You can spread across asset types, across sectors, and across time (buying in stages).</p>", "294": "<h3>Correlation determines the benefit</h3><p>Correlation measures how closely two assets move together, from 1 (always together) to -1 (always opposite). Two assets with high correlation give only a small diversification benefit. Move the settings below to see it.</p><div data-widget=\"divers\"></div>", "295": "<h3>Risk management practices</h3><ul><li><b>Limit position size</b>: decide the maximum loss you can accept on one asset, before buying.</li><li><b>Buy in stages</b>: spreading out purchase timing reduces the risk of buying everything at a bad time, though it does not guarantee better results.</li><li><b>Review regularly</b>: positions can drift as prices move. Check whether they still fit your goals.</li><li><b>Avoid borrowing to invest</b>: losses still have to be paid back.</li></ul>", "296": "<h3>Its limits</h3><p>Diversification reduces specific risk, but does not remove market risk. In a major crisis, many assets can fall at the same time.</p>", "297": "Diversification reduces the impact of one bad asset; it does not remove risk.", "298": "Low correlation gives a larger diversification benefit.", "299": "Set your loss limit before buying, not after.", "300": "The goal of diversification is...", "301": "To guarantee you never lose.", "302": "To reduce the impact of one bad asset on the whole.", "303": "To make sure you profit more.", "304": "Diversification reduces specific risk, but market risk remains.", "305": "Two assets that move very much together (high correlation) give a diversification benefit that is...", "306": "Larger.", "307": "Smaller.", "308": "The same.", "309": "If both fall together, spreading out does not help much.", "310": "Psychology and common mistakes", "311": "Emotions are often more dangerous than prices. Learn the common traps and the signs of fraud.", "312": "<h3>Behavioral traps</h3><dl class=\"defs\"><div><dt>FOMO</dt><dd>Fear of missing out. Buying because the price is surging, not because you understand the asset.</dd></div><div><dt>Panic selling</dt><dd>Selling when the price drops sharply, locking in a loss that may not have been necessary.</dd></div><div><dt>Overconfidence</dt><dd>Thinking a few wins mean you already understand. Markets can change.</dd></div><div><dt>Debt or leverage</dt><dd>Enlarging a position with borrowed money. Gains and losses both grow, and losses still have to be paid back.</dd></div></dl>", "313": "<h3>Signs of a suspicious investment</h3><ul><li>Promises high, fixed returns with no risk.</li><li>Pressures you to decide quickly or to recruit others for a bonus.</li><li>It is unclear where the returns come from.</li><li>The seller or platform has an unclear license. Check the list of licensed entities on the OJK website.</li></ul>", "314": "<h3>Helpful questions</h3><ul><li>Where do the returns on this investment come from?</li><li>What is the worst-case scenario, and can I bear it?</li><li>Does this fit my goals and time frame?</li></ul>", "315": "Write down your plan and loss limit before buying, so emotions do not take the lead.", "316": "High returns with no risk is a red flag.", "317": "Check the seller's license before sending money.", "318": "Which of these is a suspicious sign?", "319": "An offer of high, fixed returns with no risk.", "320": "Risks are explained and the seller is licensed.", "321": "Fees are written clearly.", "322": "Returns and risk go hand in hand. A promise of no risk is almost always misleading.", "323": "The price drops sharply and you panic. A healthier step is...", "324": "Sell everything now.", "325": "Revisit your plan and time frame before acting.", "326": "Add money by borrowing.", "327": "Decisions based on a plan are less often regretted than decisions made in a panic.", "328": "<h4>Eight possible paths over 5 years</h4><div class=\"ctl\"><div class=\"field\"><label for=\"pf\">Volatility</label><select class=\"input\" id=\"pf\"><option value=\"3\">Low (3% a year)</option><option value=\"15\" selected>Medium (15% a year)</option><option value=\"40\">High (40% a year)</option></select></div><button class=\"btn btn-sm\" type=\"button\" id=\"pr\">Reshuffle</button></div><div class=\"chart\"></div><p class=\"out\" id=\"po\" aria-live=\"polite\"></p>", "329": "Of 8 paths starting at 100: lowest final value ", "330": ", highest ", "331": ". This is an illustration, not a prediction.", "333": "Eight simulated paths", "334": "Start", "335": "<h4>Example candlesticks (24 periods, simulated)</h4><div class=\"chart\"></div><div class=\"row\" style=\"margin-top:8px\"><button class=\"btn btn-sm\" type=\"button\" id=\"cp\">Previous</button><button class=\"btn btn-sm\" type=\"button\" id=\"cn\">Next</button></div><p class=\"out\" id=\"co\" aria-live=\"polite\"></p>", "336": "<b>Period ", "337": "</b>: opened at ", "338": ", closed at ", "339": "). Highest ", "340": ", lowest ", "341": ". The price range during this period ", "343": "<h4>IHSG 1 year with moving averages</h4><div class=\"ctl\"><label class=\"check\"><input type=\"checkbox\" id=\"m20\" checked> MA 20</label><label class=\"check\"><input type=\"checkbox\" id=\"m50\"> MA 50</label></div><div class=\"chart\"></div><p class=\"out\">The average line only turns after the price turns. That is why MA is called a lagging indicator.</p>", "346": "<h4>Example blend of two assets</h4><div class=\"ctl\"><div class=\"field\"><div class=\"rangeval\"><label for=\"dw\">Share of asset A</label><b id=\"dwv\"></b></div><input type=\"range\" id=\"dw\" min=\"0\" max=\"100\" step=\"2\" value=\"50\"></div><div class=\"field\"><div class=\"rangeval\"><label for=\"dr\">Correlation of A and B</label><b id=\"drv\"></b></div><input type=\"range\" id=\"dr\" min=\"-50\" max=\"100\" step=\"5\" value=\"30\"></div></div><div class=\"chart\"></div><p class=\"out\" id=\"do\" aria-live=\"polite\"></p>", "348": "Volatility of a two-asset blend", "349": "% B</b><span>Volatility ", "350": "Blend volatility: <b>", "351": "%</b> a year. Asset A alone ", "352": "%, asset B alone ", "353": "%. These example figures are only an illustration.", "354": "Conservative (similar to money market or deposits)", "355": "Fixed income (bonds)", "356": "Mix of stocks and bonds", "357": "Stocks (broad index)", "358": "Highly volatile assets", "359": "<div class=\"kpis\"><div><span>Total contributed</span><b>", "360": "</b><small>initial capital + monthly contributions</small></div>", "361": "<div><span>Middle value (median)</span><b>", "362": "</b><small>half of scenarios are above this</small></div>", "363": "<div><span>Weaker scenario</span><b>", "364": "</b><small>10% of scenarios are below this</small></div>", "365": "<div><span>Stronger scenario</span><b>", "366": "</b><small>10% of scenarios are above this</small></div>", "367": "<div><span>Final value &lt; contributions</span><b>", "368": "%</b><small>of ", "369": " scenarios</small></div></div>", "370": "<div class=\"keyline\"><span><i style=\"background:var(--accent);opacity:.25\"></i>80% of scenarios (P10 to P90)</span><span><i style=\"background:var(--accent);opacity:.5\"></i>middle 50% of scenarios (P25 to P75)</span><span><i style=\"background:var(--accent)\"></i>Median</span><span><i style=\"background:var(--ink-3);height:2px\"></i>Total contributed</span></div>", "371": "<p class=\"fine\">How to read it: the band shows the spread of outcomes from ", "372": " random paths using the assumptions on the left. This is an illustration to understand uncertainty, not a prediction and not historical data. Taxes, fees, and inflation are not included.</p>", "377": "Spread of simulated portfolio values", "378": "</b><span>Median ", "379": "</span><span>Contributions ", "380": "</span><em>SIMULATED</em>", "382": "<div class=\"seg\" role=\"group\" aria-label=\"Choose timeframe\">", "390": "<section class=\"hero\"><div><p class=\"eyebrow\">Learn investing &middot; Track markets</p><h1>Understand the <em>risk</em> first, then watch the market.</h1><p class=\"lead\">Learn investing from scratch in simple language, then follow many instruments on one screen. No promises of profit and no buy or sell recommendations.</p><div class=\"cta\"><a class=\"btn btn-primary\" href=\"#belajar\">Start learning from zero</a><a class=\"btn\" href=\"#pasar\">Open market dashboard</a></div></div>", "391": "<figure class=\"hero-chart card\" style=\"margin:0\"><div class=\"seg hero-pick\" role=\"group\" aria-label=\"Choose asset for the chart\">", "395": "<section class=\"section\"><h2>Two ways in</h2><div class=\"paths\"><article class=\"card path\"><p class=\"eyebrow\">For beginners</p><h3>I'm just starting</h3><ol><li>Read the basics of investing and get to know the instruments.</li><li>Understand risk, price charts, and how to spread your money.</li><li>Try the simulator to see the range of possible outcomes.</li></ol><a class=\"btn btn-primary\" href=\"#belajar\">Start learning</a></article>", "396": "<article class=\"card path\"><p class=\"eyebrow\">For those already investing</p><h3>I need monitoring tools</h3><ol><li>Build a dashboard of 1, 2, or 4 charts as you need.</li><li>Add assets to a watchlist and compare their performance.</li><li>Set price alerts to watch while the page is open.</li></ol><a class=\"btn btn-primary\" href=\"#pasar\">Open dashboard</a></article></div></section>", "397": "<section class=\"section\"><h2>Market snapshot</h2><p class=\"fine\" style=\"margin:-8px 0 12px\">", "398": "<section class=\"section\"><h2>Product principles</h2><div class=\"principles\"><div class=\"card\"><b>Neutral</b><span>Education does not promise profit.</span></div><div class=\"card\"><b>Risk explained</b><span>Simple language, including the less pleasant scenarios.</span></div><div class=\"card\"><b>No recommendations</b><span>No automatic buy or sell advice.</span></div><div class=\"card\"><b>Transparent data</b><span>Every price shows its status and update time.</span></div></div></section>", "399": "<section class=\"section\" id=\"status\"><h2>Data status</h2><div class=\"legend\"><div class=\"card\"><span class=\"badge live\">ACTUAL</span><span class=\"t\">Prices from a market source, shown with the source name and update time.</span></div><div class=\"card\"><span class=\"badge delayed\">DELAYED</span><span class=\"t\">Market data with a lag. In Finvest the lag follows the data fetch schedule, and the time of the latest data is written near the price.</span></div><div class=\"card\"><span class=\"badge sim\">SIMULATED</span><span class=\"t function niceTicks(min,max,n){var span=max-min||1;var s0=span/(n-1);var mag=Math.pow(10,Math.floor(Math.log10(s0)));var nm=s0/mag;var step=(nm<1.5?1:nm<3?2:nm<7?5:10)*mag;var start=Math.ceil(min/step)*step;var out=[];for(var v=start;v<=max+1e-9&&out.length<8;v+=step)out.push(v);return out;}

function alignSeries(ids,tf){
  var ser=ids.map(function(id){return Market.series(id,tf);}),set={},k;
  ser.forEach(function(s){s.t.forEach(function(t){set[t]=1;});});
  var grid=Object.keys(set).map(Number).sort(function(a,b){return a-b;});
  var cols=ser.map(function(s){var out=[],p=0,last=NaN;for(k=0;k<grid.length;k++){while(p<s.t.length&&s.t[p]<=grid[k]){last=s.v[p];p++;}out.push(last);}return out;});
  var start=0;
  while(start<grid.length&&cols.some(function(c){return !isFinite(c[start]);}))start++;
  if(start>=grid.length-1)start=0;
  return {t:grid.slice(start),cols:cols.map(function(c){return c.slice(start);}),intraday:ser.some(function(s){return s.intraday;})};
}

}

   Charts: dependency-free SVG line / band chart + candlesticks

var uid=0;
function pathOf(vals,X,Y){var d='',pen=false;for(var i=0;i<vals.length;i++){var v=vals[i];if(!isFinite(v)){pen=false;continue;}d+=(pen?'L':'M')+X(i).toFixed(1)+' '+Y(v).toFixed(1);pen=true;}return d;}
function drawLine(host,cfg){
  var W=host.clientWidth,H=host.clientHeight;if(W<20||H<20)return;
  var axis=cfg.axis||false;
  var m={l:axis==='left'?50:4,r:cfg.endLabels?100:(axis==='right'?58:4),t:axis?10:4,b:axis?22:4};
  if(axis==='left'&&!cfg.endLabels)m.r=8;
  var iw=W-m.l-m.r,ih=H-m.t-m.b,S=cfg.series,n=S[0].v.length,min=Infinity,max=-Infinity;
  function consider(v){if(isFinite(v)){if(v<min)min=v;if(v>max)max=v;}}
  S.forEach(function(s){s.v.forEach(consider);});
  (cfg.bands||[]).forEach(function(b){b.lo.forEach(consider);b.hi.forEach(consider);});
  if(cfg.baseline!=null)consider(cfg.baseline);
  if(!isFinite(min))return;
  if(max===min){max+=1;min-=1;}
  var pv=(max-min)*0.08;min-=pv;max+=pv;
  var X=function(i){return m.l+(n<2?0:i/(n-1)*iw);};
  var Y=function(v){return m.t+(1-(v-min)/(max-min))*ih;};
  var gid='g'+(++uid);
  var svg='<svg width="'+W+'" height="'+H+'" viewBox="0 0 '+W+' '+H+'" role="img" aria-label="'+esc(cfg.label||_t(125,'Grafik'))+'">';
  if(axis){
    niceTicks(min,max,5).forEach(function(t){
      var y=Y(t);
      svg+='<line class="gl" x1="'+m.l+'" x2="'+(W-m.r)+'" y1="'+y.toFixed(1)+'" y2="'+y.toFixed(1)+'"/>';
      var lx=axis==='left'?m.l-6:W-m.r+6;
      svg+='<text class="al" x="'+lx+'" y="'+(y+4).toFixed(1)+'" text-anchor="'+(axis==='left'?'end':'start')+'">'+esc(cfg.yFmt?cfg.yFmt(t):nf(t))+'</text>';
    });
    if(cfg.xLabel){
      [0,1/3,2/3,1].forEach(function(f,k){
        var i=Math.round(f*(n-1));
        svg+='<text class="al" x="'+X(i).toFixed(1)+'" y="'+(H-6)+'" text-anchor="'+(k===0?'start':k===3?'end':'middle')+'">'+esc(cfg.xLabel(i))+'</text>';
      });
    }
  }
  (cfg.bands||[]).forEach(function(b){
    var d='',i;
    for(i=0;i<n;i++)d+=(i?'L':'M')+X(i).toFixed(1)+' '+Y(b.hi[i]).toFixed(1);
    for(i=n-1;i>=0;i--)d+='L'+X(i).toFixed(1)+' '+Y(b.lo[i]).toFixed(1);
    svg+='<path d="'+d+'Z" style="fill:'+b.color+';opacity:'+(b.opacity||.15)+'"/>';
  });
  if(cfg.baseline!=null)svg+='<line class="bl" x1="'+m.l+'" x2="'+(W-m.r)+'" y1="'+Y(cfg.baseline).toFixed(1)+'" y2="'+Y(cfg.baseline).toFixed(1)+'"/>';
  if(cfg.area){
    var s0=S[0],bot=(m.t+ih).toFixed(1);
    var d0=pathOf(s0.v,X,Y)+'L'+X(n-1).toFixed(1)+' '+bot+'L'+X(0).toFixed(1)+' '+bot+'Z';
    svg+='<defs><linearGradient id="'+gid+'" x1="0" y1="0" x2="0" y2="1"><stop offset="0" style="stop-color:'+s0.color+';stop-opacity:.24"/><stop offset="1" style="stop-color:'+s0.color+';stop-opacity:0"/></linearGradient></defs><path d="'+d0+'" fill="url(#'+gid+')"/>';
  }
  S.forEach(function(s){
    svg+='<path d="'+pathOf(s.v,X,Y)+'" fill="none" style="stroke:'+s.color+'" stroke-width="'+(s.width||2)+'" stroke-linejoin="round" stroke-linecap="round"'+(s.dash?' stroke-dasharray="'+s.dash+'"':'')+' opacity="'+(s.opacity||1)+'"/>';
  });
  if(!cfg.noDots){
    S.forEach(function(s,k){
      if(k>0&&!cfg.endLabels)return;
      var lv=s.v[n-1];if(!isFinite(lv))return;
      svg+='<circle cx="'+X(n-1).toFixed(1)+'" cy="'+Y(lv).toFixed(1)+'" r="3.2" style="fill:'+s.color+'"/>';
    });
  }
  if(cfg.endLabels){
    var items=S.map(function(s,k){return {y:Y(s.v[n-1]),k:k};}).sort(function(a,b){return a.y-b.y;});
    for(var q=1;q<items.length;q++){if(items[q].y-items[q-1].y<15)items[q].y=items[q-1].y+15;}
    items.forEach(function(it){svg+='<text class="el" x="'+(W-m.r+8)+'" y="'+(it.y+4).toFixed(1)+'" style="fill:'+S[it.k].color+'">'+esc(cfg.endLabels[it.k])+'</text>';});
  }
  if(cfg.marker!=null){
    var mx=X(cfg.marker).toFixed(1);
    svg+='<line class="ch" x1="'+mx+'" x2="'+mx+'" y1="'+m.t+'" y2="'+(m.t+ih)+'" stroke-dasharray="4 3"/>';
    svg+='<circle cx="'+mx+'" cy="'+Y(S[0].v[cfg.marker]).toFixed(1)+'" r="5" style="fill:'+S[0].color+'" stroke="var(--surface)" stroke-width="2"/>';
  }
  if(cfg.tip){
    svg+='<line class="ch" display="none" x1="0" x2="0" y1="'+m.t+'" y2="'+(m.t+ih)+'"/>';
    S.forEach(function(s){svg+='<circle class="hd" display="none" r="4" style="fill:'+s.color+'"/>';});
    svg+='<rect class="ov" x="'+m.l+'" y="0" width="'+iw+'" height="'+H+'" fill="transparent"/>';
  }
  svg+='</svg>';
  host.innerHTML=svg+(cfg.tip?'<div class="tip" hidden></div>':'');
  if(!cfg.tip)return;
  var ov=$('.ov',host),ch=$('line.ch:not([stroke-dasharray])',host),tip=$('.tip',host),dots=$$('.hd',host);
  function move(e){
    var b=host.getBoundingClientRect(),x=e.clientX-b.left;
    var i=clamp(Math.round((x-m.l)/iw*(n-1)),0,n-1);
    ch.setAttribute('x1',X(i));ch.setAttribute('x2',X(i));ch.removeAttribute('display');
    dots.forEach(function(d,k){var v=S[k].v[i];if(isFinite(v)){d.setAttribute('cx',X(i));d.setAttribute('cy',Y(v));d.removeAttribute('display');}else d.setAttribute('display','none');});
    tip.innerHTML=cfg.tip(i);tip.hidden=false;
    var tw=tip.offsetWidth,left=X(i)+12;if(left+tw>W-4)left=X(i)-tw-12;
    tip.style.left=Math.max(4,left)+'px';tip.style.top='4px';
    host.dataset.hover='1';
  }
  function leave(){ch.setAttribute('display','none');dots.forEach(function(d){d.setAttribute('display','none');});tip.hidden=true;delete host.dataset.hover;}
  ov.addEventListener('pointermove',move);ov.addEventListener('pointerdown',move);
  ov.addEventListener('pointerleave',leave);ov.addEventListener('pointercancel',leave);
}
var Charts={
  reg:new Map(),
  mount:function(host,fn){if(!host)return;this.reg.set(host,fn);this.draw(host);},
  draw:function(host){var fn=this.reg.get(host);if(!fn)return;if(!host.isConnected){this.reg.delete(host);return;}drawLine(host,fn());},
  redrawAll:function(skipHover){var self=this;Array.from(this.reg.keys()).forEach(function(h){if(!h.isConnected){self.reg.delete(h);return;}if(skipHover&&h.dataset.hover==='1')return;self.draw(h);});},
  clearPage:function(){this.reg.clear();}
};
function yDec(vals){var mn=Math.min.apply(null,vals),mx=Math.max.apply(null,vals),sp=mx-mn;return sp<5?2:sp<50?1:0;}

function priceCfg(id,tf,opts){
  opts=opts||{};
  var a=BY[id],s=Market.series(id,tf),v=s.v,up=v[v.length-1]>=v[0];
  var series=[{v:v,color:up?'var(--up)':'var(--down)',width:2}];
  (opts.ma||[]).forEach(function(p,k){series.push({v:sma(v,p),color:k?'var(--s2)':'var(--s1)',width:1.4,dash:k?'5 3':null});});
  var dec=yDec(v),st=STATUS[Market.status(id)].label;
  return {series:series,area:true,axis:opts.noAxis?false:'right',baseline:v[0],noDots:false,
    label:_t(166,'Grafik harga ')+a.name+', '+TFS[tf].name+' ('+statusLong(id)+')',
    yFmt:function(t){return nf(t,dec);},xLabel:function(i){return xText(tf,s,i);},
    tip:opts.noTip?null:function(i){return '<b>'+esc(fmtPrice(a,v[i]))+'</b><span>'+esc(s.intraday?fmtDateTime(s.t[i]):fmtDate(s.t[i]))+'</span><em>'+st+'</em>';}};
}
function sparkCfg(id,tf){var v=Market.series(id,tf).v,up=v[v.length-1]>=v[0];return {series:[{v:v,color:up?'var(--up)':'var(--down)',width:1.6}],noDots:true,label:_t(169,'Grafik mini ')+BY[id].name};}
function mountSparks(root){$$('[data-spark]',root).forEach(function(h){Charts.mount(h,function(){return sparkCfg(h.dataset.spark,h.dataset.tf||Store.state.tf);});});}

function drawCandles(host,candles,sel){
  var W=host.clientWidth,H=host.clientHeight;if(W<20||H<20)return;
  var mn=Infinity,mx=-Infinity;candles.forEach(function(c){mn=Math.min(mn,c.l);mx=Math.max(mx,c.h);});
  var pv=(mx-mn)*0.08;mn-=pv;mx+=pv;
  var m={l:4,r:44,t:8,b:8},iw=W-m.l-m.r,ih=H-m.t-m.b,n=candles.length,cw=iw/n;
  var Y=function(v){return m.t+(1-(v-mn)/(mx-mn))*ih;};
  var svg='<svg width="'+W+'" height="'+H+'" viewBox="0 0 '+W+' '+H+_t(174,'" role="img" aria-label="Grafik candlestick contoh, 24 batang">');
  niceTicks(mn,mx,4).forEach(function(t){svg+='<line class="gl" x1="'+m.l+'" x2="'+(W-m.r)+'" y1="'+Y(t).toFixed(1)+'" y2="'+Y(t).toFixed(1)+'"/><text class="al" x="'+(W-m.r+6)+'" y="'+(Y(t)+4).toFixed(1)+'">'+nf(t,0)+'</text>';});
  candles.forEach(function(c,i){
    var x=m.l+i*cw+cw/2,up=c.c>=c.o,col=up?'var(--up)':'var(--down)',bw=Math.max(3,cw*0.58);
    var top=Y(Math.max(c.o,c.c)),bot=Y(Math.min(c.o,c.c));
    if(i===sel)svg+='<rect x="'+(m.l+i*cw).toFixed(1)+'" y="'+m.t+'" width="'+cw.toFixed(1)+'" height="'+ih+'" style="fill:var(--accent-soft)"/>';
    svg+='<g data-i="'+i+'" style="cursor:pointer"><rect x="'+(m.l+i*cw).toFixed(1)+'" y="0" width="'+cw.toFixed(1)+'" height="'+H+'" fill="transparent"/><line x1="'+x.toFixed(1)+'" x2="'+x.toFixed(1)+'" y1="'+Y(c.h).toFixed(1)+'" y2="'+Y(c.l).toFixed(1)+'" style="stroke:'+col+'" stroke-width="1.5"/><rect x="'+(x-bw/2).toFixed(1)+'" y="'+top.toFixed(1)+'" width="'+bw.toFixed(1)+'" height="'+Math.max(2,bot-top).toFixed(1)+'" rx="1.5" style="fill:'+col+'"/></g>';
  });
  host.innerHTML=svg+'</svg>';
}
